<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RoamCore</title>
  <meta name="description" content="RoamCore — Home Assistant for van life." />
  <style>
    :root{
      --bg: #070A0F;
      --panel: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.10);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.65);
      --accent: #7CFFB2;
      --accent2: #5BE3FF;
    }
    body{margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; background: radial-gradient(1000px 800px at 20% 10%, rgba(91,227,255,0.10), transparent 60%), radial-gradient(900px 700px at 80% 40%, rgba(124,255,178,0.10), transparent 60%), var(--bg); color: var(--text);}
    .wrap{max-width: 980px; margin: 0 auto; padding: 64px 20px;}
    .card{border:1px solid var(--border); background: var(--panel); border-radius: 18px; padding: 22px;}
    h1{font-size: 44px; letter-spacing: -0.02em; margin: 0 0 10px;}
    p{margin: 10px 0; color: var(--muted); line-height: 1.5;}
    .row{display:flex; gap:12px; flex-wrap:wrap; margin-top: 16px;}
    a.btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; padding: 12px 14px; border-radius: 14px; text-decoration:none; font-weight: 800; border:1px solid rgba(255,255,255,0.12);}
    a.primary{background: linear-gradient(135deg, rgba(124,255,178,0.18), rgba(91,227,255,0.14)); color: var(--text);}
    a.ghost{background: rgba(255,255,255,0.03); color: var(--text);}
    .mini{font-size: 13px; color: var(--muted); margin-top: 18px;}
    code{background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>RoamCore</h1>
      <p>Home Assistant, tuned for van life. Clear dashboards, sensible defaults, and a catalog of integrations you can add as your build evolves.</p>

      <div class="row">
        <a class="btn primary" href="/docs/">Open Docs Catalog</a>
        <a class="btn ghost" href="https://github.com/roamcore/RoamCore">GitHub Repo</a>
        <a class="btn ghost" href="/docs/catalog/">Browse Integrations</a>
      </div>

      <p class="mini">Tip: the docs are generated from the repo, so they stay in sync with the latest RoamCore build.</p>
    </div>
  </div>
</body>
</html>
