# RoamCore — Lovelace Dashboard (paste this into the Raw Configuration Editor)
#
# This uses the RoamCore custom Lovelace cards (already deployed to /config/www/roamcore/).
# Before this dashboard works, you MUST register these 4 JS resources in the HA UI:
#
#   Settings → Dashboards → Resources → + Add Resource (4 times):
#     URL: /local/roamcore/roamcore-dashboard.js          Type: JavaScript Module
#     URL: /local/roamcore/roamcore-pages.js              Type: JavaScript Module
#     URL: /local/roamcore/roamcore-tiles.js              Type: JavaScript Module
#     URL: /local/roamcore/roamcore-victron-connect.js    Type: JavaScript Module
#
# After registering, hard-refresh the browser (Ctrl+Shift+R / Cmd+Shift+R).
#
# How to install:
#   1. Settings → Dashboards → Add Dashboard → "RoamCore"
#   2. Open the new RoamCore dashboard
#   3. ⋮ → Edit dashboard → Raw configuration
#   4. Delete everything in the editor, paste this whole file
#   5. Save → Done

title: RoamCore
views:

  # ────────────────────────────────────────────────────────────────
  # Home — the main RoamCore overview (uses the primary custom card)
  # ────────────────────────────────────────────────────────────────
  - path: home
    title: Dashboard
    icon: mdi:home
    panel: true
    cards:
      - type: custom:roamcore-dashboard-card

  # ────────────────────────────────────────────────────────────────
  # Power — Victron connect + power detail
  # ────────────────────────────────────────────────────────────────
  - path: power
    title: Power
    icon: mdi:lightning-bolt
    panel: false
    cards:
      - type: vertical-stack
        cards:
          - type: custom:roamcore-victron-connect
            title: Victron (Connect)
          - type: custom:roamcore-power-page

  # ────────────────────────────────────────────────────────────────
  # Network — WAN/LTE/Starlink status
  # ────────────────────────────────────────────────────────────────
  - path: network
    title: Network
    icon: mdi:wifi
    panel: true
    cards:
      - type: custom:roamcore-network-page

  # ────────────────────────────────────────────────────────────────
  # Location / GPS
  # ────────────────────────────────────────────────────────────────
  - path: location
    title: Location
    icon: mdi:map-marker
    panel: true
    cards:
      - type: custom:roamcore-location-page

  # ────────────────────────────────────────────────────────────────
  # Map (embedded, uses Traccar proxy)
  # ────────────────────────────────────────────────────────────────
  - path: map
    title: Map
    icon: mdi:map
    panel: true
    cards:
      - type: iframe
        url: /traccar/
        aspect_ratio: 75%

  # ────────────────────────────────────────────────────────────────
  # Traccar (full UI, auto-login via RoamCore proxy)
  # ────────────────────────────────────────────────────────────────
  - path: traccar
    title: Traccar
    icon: mdi:map-clock
    panel: true
    cards:
      - type: iframe
        url: /api/roamcore/traccar/
        aspect_ratio: 75%

  # ────────────────────────────────────────────────────────────────
  # Level — levelling page with tilt animation
  # ────────────────────────────────────────────────────────────────
  - path: level
    title: Level
    icon: mdi:spirit-level
    panel: true
    cards:
      - type: custom:roamcore-level-page

  # ────────────────────────────────────────────────────────────────
  # Settings
  # ────────────────────────────────────────────────────────────────
  - path: settings
    title: Settings
    icon: mdi:cog
    panel: true
    cards:
      - type: custom:roamcore-settings-page

  # ────────────────────────────────────────────────────────────────
  # Setup wizard (guided first-run)
  # ────────────────────────────────────────────────────────────────
  - path: setup
    title: Setup
    icon: mdi:magic-staff
    panel: true
    cards:
      - type: custom:roamcore-setup-page

  # ────────────────────────────────────────────────────────────────
  # Diagnostics
  # ────────────────────────────────────────────────────────────────
  - path: diagnostics
    title: Diagnostics
    icon: mdi:stethoscope
    panel: true
    cards:
      - type: custom:roamcore-diagnostics-page

  # ────────────────────────────────────────────────────────────────
  # Status — stock entities view of backend health
  # (safe fallback if any custom card JS hasn't loaded yet)
  # ────────────────────────────────────────────────────────────────
  - path: status
    title: Status
    icon: mdi:heart-pulse
    panel: false
    cards:
      - type: entities
        title: Power backend (Victron)
        entities:
          - entity: binary_sensor.rc_system_power_backend_connected
          - entity: sensor.rc_system_power_backend_status
          - entity: sensor.rc_system_power_backend_snapshot_state
          - entity: sensor.rc_system_power_backend_devices
          - entity: sensor.rc_system_power_backend_topics

      - type: entities
        title: Networking (rc_net_*)
        entities:
          - entity: sensor.rc_net_wan_status
          - entity: sensor.rc_net_wan_source
          - entity: sensor.rc_net_ping
          - entity: sensor.rc_net_download
          - entity: sensor.rc_net_upload
          - entity: sensor.rc_net_packet_loss
          - entity: sensor.rc_net_jitter
          - entity: sensor.rc_net_uptime
          - entity: sensor.rc_net_last_disconnect
