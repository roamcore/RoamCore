site_name: RoamCore
site_description: "RoamCore Docs — Home Assistant for van life"
site_url: https://roamcore.co.uk/docs/

repo_name: roamcore/RoamCore
repo_url: https://github.com/roamcore/RoamCore
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: public/docs

theme:
  name: material
  language: en
  logo: null
  favicon: null
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: slate
      primary: black
      accent: teal

extra_css:
  - styles/rc.css

extra_javascript:
  - javascripts/catalog-filter.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Catalog:
      - Browse all: catalog/index.md
      - Comfort: catalog/comfort/index.md
      - Connectivity: catalog/connectivity/index.md
      - Location: catalog/location/index.md
      - Maintenance: catalog/maintenance/index.md
      - Misc: catalog/misc/index.md
      - Safety: catalog/safety/index.md
      - Security: catalog/security/index.md
      - Water: catalog/water/index.md
      - Automation: catalog/automation/index.md
  - Technical (advanced):
      - Install: howto/homeassistant-installer.md
      - Troubleshooting: guides/troubleshooting.md
      - Support bundle: howto/support-bundle.md
      - Entity naming: reference/rc-entity-naming.md
      - OpenClaw JSON API: reference/openclaw-json-api.md
