site_name: RoamCore
site_description: "RoamCore Docs — Home Assistant for van life"
site_url: https://roamcore.co.uk/docs/

repo_name: roamcore/RoamCore
repo_url: https://github.com/roamcore/RoamCore
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: public/docs

theme:
  name: material
  language: en
  logo: null
  favicon: null
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.path
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: slate
      primary: black
      accent: teal

extra_css:
  - styles/rc.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - Quick start: howto/homeassistant-installer.md
      - Support bundle: howto/support-bundle.md
      - Troubleshooting: guides/troubleshooting.md
  - Catalog:
      - Overview: catalog/index.md
      - Power: catalog/power/README.md
      - "  ↳ Victron": catalog/power/victron.md
      - "  ↳ Victron Auto add-on": catalog/power/victron-auto-addon.md
      - Water: catalog/water/README.md
      - "  ↳ Water tanks": catalog/water/water-tanks.md
      - Map: catalog/map/README.md
      - "  ↳ Map dashboard": catalog/map/map-dashboard.md
      - "  ↳ Traccar": catalog/map/traccar.md
      - "  ↳ Trip Wrapped": catalog/map/trip-wrapped.md
      - "  ↳ Offline tileserver": catalog/map/offline-tileserver.md
      - Weather: catalog/weather/README.md
      - "  ↳ Weather entities": catalog/weather/weather-entities.md
      - Time: catalog/time/README.md
      - "  ↳ Timezone auto-detection": catalog/time/timezone-geolocator.md
      - CCTV: catalog/cctv/README.md
      - "  ↳ Frigate CCTV": catalog/cctv/frigate.md
      - AI: catalog/ai/README.md
      - "  ↳ OpenClaw JSON API": catalog/ai/openclaw-json-api.md
      - "  ↳ Agent actions allowlist": catalog/ai/agent-actions-allowlist.md
      - "  ↳ Mode": catalog/ai/mode.md
