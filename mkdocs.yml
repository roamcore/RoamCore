site_name: RoamCore
site_description: "RoamCore Docs — Home Assistant for van life"
site_url: https://roamcore.co.uk/docs/

repo_name: roamcore/RoamCore
repo_url: https://github.com/roamcore/RoamCore
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: public/docs

theme:
  name: material
  language: en
  logo: null
  favicon: null
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: slate
      primary: black
      accent: teal

extra_css:
  - styles/rc.css

extra_javascript:
  - javascripts/catalog-filter.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Catalog:
      - Browse all: catalog/index.md
      - Power: catalog/power/README.md
      - Water: catalog/water/README.md
      - Map: catalog/map/README.md
      - Weather: catalog/weather/README.md
      - Time: catalog/time/README.md
      - CCTV: catalog/cctv/README.md
      - AI: catalog/ai/README.md
      - HVAC: catalog/hvac/README.md
      - Networking: catalog/networking/README.md
      - Fans: catalog/fans/README.md
      - Safety: catalog/safety/README.md
      - Remote Access: catalog/remote-access/README.md
      - Vehicle OBD: catalog/vehicle-obd/README.md
      - Lighting: catalog/lighting/README.md
      - Bed Lift: catalog/bed-lift/README.md
      - NFC Tags: catalog/nfc-tags/README.md
      - Audio/Media: catalog/audio-media/README.md
      - Homelab: catalog/homelab/README.md
      - Level Sensor: catalog/level-sensor/README.md
  - Technical (advanced):
      - Install: howto/homeassistant-installer.md
      - Troubleshooting: guides/troubleshooting.md
      - Support bundle: howto/support-bundle.md
      - Entity naming: reference/rc-entity-naming.md
      - OpenClaw JSON API: reference/openclaw-json-api.md
