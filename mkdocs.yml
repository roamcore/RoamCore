      - "  ↳ Smoke/CO/Gas sensors": catalog/safety/smoke-co-gas-sensors.md
      - "  ↳ Deadbolts": catalog/safety/deadbolts.md
      - Remote Access: catalog/remote-access/README.md
      - "  ↳ Tailscale": catalog/remote-access/tailscale.md
      - Vehicle OBD: catalog/vehicle-obd/README.md
