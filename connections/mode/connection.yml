wizard:
  connection_kind: recipe
  one_tap: false
  auto_discover: false
  estimated_time: "~30 min"
  requires_reboot: false
  setup_notes: |
    Mode requires the operator to (a) install the upstream
    HA core `input_select` + `input_boolean` + `input_text`
    + `input_button` + `input_number` helpers (HA core
    since 2022.x — these are auto-installed in every HA
    install + exposed via the HA UI under Settings →
    Helpers), (b) wire the upstream GPS speed +
    ignition-on input + presence detection + plug-state
    + time-of-day primitives (the operator uses their
    existing HA integrations — Traccar for GPS + the
    ignition-on input from the vehicle + the HA Companion
    app for presence + the plug-state from the shore-power
    integration + the time-of-day from the time-atomic
    Wave 3 #55 connection), (c) configure the operator-
    facing `select.rc_mode_state` + `select.rc_mode_state_
    previous` + `binary_sensor.rc_mode_is_auto_inferred`
    + `binary_sensor.rc_mode_is_manual_override` +
    `sensor.rc_mode_changed_at` + `sensor.rc_mode_
    inference_confidence` + `text.rc_mode_ai_summary`
    contract tiles to point at the upstream entities, (d)
    wire the FIVE §9 MANDATORY automations (auto-mode
    inference from GPS + motion + plug + time-of-day +
    manual override + auto-revert + confirm-before-power-
    changing-action guard + stealth-mode audit-log entry +
    mode-change notification), (e) optionally enable the
    Conversation agent (HA core since 2022.x — Settings →
    Voice assistants → Conversation agent) + add the
    optional operator-selected LLM add-ons (since 2023.x
    — Settings → Integrations → add the LLM provider) for
    the opt-in AI inference summary. RoamCore does NOT
    maintain a custom mode engine; the HA core `input_
    select` + `input_boolean` + `input_text` + `input_
    button` helpers + the HA core `template:` sensor +
    `template:` binary_sensor wrappers + the HA core
    Conversation agent + the optional operator-selected
    LLM add-ons handle 95%+ of operator-facing mode
    operators.

