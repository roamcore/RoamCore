wizard:
  connection_kind: recipe
  one_tap: false
  auto_discover: false
  estimated_time: "~10 min"
  requires_reboot: false
  setup_notes: |
    Map dashboard requires the operator to (a) confirm
    the three RoamCore-owned packages are loaded via the
    standard HA `packages:` mechanism (the packages at
    `homeassistant/packages/roamcore_map.yaml` +
    `homeassistant/packages/roamcore_map_route.yaml` +
    `homeassistant/packages/roamcore_location.yaml` are
    already shipped + RoamCore-owned + preserved verbatim
    by this slice — the package contents are NOT
    redefined), (b) configure the operator-facing
    `input_text.rc_location_tracker_entity` to point at
    the operator's chosen `device_tracker.*` (typically
    `device_tracker.traccar_van` if Traccar is the
    upstream source, or a phone-derived device_tracker
    if the HA Companion app is the upstream source), (c)
    configure the operator-facing
    `input_text.rc_map_tile_url` +
    `input_text.rc_map_tile_url_online` +
    `input_text.rc_map_style_url` +
    `input_number.rc_map_offline_max_zoom` +
    `input_number.rc_map_route_device_id` helpers to
    point at the operator's chosen upstream tile
    servers, (d) populate the 10 `rc_map_*` contract
    tiles (`device_tracker.rc_map_device_tracker` +
    `sensor.rc_map_latitude` +
    `sensor.rc_map_longitude` +
    `sensor.rc_map_accuracy_meters` +
    `sensor.rc_map_speed_kph` +
    `sensor.rc_map_bearing_degrees` +
    `binary_sensor.rc_map_has_fix` +
    `binary_sensor.rc_map_internet_reachable_for_tiles`
    + `sensor.rc_map_basemap_mode` +
    `select.rc_map_trip_overlay`) to mirror the upstream
    state, (e) wire the FIVE §9 MANDATORY automations
    (§9.1 basemap-mode-online-requires-internet-
    reachability guard + §9.2 basemap-mode-cached-
    prefers-local-tile-archive guard + §9.3 basemap-
    mode-fallback to offline when tile servers
    unreachable + §9.4 has-fix-blocks-tile-flicker
    guard + §9.5 trip-overlay-active-only-when-vehicle-
    moving guard), (f) follow the FIVE-step operator-
    pickable map flow — Step 1 Configure the
    device_tracker (set
    `input_text.rc_location_tracker_entity` to the
    operator's chosen `device_tracker.*`; the §9.4
    has-fix-blocks-tile-flicker guard ensures the map
    does not flicker between stale + fresh fixes);
    Step 2 Pick a basemap mode (the operator picks the
    `select.rc_map_basemap_mode_user_pick` (Off /
    Online / Cached / Offline; default Online); the
    §9.3 basemap-mode-fallback automation auto-falls-
    back to Offline when the upstream tile servers are
    unreachable); Step 3 Pick a trip overlay (the
    operator picks the `select.rc_map_trip_overlay` (Off
    / Active / Recent-7d / All-Time; default Off); the
    §9.5 trip-overlay-active-only-when-vehicle-moving
    guard keeps the trip overlay from rendering when
    the vehicle is parked); Step 4 Verify the map
    renders (operator opens the Lovelace map card +
    confirms the current location + the trip overlay
    + the basemap-mode chip render); Step 5 Toggle
    between Online / Cached / Offline (operator toggles
    the basemap mode to test the §9.3 fallback
    automation). RoamCore does NOT maintain a custom
    map-dashboard integration; the HA core `map:` card
    is the actual surface (since 2022.x); the three
    RoamCore-owned packages handle the contract-tile
    storage; the HA core `template:` sensor + binary_
    sensor wrappers handle the upstream-entity-
    aggregation layer; the HA core `automation:`
    integration handles the FIVE §9 MANDATORY
    automations.

install:
  ha_integration_domain: map
  config_flow: true
  hacs: false
  hacs_url: ""
  doc_recipe_only: false
  packages:
    - homeassistant/packages/roamcore_map.yaml
    - homeassistant/packages/roamcore_map_route.yaml
    - homeassistant/packages/roamcore_location.yaml
  python_requirements: []
  min_ha_version: "2022.6"
  side_effects:
    - registers_map_device_tracker_contract_tile_via_existing_template_sensor
    - registers_map_latitude_contract_tile_via_existing_template_sensor
    - registers_map_longitude_contract_tile_via_existing_template_sensor
    - registers_map_accuracy_meters_contract_tile_via_existing_template_sensor
    - registers_map_speed_kph_contract_tile_via_existing_template_sensor
    - registers_map_bearing_degrees_contract_tile_via_existing_template_sensor
    - registers_map_has_fix_contract_tile_via_existing_template_binary_sensor
    - registers_map_internet_reachable_for_tiles_contract_tile_via_existing_template_binary_sensor
    - registers_map_basemap_mode_contract_tile_via_existing_template_sensor
    - registers_map_trip_overlay_contract_tile_via_existing_input_select
    - may_register_basemap_mode_online_requires_internet_reachability_automation
    - may_register_basemap_mode_cached_prefers_local_tile_archive_automation
    - may_register_basemap_mode_fallback_to_offline_automation
    - may_register_has_fix_blocks_tile_flicker_automation
    - may_register_trip_overlay_active_only_when_vehicle_moving_automation

