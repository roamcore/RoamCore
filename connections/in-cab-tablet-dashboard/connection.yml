# In-cab tablet dashboard (driving / arrival / lock-screen Lovelace views
# with ignition-aware auto-switch) — tier-c recipe connection.
#
# Promoted from docs/catalog/vehicle-obd/in-cab-tablet-dashboard.md
# (legacy tier-c, ~20 lines, originally listed as "Support tier: C"
# with no recipe + no contract + no automations — just a placeholder
# that said "Provide a 'Driving' friendly view" + "Optionally auto-
# switch the UI when ignition turns on"). Promoted into tier-c
# because RoamCore does NOT ship a native in-cab-tablet dashboard
# engine; we RECIPE the well-understood HA Lovelace view system (a
# `view` config block in `ui-lovelace.yaml` / a panel view via the
# dashboard UI's "Add view" button / the `lovelace:` config block
# under `dashboard:` HA core UI configuration) + a thin RoamCore
# automation wrapper that flips the active view based on the
# ignition state. Tier-c is honest here: HA's Lovelace view system
# is upstream HA core code, NOT RoamCore-owned; the RoamCore
# wrapper is a few thin automations + the contract layer (the 8
# `rc_in_cab_tablet_*` contract tiles documented below). RoamCore
# does NOT fork Lovelace.
#
# The legacy spec calls out the single canonical use case: provide
# a "Driving" friendly view (big buttons, minimal text, only safe
# interactions while moving) + optionally auto-switch the UI when
# ignition turns on. The recipe §3 + §4 + §5 walks through the
# THREE operator-pickable paths:
#   - Path A — "Driving" view. Lovelace view YAML with view type
#     `panel`, view icon `mdi:car`, view title `Driving`, big-
#     button tile layout, only safe interactions (toggle exterior
#     lights / toggle compressor / mute the cabin). Path A is the
#     default for any van that has a tablet mounted in the cab
#     while the operator is driving.
#   - Path B — "Arrival / Welcome" view. Ignition-triggered view
#     switch via an automation that watches the OBD-II
#     `binary_sensor.rc_vehicle_ignition` from Wican Pro Wave 3
#     #6 OR a generic `binary_sensor.*` ignition source OR a
#     `device_tracker.rc_location_van` state change to home
#     zone. The arrival view shows exterior lighting + compressor
#     + house status (battery + water + propane + interior temp).
#     Path B is the default for vans that park at a "home" zone
#     and want the dashboard to switch to a richer control surface
#     on arrival.
#   - Path C — "Lock screen / Always-on-display" view. A
#     battery-friendly low-power dashboard showing critical house
#     status (battery SOC + water level + interior temp) + key
#     vehicle stats (battery voltage + cabin temp). Path C is the
#     default for the in-cab tablet when the ignition is off and
#     the operator is away from the van; it refreshes every 60s +
#     uses dimmed colors + minimal true/false states to preserve
#     the tablet's battery. The lock screen view can be combined
#     with the always-on-display setting on the tablet's OS to
#     keep the dashboard visible at a glance without burning the
#     battery.
#
# The legacy spec calls out the single canonical use case: provide
# a "Driving" friendly view + auto-switch the UI when ignition
# turns on. The recipe §7 walks through the THREE MANDATORY
# automations:
#   - §7.1 Ignition-on auto-switch to `arrival` view when Wican
#     Pro `binary_sensor.rc_vehicle_ignition` turns on OR a
#     generic ignition source triggers. The arrival view
#     surfaces exterior lighting + compressor + house status.
#   - §7.2 Ignition-off auto-switch to `lock_screen` view when
#     ignition turns off. The lock screen view is battery-
#     friendly + shows critical house status + key vehicle
#     stats.
#   - §7.3 Manual override via the
#     `select.rc_in_cab_tablet_view_mode` select (values:
#     `driving` / `arrival` / `lock_screen` / `manual`) OR
#     the `button.rc_in_cab_tablet_set_view_now` button.
#     The manual override sets the view mode to `manual` so
#     the next ignition event reverts to the auto-switched
#     view (a graceful opt-out for the operator who wants to
#     override the auto-switch logic on a one-off basis).

# Honesty footnote (install.config_flow = false is the honest
# tier-c marker): RoamCore does NOT ship a native in-cab-tablet
# dashboard engine; we RECIPE the well-understood HA Lovelace
# view system (a `view` config block in `ui-lovelace.yaml` / a
# panel view via the dashboard UI's "Add view" button / the
# `lovelace:` config block under `dashboard:` HA core UI
# configuration) + a thin RoamCore automation wrapper. The
# UPSTREAM HA core dashboard UI exposes a "Add view" button in
# the dashboard edit mode (since 2022.x — lets the operator add
# a `panel` view with custom title + icon + cards) + a "Raw
# configuration editor" (since 2022.x — exposes a YAML editor
# for the `ui-lovelace.yaml` file). That's honest upstream
# truth, NOT a tier-a marker for RoamCore's tier. The tier-a
# marker for RoamCore would be a RoamCore-owned operator-wired
# setup flow + RoamCore-owned integration code + integration
# tests against a RoamCore-owned in-cab-tablet bench. None of
# those are shipped at tier-c. Tier-c honesty: HA's Lovelace
# view system is upstream HA core code; the RoamCore wrapper
# is a few thin automations + the contract layer.

id: in-cab-tablet-dashboard
name: "In-cab tablet dashboard (driving / arrival / lock-screen Lovelace views with ignition-aware auto-switch) — tier-c recipe connection"
tier: c
category: vehicle_obd
status: recipe_published
version: 0.1.0
state: Available
description: |
  In-cab tablet dashboard (driving / arrival / lock-screen Lovelace
  views with ignition-aware auto-switch) — the umbrella for
  "mount a small tablet in the cab that shows the handful of
  controls and readouts you care about while driving + a richer
  control surface on arrival + a battery-friendly lock screen
  while parked" — is the in-cab-tablet-dashboard SPECIFIC subset
  of the broader vehicle subsystem (the `vehicle` subsystem
  `rc_vehicle_*` prefix is OWNED by the existing Wican Pro
  Wave 3 #6 connection — this slice inherits the `rc_vehicle_*`
  prefix from the existing Wican Pro entities and extends it
  with the `rc_in_cab_tablet_*` SPECIFIC subset for the
  dashboard view state, mirroring how time-atomic Wave 3 #55
  inherits the `rc_time_*` prefix from the existing time
  helpers and how hvac-basics Wave 3 #49 inherits the
  `rc_hvac_*` prefix from heated-floors Wave 3 #44). RoamCore
  does NOT ship a native in-cab-tablet dashboard engine; we
  RECIPE the well-understood HA Lovelace view system (a
  `view` config block in `ui-lovelace.yaml` / a panel view via
  the dashboard UI's "Add view" button / the `lovelace:` config
  block under `dashboard:` HA core UI configuration) + a thin
  RoamCore automation wrapper that flips the active view based
  on the ignition state. The recipe covers the THREE
  operator-pickable paths (Path A "Driving" view + Path B
  "Arrival / Welcome" view + Path C "Lock screen /
  Always-on-display" view), the THREE MANDATORY §7 automations
  (ignition-on auto-switch to `arrival` + ignition-off auto-
  switch to `lock_screen` + manual override via select or
  button), the 8 `rc_in_cab_tablet_*` contract tiles (active
  view + ignition state + last view switch minutes ago + refresh
  cadence seconds + driving mode active + lock screen active +
  view mode select + switch view now button), the 6 §8
  troubleshooting entries, the §9 privacy section (no telemetry
  beyond local Lovelace view state + ignition source + view
  mode select; all processing is local to the HA instance; no
  cloud call home), the §10 tier-b promotion outline (real
  in-cab tablet bench on CI + RoamCore-owned config_flow.py
  walking Path A vs Path B vs Path C + integration tests
  asserting ignition-on triggers the §7.1 automation +
  ignition-off triggers the §7.2 automation + manual select
  change triggers the §7.3 automation + the contract tiles
  reflect the current view state), and the §11 cross-
  references (Traccar Wave 3 #36 for `device_tracker.rc_
  location_van` as fallback ignition source + Wican Pro Wave
  3 #6 for the canonical `binary_sensor.rc_vehicle_ignition`
  source + HA Companion app for `device_tracker.<phone_name>`
  ignition proxy + Approach lights Wave 3 #52 for the
  `arrival` view's exterior lighting controls + HVAC basics
  Wave 3 #49 for the `arrival` view's heating/cooling toggles
  + Teltonika LTE Wave 3 #39 for the always-on LTE backhaul
  to keep the tablet online). The REUSE-FIRST strategy is
  intentional: HA's Lovelace view system handles the view
  switching (Path A + Path B + Path C); the upstream
  `input_select` integration handles the view mode select; the
  upstream `input_button` integration handles the switch view
  now button; the upstream `device_tracker` domain handles the
  ignition proxy from Traccar / HA Companion / Wican Pro. HA's
  Lovelace view system is upstream HA core code, NOT
  RoamCore-owned; the RoamCore wrapper is a few thin
  automations + the contract layer.
icon: car-front
codeowners:
  - "@bernardc"
tags:
  - vehicle
  - in-cab
  - tablet
  - dashboard
  - driving
  - arrival
  - lock-screen
  - always-on-display
  - lovelace
  - ignition
  - van-life
  - reuse-first
  - automation-wrapper

wizard:
  connection_kind: recipe
  one_tap: false
  auto_discover: false
  estimated_time: "~25 min"
  requires_reboot: false
  setup_notes: |
    In-cab tablet dashboard requires the operator to (a) decide
    on a tablet form factor (a 7-10" Android tablet mounted in
    the cab is the canonical RoamCore pick — battery-friendly +
    always-on-display capable + the HA Companion app is
    available on Android), (b) install the HA Companion app on
    the tablet (so the tablet can reach HA's Lovelace UI), (c)
    wire the §3 Path A "Driving" view via Lovelace (a `view`
    config block in `ui-lovelace.yaml` with view type `panel` +
    view icon `mdi:car` + view title `Driving` + big-button
    tile layout), (d) wire the §4 Path B "Arrival / Welcome"
    view + the §7.1 ignition-on automation (a Lovelace view +
    an automation that watches the OBD-II `binary_sensor.rc_
    vehicle_ignition` from Wican Pro Wave 3 #6 OR a generic
    `binary_sensor.*` ignition source OR a `device_tracker.rc_
    location_van` state change to home zone), (e) wire the
    §5 Path C "Lock screen / Always-on-display" view (a
    battery-friendly Lovelace view that refreshes every 60s +
    uses dimmed colors + minimal true/false states), (f) wire
    the §7.2 ignition-off automation (auto-switch to
    `lock_screen` view when ignition turns off), (g) wire the
    §7.3 manual override via the
    `select.rc_in_cab_tablet_view_mode` select (values:
    `driving` / `arrival` / `lock_screen` / `manual`) OR the
    `button.rc_in_cab_tablet_set_view_now` button. RoamCore
    does NOT maintain a custom in-cab-tablet dashboard engine;
    HA's Lovelace view system handles the view switching
    (Path A + Path B + Path C); the upstream `input_select`
    integration handles the view mode select; the upstream
    `input_button` integration handles the switch view now
    button.

install:
  ha_integration_domain: frontend
  config_flow: false
  hacs: false
  doc_recipe_only: true
  python_requirements: []
  min_ha_version: "2022.6"
  side_effects:
    - registers_lovelace_view_driving
    - registers_lovelace_view_arrival
    - registers_lovelace_view_lock_screen
    - registers_in_cab_tablet_tiles
    - may_register_ignition_on_automation
    - may_register_ignition_off_automation
    - may_register_manual_override_automation

dashboard:
  title: "In-cab tablet dashboard"
  tiles:
    - sensor.rc_in_cab_tablet_active_view
    - sensor.rc_in_cab_tablet_ignition_state
    - sensor.rc_in_cab_tablet_last_view_change_minutes_ago
    - sensor.rc_in_cab_tablet_refresh_cadence_seconds
    - binary_sensor.rc_in_cab_tablet_driving_mode_active
    - binary_sensor.rc_in_cab_tablet_lock_screen_active
    - select.rc_in_cab_tablet_view_mode
    - button.rc_in_cab_tablet_set_view_now

openclaw:
  queries:
    - "what view is the in-cab tablet showing?"
    - "is the in-cab tablet in driving mode?"
    - "is the in-cab tablet in lock screen mode?"
    - "when was the in-cab tablet view last switched?"
    - "what is the in-cab tablet refresh cadence?"
    - "what is the ignition state on the van?"
    - "switch the in-cab tablet to the driving view"
    - "switch the in-cab tablet to the arrival view"
    - "switch the in-cab tablet to the lock screen view"
  summary_keys:
    - active_view
    - ignition_state
    - last_view_change_minutes_ago
    - refresh_cadence_seconds
    - driving_mode_active
    - lock_screen_active
    - view_mode
    - set_view_now_available

tests:
  - tests/test_connection_yml.py

tier_requirements:
  - docs_recipe_published

tier_warnings:
  - no_native_in_cab_tablet_integration
  - recipe_depends_on_user_wiring_dashboard_yaml
  - requires_operator_choice_of_path_a_driving_view_or_path_b_arrival_view_or_path_c_lock_screen
  - no_real_vehicle_ignition_signal_on_ci_bench
  - mode_aware_stealth_suppression_not_required

links:
  official:
    - https://www.home-assistant.io/dashboards/
    - https://www.home-assistant.io/dashboards/views/
    - https://www.home-assistant.io/dashboards/dashboards/
    - https://www.home-assistant.io/integrations/input_select/
    - https://www.home-assistant.io/integrations/input_button/
    - https://www.home-assistant.io/integrations/device_tracker/
    - https://www.home-assistant.io/integrations/frontend/
  cross_references:
    - ../wican-pro/
    - ../traccar/
    - ../approach-lights/
    - ../hvac-basics/
    - ../teltonika/
