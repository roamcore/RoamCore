  queries:
    - "what is my latest trip wrapped?"
    - "show me the latest trip wrapped HTML report"
    - "is my latest trip wrapped ready?"
    - "is the Traccar UI reachable?"
    - "what is the trip-wrapped status?"
    - "what is the trip-wrapped export status?"
  summary_keys:
    - trip_wrapped_latest_ready
    - trip_wrapped_latest_status
    - traccar_ui_reachable

