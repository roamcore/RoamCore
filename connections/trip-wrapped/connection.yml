# Trip Wrapped (local-first route-recap HTML/JSON report) —
# tier-a recipe connection.
#
# Promoted from docs/catalog/map/trip-wrapped.md (legacy tier-a
# claim stub, 18 lines — "Trip Wrapped generates a shareable,
# beautiful HTML report of a trip/route… A fun end-of-trip
# recap… Easy to share with friends/family… Extra hardware
# required: Typically none beyond your location history source
# (often Traccar)… See existing notes in
# `homeassistant/tools/trip_wrapped/`… RoamCore also exposes
# `/local/roamcore/trip_wrapped/latest.html` when configured…
# HA package: `homeassistant/packages/roamcore_trip_wrapped.yaml`"
# — with no connection manifest + no recipe howto + no manifest-
# honesty smoke + no §9 MANDATORY automation documentation + no
# contract-tile enumeration + no docs cross-references — just a
# placeholder with an aspirational tier-a claim that pointed at
# the existing RoamCore-owned package + tooling without
# documenting how they compose).
#
# This slice wraps the EXISTING RoamCore-owned package at
# `homeassistant/packages/roamcore_trip_wrapped.yaml` (224 LOC —
# the `roamcore_traccar_proxy:` custom component + the 5+
# `input_text.rc_traccar_*` / `input_text.rc_trip_wrapped_*`
# helpers + the 1 `input_number.rc_traccar_device_id` for the
# device id + the 2 `binary_sensor.rc_trip_wrapped_latest_ready`
# + `binary_sensor.rc_traccar_ui_reachable` readiness tiles +
# the 1 `sensor.rc_trip_wrapped_latest_status` status tile +
# the 1 `shell_command.rc_trip_wrapped_export` exporter) + the
# EXISTING report-renderer tooling under
# `homeassistant/tools/trip_wrapped/` (Python; `export.py` +
# `build_wrapped.py` + `comparisons.py` + `history.py` +
# `render_html.py` + `traccar_client.py` + `assets/` + `tests/`)
# into a tier-a recipe connection, the same way Trip Local did
# for `homeassistant/tools/trip_local/`. The package + the
# tooling ARE the tier-a claim: no upstream HA integration
# generates a "trip wrapped" HTML report (Traccar's web UI
# shows a trip list, not a Spotify-Wrapped-style recap).
# RoamCore owns the renderer + the data plumbing + the Traccar
# reverse-proxy integration.
#
# The package is REFERENCED VERBATIM via `install.packages:` in
# the manifest — the package contents are NOT redefined by this
# slice. The tooling is REFERENCED VERBATIM from `recipe.md` —
# the tooling code is NOT modified by this slice. The slice
# ADDS the manifest + the recipe.md howto + the manifest-honesty
# smoke + the 3 `rc_trip_wrapped_*` + `rc_traccar_ui_*` contract
# tiles + the FIVE §9 MANDATORY automations (§9.1
# `trip_wrapped_dashboard_button` — the dashboard "Generate"
# button → `script.rc_trip_wrapped_run` →
# `shell_command.rc_trip_wrapped_export` chain (already in the
# package) + §9.2 `traccar_credentials_missing_needs_setup_notice`
# — when Traccar credentials are empty, set the status tile to
# `needs_setup` (don't fail silent) + §9.3
# `traccar_reachable_no_trip_data_no_data_notice` — when Traccar
# is reachable but `/api/.../reports` returns 0 trips in
# [from, to] for the device id, set the status tile to `no_data`
# (don't fail silent) + §9.4 `png_export_offline_first_guard` —
# the in-browser PNG export MUST work fully offline (via
# in-browser canvas); only the optional map-tile background
# requires network; if no network, fall back to a no-tile version
# + §9.5 `html_cache_buster_param` — append `?ts=<rfc3339-nano>`
# to the dashboard "View report" link so HA Core's static-file
# cache doesn't serve a stale `latest.html`) + the legacy
# SUPERSEDED banner on the catalog page + the docs cross-
# references to trip-local Wave 3 #68 + map-dashboard Wave 3
# #66 + traccar Wave 3 #12 + mode Wave 3 #61 + remote-access
# Wave 3 #58 + advanced-mode Wave 3 #63 + openclaw-api Wave 3
# #64 + leveling Wave 3 #60.
#
# The 3 contract tiles documented below are the vendor-neutral
# local-first route-recap surface (no vendor name — no Spotify /
# Apple Music / route-engine / cloud-recap names — leaks into
# the tile ids; Traccar IS the canonical source for the
# upstream trip-history data, so `rc_traccar_ui_reachable` is
# the explicit exception per Hard Rule #1: the vendor name IS
# the canonical product name; the data-source-prefix is
# allowed):
#   - binary_sensor.rc_trip_wrapped_latest_ready — `true` when
#     `sensor.rc_trip_wrapped_latest_status == 'ok'` (the report
#     is generated + readable at
#     `/local/roamcore/trip_wrapped/latest.html`).
#   - sensor.rc_trip_wrapped_latest_status — one of `ok` /
#     `needs_setup` / `no_data` / `unavailable` / `unknown` (the
#     status of the latest export; `needs_setup` when Traccar
#     credentials are missing; `no_data` when Traccar is
#     reachable but `/api/.../reports` returns 0 trips in the
#     configured `[rc_trip_wrapped_from, rc_trip_wrapped_to]`
#     range for `input_number.rc_traccar_device_id`; `ok` when
#     the report was generated successfully).
#   - binary_sensor.rc_traccar_ui_reachable — `true` when the
#     Traccar UI (`/api/roamcore/traccar`) responds within 5 s
#     (the upstream data-source reachability tile; the
#     `roamcore_traccar_proxy:` custom component polls the
#     Traccar `/api/server` endpoint and exposes this).
#
# The recipe covers the FIVE-step operator-pickable trip-
# wrapped flow (Configure Traccar credentials + Set date range
# + Set device id + Trigger export + View the recap) + the
# FIVE §9 MANDATORY automations + the 3 contract tiles + the
# §10 troubleshooting entries + the §11 privacy section (no
# RoamCore-side telemetry; the Traccar data lives on the
# operator's Traccar instance; the rendered HTML lives at
# `/local/roamcore/trip_wrapped/latest.html` on the operator's
# HA box; the PNG export happens in the operator's browser via
# in-browser canvas; no cloud round-trip) + the §12 tier-a
# promotion outline (real Traccar-`/api/.../reports`-reading
# Python report-renderer + canned fixture responses for
# `traccar_client.py` + canned fixture responses for the 5
# status-tile states + canned fixture responses for the
# PNG-export offline-first guard + RoamCore-owned operator-
# wired setup flow walking the operator through Traccar
# credentials + Date range + Device id + Wait + Verify + the
# §9 automations + integration tests asserting a credentials-
# missing event sets status to `needs_setup` + a no-trip-data
# event sets status to `no_data` + a PNG export offline event
# surfaces the no-tile fallback + an HTML cache-buster event
# appends the `?ts=<rfc3339-nano>` query param) + the §13 files
# + the §14 cross-references.
#
# Honesty footnote (install.config_flow = true is NOT a
# tier-a marker): the UPSTREAM HA core `command_line:` sensor
# platform (since 2022.x — exposes a GUI flow for the operator
# to add a `command_line:` sensor that runs an external command
# + parses the stdout) + the UPSTREAM HA core `shell_command:`
# integration (since 2022.x — exposes a GUI flow for the
# operator to add a `shell_command:` that runs an external
# command from an automation or script) + the UPSTREAM HA core
# `input_text:` / `input_number:` helpers (since 2022.x —
# exposes GUI flows for the operator to add an `input_text:` /
# `input_number:` helper) + the UPSTREAM HA core `script:`
# integration (since 2022.x — exposes a GUI flow for the
# operator to add a `script:` that runs a sequence of actions)
# + the UPSTREAM HA core `binary_sensor:` template platform
# (since 2022.x — exposes a GUI flow for the operator to add a
# `binary_sensor:` template) + the UPSTREAM HA core `sensor:`
# template platform (since 2022.x — exposes a GUI flow for the
# operator to add a `sensor:` template) + the UPSTREAM Traccar
# `/api/.../reports` + `/api/devices/{id}` endpoints (since
# Traccar 5.x — expose a per-device, date-bounded trip list +
# the device metadata) ALL expose a GUI flow / API surface.
# That's honest upstream truth, NOT a tier-a marker for
# RoamCore's tier. The tier-a marker for RoamCore is (a) the
# RoamCore-owned package at
# `homeassistant/packages/roamcore_trip_wrapped.yaml` (224
# LOC — the `roamcore_traccar_proxy:` custom component + the
# 5+ input_text + the 1 input_number + the 2 binary_sensor + the
# 1 sensor + the 1 shell_command) — already shipped + already
# RoamCore-owned + already loaded via the standard HA `packages:`
# mechanism — the package IS the tier-a surface, AND (b) the
# RoamCore-owned report-renderer tooling under
# `homeassistant/tools/trip_wrapped/` (Python; `export.py` +
# `build_wrapped.py` + `comparisons.py` + `history.py` +
# `render_html.py` + `traccar_client.py` + `assets/` + `tests/`)
# — already shipped + already RoamCore-owned — the tooling IS
# the tier-a renderer surface, AND (c) the recipe layer + the
# 3 `rc_trip_wrapped_*` + `rc_traccar_ui_*` contract tiles + the
# FIVE §9 MANDATORY automations + the cross-references to
# trip-local Wave 3 #68 + map-dashboard Wave 3 #66 + traccar
# Wave 3 #12 + mode Wave 3 #61 + remote-access Wave 3 #58 +
# advanced-mode Wave 3 #63 + openclaw-api Wave 3 #64 + leveling
# Wave 3 #60. The slice preserves the existing package verbatim
# + the existing tooling verbatim (the recipes an upstream-
# entity-aggregation wrapper on top + the contract layer + the
# §9 automations + the operator-side Traccar-credentials
# pointer).

