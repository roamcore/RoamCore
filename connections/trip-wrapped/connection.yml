wizard:
  connection_kind: package
  one_tap: false
  auto_discover: false
  estimated_time: "<5 min"
  requires_reboot: false
  setup_notes: |
    Trip Wrapped requires the operator to (a) confirm the
    RoamCore-owned package is loaded via the standard HA
    `packages:` mechanism (the package at
    `homeassistant/packages/roamcore_trip_wrapped.yaml` is
    already shipped + RoamCore-owned + preserved verbatim by
    this slice — the package contents are NOT redefined), (b)
    confirm the `roamcore_traccar_proxy:` custom component
    (shipped by the package) is loaded (the custom component
    proxies `/api/roamcore/traccar/*` requests to the upstream
    Traccar instance via the operator-configured
    `input_text.rc_traccar_base_url` + `input_text.rc_traccar_username`
    + `input_text.rc_traccar_password` — see the [Traccar
    (Wave 3 #12)](../traccar/) connection for the upstream
    setup), (c) configure the upstream Traccar user/email + a
    Traccar user token via the `roamcore_secrets.yaml` keys
    (`roamcore_traccar_user_token` +
    `roamcore_traccar_base_url`) or via the legacy
    `input_text.rc_traccar_*` inputs, (d) set
    `input_text.rc_trip_wrapped_from` +
    `input_text.rc_trip_wrapped_to` to the date range, (e) set
    `input_number.rc_traccar_device_id` to the Traccar device
    id (visible at the Traccar UI under Devices), (f)
    populate the 3 contract tiles
    (`binary_sensor.rc_trip_wrapped_latest_ready` +
    `sensor.rc_trip_wrapped_latest_status` +
    `binary_sensor.rc_traccar_ui_reachable`) to mirror the
    exporter's status, (g) wire the FIVE §9 MANDATORY
    automations (§9.1 `trip_wrapped_dashboard_button` (already
    wired in the package as `script.rc_trip_wrapped_run` →
    `shell_command.rc_trip_wrapped_export`) + §9.2
    `traccar_credentials_missing_needs_setup_notice` + §9.3
    `traccar_reachable_no_trip_data_no_data_notice` + §9.4
    `png_export_offline_first_guard` + §9.5
    `html_cache_buster_param`), (h) follow the FIVE-step
    operator-pickable trip-wrapped flow — Step 1 Configure
    Traccar credentials (operator sets
    `input_text.rc_traccar_username` +
    `input_text.rc_traccar_password` OR configures
    `roamcore_traccar_user_token` + `roamcore_traccar_base_url`
    in `secrets.yaml`; the §9.2 credentials-missing guard sets
    the status tile to `needs_setup` if neither is configured
    — don't fail silent); Step 2 Set date range (operator sets
    `input_text.rc_trip_wrapped_from` +
    `input_text.rc_trip_wrapped_to` to the desired range; the
    exporter passes these to Traccar's `/api/.../reports`
    endpoint); Step 3 Set device id (operator sets
    `input_number.rc_traccar_device_id` to the Traccar device
    id; the exporter reads the device metadata from
    `/api/devices/{id}`); Step 4 Trigger export (operator
    triggers `shell_command.rc_trip_wrapped_export` from
    Developer Tools → Services or via the dashboard "Generate"
    button — the §9.1 dashboard-button automation wires the
    button to `script.rc_trip_wrapped_run` →
    `shell_command.rc_trip_wrapped_export`); Step 5 View the
    recap (operator opens
    `/local/roamcore/trip_wrapped/latest.html` in their
    browser; the §9.5 html-cache-buster-param appends
    `?ts=<rfc3339-nano>` so the browser doesn't serve a stale
    cached version; the in-browser "Download summary" PNG
    export works fully offline via in-browser canvas — the
    §9.4 png-export-offline-first guard falls back to a no-
    tile version if the optional map-tile background is
    unreachable). RoamCore does NOT maintain a separate
    trip-wrapped integration; the HA `command_line:` /
    `shell_command:` / `input_text:` / `input_number:` /
    `script:` / `binary_sensor:` / `sensor:` integrations +
    the Python exporter are the actual surface.

