# Time (atomic) (NTP-synchronized time with offline-resilience) — tier-c
# recipe connection.
#
# Promoted from docs/catalog/time/atomic-time.md (legacy spec — note
# that the unified-backlog row #55 says "Connection: Time (atomic)
# | docs/catalog/time/index.md"; the legacy spec pointer is
# docs/catalog/time/atomic-time.md which this slice creates + marks
# SUPERSEDED, mirroring how Wave 3 #54 timezone-geolocator promoted
# docs/catalog/time/timezone-geolocator.md. The legacy `docs/catalog/
# time/index.md` is a thin folder overview; the actual atomic-time
# spec pointer is the new docs/catalog/time/atomic-time.md created
# in this slice).
#
# RoamCore does NOT ship a native atomic-clock or NTP engine; we
# RECIPE the well-understood HA core `time` integration (since
# 2022.x — exposes NTP servers + `sensor.time` + `sensor.date` +
# date/time helpers) + a thin RoamCore automation wrapper that
# keeps the system clock accurate via THREE operator-pickable paths
# + the 8 `rc_time_*` contract tiles. Tier-c is honest here: HA
# core's `time` integration is upstream HA core code, NOT
# RoamCore-owned; the RoamCore wrapper is a few thin automations +
# the contract layer. This is the SECOND `time`-category slice in
# the RoamCore connection pipeline (Wave 3 #54 timezone-geolocator
# was the FIRST; this slice complements it by handling the
# "what time IS it?" side of the time subsystem while Wave 3 #54
# handled the "what timezone IS it?" side). The `time` subsystem
# `rc_time_*` prefix is OWNED by the existing
# `homeassistant/packages/roamcore_weather_time.yaml` +
# `sensor.rc_time_zone` override contract — this slice inherits
# the `rc_time_*` prefix without backfilling, mirroring how
# Wave 3 #54 inherits the `rc_time_zone_*` prefix and how
# hvac-basics Wave 3 #49 inherits the `rc_hvac_*` prefix from
# heated-floors Wave 3 #44.

# The legacy atomic-time concept in RoamCore is "keep HA's clock
# accurate even when offline (in a van with intermittent
# connectivity)". The recipe §3 + §4 + §5 walks through the
# THREE operator-pickable paths:
#   - Path A — HA core `time` integration (NTP). The operator
#     configures NTP servers (recommended:
#     `time.cloudflare.com` + `time.google.com` + `pool.ntp.org`)
#     and HA's clock stays NTP-synchronized whenever the WAN is
#     reachable. Path A is the default for vans with reliable
#     LTE / Starlink backhaul.
#   - Path B — GPS-derived time. The Traccar Wave 3 #36 server
#     OR HA Companion app OR Wican Pro Wave 3 #6 OBD-II reader's
#     GPS feed — any `device_tracker.*` entity that updates
#     `zone.home` — exposes a GPS time signal (GPS satellites
#     carry atomic-clock-grade time signals). The recipe wires
#     the device_tracker -> a `homeassistant.set_location` call +
#     a periodic time-correction automation.
#   - Path C — Cellular RTC fallback. A DS3231 / RV-3028 RTC
#     module wired via I2C to the van's NUC / SBC provides a
#     hardware clock that ticks when NTP is unreachable. The
#     recipe wires `systemd-timesyncd` to fall back to the RTC
#     when NTP is unreachable + a `hwclock --systohc` cron to
#     keep the RTC updated.

# The legacy spec calls out the single canonical use case: keep
# HA's clock accurate even when offline (in a van with intermittent
# connectivity). The recipe §7 walks through the THREE MANDATORY
# automations:
#   - NTP cadence refresh on boot (refresh NTP servers on HA
#     startup to ensure the system clock is NTP-synchronized as
#     soon as possible after boot).
#   - GPS time correction on `device_tracker` + timezone change
#     (use GPS-derived time when NTP is unreachable but GPS is;
#     GPS satellites carry atomic-clock-grade time signals).
#   - RTC fallback when NTP unreachable for N minutes (use the
#     DS3231 / RV-3028 RTC module when NTP has been unreachable
#     for N minutes — the RTC ticks even when the network is
#     down).

# Honesty footnote (install.config_flow = true is NOT a tier-a
# marker): The UPSTREAM HA core `time` integration (since 2022.x
# — exposes a GUI flow for the operator's choice of NTP servers)
# + the HA core `zone` domain (since 2022.x) + the `device_tracker`
# domain (since 2022.x) + the `homeassistant` service domain
# (since 2022.x — `homeassistant.set_location` +
# `homeassistant.update_entity` + `homeassistant.set_datetime`)
# + the `template` integration (since 2022.x) + the `input_boolean`
# integration (since 2022.x) + the `input_datetime` integration
# (since 2022.x) ALL expose a GUI flow. That's honest upstream
# truth, NOT a tier-a marker for RoamCore's tier. The tier-a
# marker for RoamCore would be a RoamCore-owned operator-wired
# setup flow + RoamCore-owned integration code + integration tests
# against a RoamCore-owned atomic-clock bench. None of those are
# shipped at tier-c. Tier-c honesty: HA core's `time` integration
# is upstream HA core code; the RoamCore wrapper is a few thin
# automations + the contract layer.

id: time-atomic
name: "Time (atomic) (NTP-synchronized time with offline-resilience) — tier-c recipe connection"
tier: c
category: time
status: recipe_published
version: 0.1.0
description: |
  Time (atomic) (NTP-synchronized time with offline-resilience) —
  the umbrella for "keep HA's clock accurate even when offline
  (in a van with intermittent connectivity)" — is the
  time-category complement to the existing RoamCore time helpers
  (`homeassistant/packages/roamcore_weather_time.yaml` +
  `sensor.rc_time_zone` override contract) and to the Wave 3 #54
  timezone-geolocator connection (which handles "what timezone IS
  it?"; this slice handles "what time IS it?"). RoamCore does NOT
  ship a native atomic-clock engine; we RECIPE the HA core `time`
  integration (since 2022.x — exposes NTP servers + `sensor.time`
  + `sensor.date` + date/time helpers) + a thin RoamCore
  automation wrapper that keeps the system clock accurate via
  THREE operator-pickable paths (Path A NTP via HA core `time`
  integration + Path B GPS-derived time via Traccar Wave 3 #36 /
  HA Companion app / Wican Pro Wave 3 #6 OBD-II's GPS feed +
  Path C cellular RTC fallback via DS3231 / RV-3028 I2C RTC
  module). The recipe covers the THREE MANDATORY §7 automations
  (NTP cadence refresh on boot + GPS time correction on
  `device_tracker` + timezone change + RTC fallback when NTP
  unreachable for N minutes), the 8 `rc_time_*` contract tiles
  (current time + NTP source + last-sync-minutes-ago + drift-
  seconds + freshness gate + NTP-reachable binary_sensor +
  GPS-source sensor + RTC-source binary_sensor), and the
  operator-pickable path selection. The REUSE-FIRST strategy is
  intentional: HA core's `time` integration handles the NTP
  sync (Path A); the upstream `device_tracker` domain + the
  `homeassistant.update_entity` / `homeassistant.set_datetime`
  services handle the GPS-derived time correction (Path B);
  the SBC's `systemd-timesyncd` + the DS3231 / RV-3028 RTC
  module handle the RTC fallback (Path C). RoamCore does NOT
  maintain a custom atomic-clock engine; we recipe over the
  upstream HA core + the SBC's NTP client.
icon: clock-digital
codeowners:
  - "@bernardc"
tags:
  - time
  - atomic
  - ntp
  - gps
  - rtc
  - offline-resilience
  - van-life
  - reuse-first
  - automation-wrapper

wizard:
  connection_kind: recipe
  one_tap: false
  auto_discover: false
  estimated_time: "~20 min"
  requires_reboot: false
  setup_notes: |
    Time (atomic) requires the operator to (a) wire a time source
    — Path A (HA core `time` integration NTP), Path B (GPS via
    Traccar Wave 3 #36 / HA Companion / Wican Pro), Path C
    (DS3231 / RV-3028 RTC module on the van's NUC / SBC), or any
    combination thereof — (b) confirm the upstream NTP server
    list is configured (recommended: `time.cloudflare.com` +
    `time.google.com` + `pool.ntp.org`), (c) wire the §7
    automations (NTP cadence refresh on boot + GPS time
    correction on `device_tracker` + timezone change + RTC
    fallback when NTP unreachable for N minutes) BEFORE first
    use, (d) confirm the upstream `sensor.time` + `sensor.date`
    entities exist in HA. RoamCore does NOT maintain a custom
    atomic-clock engine; HA core's `time` integration handles
    NTP sync (Path A); the upstream `device_tracker` domain +
    `homeassistant.update_entity` / `homeassistant.set_datetime`
    services handle the GPS-derived time correction (Path B);
    the SBC's `systemd-timesyncd` + the DS3231 / RV-3028 RTC
    module handle the RTC fallback (Path C).

install:
  ha_integration_domain: time
  config_flow: true
  hacs: false
  doc_recipe_only: false
  python_requirements: []
  min_ha_version: "2022.6"
  side_effects:
    - registers_time_integration
    - registers_ntp_servers_list
    - registers_time_tiles
    - may_register_gps_time_correction_automation
    - may_register_rtc_fallback_automation

dashboard:
  title: "Time (atomic)"
  tiles:
    - sensor.rc_time_current
    - sensor.rc_time_ntp_source
    - sensor.rc_time_last_sync_minutes_ago
    - sensor.rc_time_drift_seconds
    - binary_sensor.rc_time_synced
    - binary_sensor.rc_time_stale
    - binary_sensor.rc_time_ntp_reachable
    - binary_sensor.rc_time_rtc_present

openclaw:
  queries:
    - "what time is it on the van?"
    - "what NTP source is the van using?"
    - "when was the clock last NTP-synced?"
    - "what is the drift in seconds vs the last-known-good source?"
    - "is the clock NTP-synced?"
    - "is the clock stale?"
    - "is NTP reachable from the van?"
    - "is the RTC present?"
  summary_keys:
    - current_time
    - ntp_source
    - last_sync_minutes_ago
    - drift_seconds
    - synced
    - stale
    - ntp_reachable
    - rtc_present

tests:
  - tests/test_connection_yml.py

tier_requirements:
  - docs_recipe_published

tier_warnings:
  - no_native_atomic_time_integration_test
  - recipe_depends_on_user_wiring_gps_or_rtc_or_ntp
  - requires_operator_choice_of_path_a_b_or_c
  - no_real_atomic_clock_hardware_on_ci_bench
  - mode_aware_stealth_suppression_not_required

links:
  official:
    - https://www.home-assistant.io/integrations/time/
    - https://www.home-assistant.io/integrations/zone/
    - https://www.home-assistant.io/integrations/device_tracker/
    - https://www.home-assistant.io/integrations/homeassistant/
    - https://www.home-assistant.io/integrations/template/
    - https://www.home-assistant.io/integrations/input_boolean/
    - https://www.home-assistant.io/integrations/input_datetime/
  cross_references:
    - ../timezone-geolocator/
    - ../traccar/
    - ../teltonika/
    - ../wican-pro/
    - ../weather-time-contract/
