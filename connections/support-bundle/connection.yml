id: support-bundle
name: "Support bundle — vendor-neutral diagnostic snapshot exporter for RoamCore-installed HA instances — tier-a connection"
tier: a
category: homelab
status: beta
version: 0.1.0
description: |
  Support bundle — vendor-neutral diagnostic snapshot
  exporter for RoamCore-installed HA instances — is
  the homelab-category complement to the broader
  RoamCore "capture what we shipped + how it's running"
  affordances. The umbrella wraps the existing
  RoamCore-owned support-bundle exporter at
  `homeassistant/custom_components/roamcore/support_bundle.py`
  (286 LOC, real `async def export_support_bundle(hass,
  *, include_zip=True) -> dict` + 8 private helpers:
  `_ts`, `_iso_now`, `_ensure_dir`, `_read_text`,
  `_copy_file`, `_write_json`, `_zip_dir`,
  `_snapshot_entity` — walks the canonical 3 sections
  of bundle contents: installer/provisioning state,
  OpenClaw snapshots, setup-wizard states) + the
  matching `homeassistant/custom_components/roamcore/...`
  services.yaml file (registers the
  `export_support_bundle` service with optional
  `zip: true`) + the handler wiring in
  `homeassistant/custom_components/roamcore/__init__.py`
  (registers the `_svc_export_support_bundle` handler
  via `async_register_service`) + the operator howto at
  `docs/howto/support-bundle.md` (44 lines, the
  canonical operator-walk through the service-call
  flow + the 3 sections of bundle contents + the 6
  files included + the privacy guidance).

  The exporter writes per-bundle state files to
  `/config/.roamcore/support/<timestamp>/` (containing
  the 6 files: `install-info.txt` + `manifest.txt` +
  `provisioned.marker` + `openclaw-summary.json` +
  `openclaw-timeseries-catalog.json` +
  `setup-wizard-states.json`) and (when `include_zip=
  True`) the matching zip at
  `/config/.roamcore/support/<timestamp>.zip`. The
  bundle is best-effort and intentionally avoids
  obvious secrets (the canonical implementation does
  best-effort filtering of `secrets.yaml`); operators
  should ALWAYS review before posting publicly.

  The 8 `rc_support_bundle_*` contract tiles are the
  dashboard-side companion to the canonical exporter:
  the `export` + `export_no_zip` tiles are HA core
  `input_button` helpers that fire the
  `roamcore.export_support_bundle` service with
  `zip: true` / `zip: false`; the `last_export_path` +
  `last_export_at` + `last_export_zip` + `last_error`
  tiles are HA core `input_text` helpers populated by
  the §8.3 export-failure capture + §8.4 export-success
  bookkeeping guards; the `status` tile is an HA core
  `template:` sensor derived from the §8.1 export-button
  guard + §8.3 export-failure capture guard; the
  `secrets_safe` tile is an HA core `template:`
  binary_sensor derived from the §8.5 privacy audit.

  RoamCore DOES own + maintain + ship a real custom
  component (this is one of the tier-a-but-flagged
  homelab-category connections — the legacy tier-a
  claim at `docs/catalog/homelab/support-bundle.md` is
  HONEST). The install path is via the canonical
  `roamcore:` integration in the operator's HA
  configuration (the exporter is exposed automatically
  once the `roamcore` integration is loaded). The
  tier-a-but-flagged honesty: the exporter has real code
  + a canonical operator-driven smoke check via the
  service-call flow, but it does NOT have pytest
  integration tests against a controlled bench (the
  bench fixture gap that keeps this at
  tier-a-but-flagged for the audit's
  `test_status_reflects_tier_a_but_no_pytest_bench`
  pattern). The promotion path to fully-fledged tier-a
  is documented in §11 of the recipe.

  RoamCore does NOT maintain a vendor-specific
  integration for the support-bundle exporter (the
  exporter is vendor-neutral — it reads only from
  `rc_*` contract entities + the canonical
  `/config/.roamcore/` installer state). The 8
  `rc_support_bundle_*` contract tiles are
  vendor-neutral — NO Victron / SeeLevel / Seelevel /
  Garnet / Mopeka / Renogy / Starlink / Peplink /
  Teltonika / Unifi / Ubiquiti / MQTT / webhook / REST /
  Companion / ESPHome / phone / GPS / accelerometer /
  iPhone / iOS / Android / Samsung / Pixel / OnePlus /
  Xiaomi / Huawei names leak into the tile ids. The
  audit catches true vendor leaks via the
  forbidden_substrings list in
  `connections/support-bundle/tests/test_connection_yml.py`
  (`test_dashboard_tiles_follow_rc_naming`).

  The recipe covers the FOUR-step operator flow
  (Export + Locate + Inspect + Share) + the FIVE §8
  MANDATORY automations (export-button guard + export-
  no-zip guard + export-failure capture + export-
  success bookkeeping + privacy audit) + the 8
  `rc_support_bundle_*` contract tiles + the §9
  troubleshooting entries (6 entries) + the §10
