wizard:
  connection_kind: native_integration
  one_tap: true
  auto_discover: false
  estimated_time: "~2 min"
  requires_reboot: false
  setup_notes: |
    Support bundle requires the operator to (a) have HA
    installed via RoamCore (the `roamcore` integration is
    loaded in HA), (b) have the persistent-notifications
    permission enabled in HA (default ON), (c) optionally
    tap `input_button.rc_support_bundle_export` from the
    dashboard OR call the service directly from Settings
    → Developer Tools → Services →
    `roamcore.export_support_bundle` (with optional
    `zip: true` in the service data), (d) optionally pin
    a specific zip behavior via the §8.2 export-no-zip
    button (when `/config/` is space-constrained), (e)
    wire the FIVE §8 MANDATORY automations (export-button
    guard + export-no-zip guard + export-failure capture
    + export-success bookkeeping + privacy audit), (f)
    follow the FOUR-step operator flow — Step 1 tap
    `input_button.rc_support_bundle_export` OR call the
    service; Step 2 read the persistent notification (or
    `input_text.rc_support_bundle_last_export_path`) to
    locate the bundle directory; Step 3 inspect the
    contents + check `binary_sensor.rc_support_bundle_
    secrets_safe` for the privacy guard fire (if false,
    the operator investigates which file leaked); Step 4
    copy the bundle (or zip) off-host (scp / sneakernet /
    Tailscale share) + post in the bug tracker or support
    thread. The existing exporter handles the actual
    export; this connection's recipe is the dashboard-side
    companion (the 8 contract tiles + the §8 automations +
    the privacy / troubleshooting / tier-a-promotion
    guides).

install:
  ha_integration_domain: roamcore
  config_flow: false
  hacs: false
  doc_recipe_only: true
  python_requirements: []
  min_ha_version: "2022.6"
  custom_component_at_homeassistant_root: true
  side_effects:
    - registers_roamcore_export_support_bundle_service
    - registers_support_bundle_export_contract_tile
    - registers_support_bundle_export_no_zip_contract_tile
    - registers_support_bundle_last_export_path_contract_tile
    - registers_support_bundle_last_export_at_contract_tile
    - registers_support_bundle_last_export_zip_contract_tile
    - registers_support_bundle_status_contract_tile
    - registers_support_bundle_last_error_contract_tile
    - registers_support_bundle_secrets_safe_contract_tile
    - may_register_export_button_guard_automation
    - may_register_export_no_zip_guard_automation
    - may_register_export_failure_capture_automation
    - may_register_export_success_bookkeeping_automation
    - may_register_privacy_audit_automation
  install_custom_component: homeassistant/custom_components/roamcore/support_bundle.py
  install_custom_component_services: homeassistant/custom_components/roamcore/services.yaml
  install_custom_component_init: homeassistant/custom_components/roamcore/__init__.py
  install_howto: docs/howto/support-bundle.md

dashboard:
  title: "Support bundle"
  tiles:
    - input_button.rc_support_bundle_export
    - input_button.rc_support_bundle_export_no_zip
    - input_text.rc_support_bundle_last_export_path
    - input_text.rc_support_bundle_last_export_at
    - input_text.rc_support_bundle_last_export_zip
    - sensor.rc_support_bundle_status
    - input_text.rc_support_bundle_last_error
    - binary_sensor.rc_support_bundle_secrets_safe

openclaw:
  queries:
    - "export a bundle now"
    - "export a bundle without zipping"
    - "where is the last bundle?"
    - "when was the last export?"
    - "where is the last zip?"
    - "what's the export status?"
    - "what was the last error?"
    - "is the bundle secrets-safe?"

contract:
  exporter_version: 1
  bundle_dir: /config/.roamcore/support/<timestamp>/
  bundle_zip: /config/.roamcore/support/<timestamp>.zip
  sections:
    - installer_provisioning_state
    - openclaw_snapshots
    - setup_wizard_states
  files:
    - install-info.txt
    - manifest.txt
    - provisioned.marker
    - openclaw-summary.json
    - openclaw-timeseries-catalog.json
    - setup-wizard-states.json
  privacy_audit:
    forbidden_filename_patterns:
      - secrets.yaml
      - secrets*.yaml
      - "*.env"
      - "*token*"
    chip: binary_sensor.rc_support_bundle_secrets_safe
  bump_notify_automation: rc_support_bundle_export_failure_capture

contract_tiles:
  - input_button.rc_support_bundle_export
  - input_button.rc_support_bundle_export_no_zip
  - input_text.rc_support_bundle_last_export_path
  - input_text.rc_support_bundle_last_export_at
  - input_text.rc_support_bundle_last_export_zip
  - sensor.rc_support_bundle_status
  - input_text.rc_support_bundle_last_error
  - binary_sensor.rc_support_bundle_secrets_safe

automations:
  - id: rc_support_bundle_export_button_guard
    title: "Export-button guard"
  - id: rc_support_bundle_export_no_zip_guard
    title: "Export-no-zip guard"
  - id: rc_support_bundle_export_failure_capture
    title: "Export-failure capture"
  - id: rc_support_bundle_export_success_bookkeeping
    title: "Export-success bookkeeping"
  - id: rc_support_bundle_privacy_audit
    title: "Privacy audit"

upstream_truth:
  reuse_first: false
  rocore_owned:
    - homeassistant/custom_components/roamcore/support_bundle.py
    - homeassistant/custom_components/roamcore/services.yaml
    - homeassistant/custom_components/roamcore/__init__.py
    - docs/howto/support-bundle.md
  vendor_neutral: true

tests:
  - tests/test_connection_yml.py

tier_requirements:
  native_exporter_code: true
  one_tap_export: true
  one_tap_export_no_zip: true
  privacy_audit: true
  secrets_safe_chip: true
  install_howto_published: true
  custom_component_at_homeassistant_root: true
  docs_recipe_published: true
  integration_tests_bench_fixture_gap_documented: true
  integration_tests:
    present: false
    reason: "Operator-driven smoke check is the service-call flow (Settings → Developer Tools → Services → `roamcore.export_support_bundle` → optional `zip: true` → Call service → persistent notification with the output directory); no pytest bench fixtures for the export flow. Tier-a promotion requires adding pytest fixtures + a controlled environment (a HA core container via docker-compose + a fake `/config/.roamcore/` state + canned fixture responses for the export flow + a `secrets.yaml` key that should be filtered out) to integration-test against."
    bench_artifacts_needed:
      - "canned export-success response (bundle dir written + zip created)"
      - "canned export-no-zip response (bundle dir written + zip skipped)"
      - "canned export-failure response (status: error + last_error populated)"
      - "canned export-success-but-secrets-flagged response (secrets.yaml detected in bundle dir + secrets_safe binary_sensor = false)"
      - "canned empty-export response (no installer state + no rc_* entities)"
      - "canned full-export response (installer state + openclaw state + setup wizard state)"
      - "canned openclaw-timeseries-catalog response (TIMESERIES_CATALOG populated)"
      - "canned setup-wizard-states response (input_select.rc_setup_stage + sensor.rc_setup_progress + 3 binary_sensors populated)"

tier_warnings:
  - no_pytest_integration_tests_against_controlled_bench
  - exporter_is_python_service_not_shell_wrapper
  - recipe_depends_on_user_tapping_button_or_calling_service
  - requires_roamcore_custom_component_loaded
  - privacy_guard_is_best_effort_not_cryptographic

