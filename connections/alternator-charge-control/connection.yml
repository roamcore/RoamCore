    # the subsystem prefix `rc_power_alternator_*` (the subsystem
    # prefix IS allowed — it's the owning-area marker; what is
    # forbidden is vendor names appearing AFTER the subsystem marker
    # in a way that double-stamps the vendor into the id).
    - binary_sensor.rc_power_alternator_charging_enabled
    - select.rc_power_alternator_charge_mode
    - sensor.rc_power_alternator_target_voltage_v
    - sensor.rc_power_alternator_charge_current_a
    - binary_sensor.rc_power_alternator_temp_compensation_active
    - binary_sensor.rc_power_alternator_fault
    - sensor.rc_power_alternator_last_trigger_reason
    - button.rc_power_alternator_manual_override

openclaw:
  queries:
    - is_alternator_charging
    - alternator_charge_mode
    - alternator_target_voltage
    - alternator_charge_current
    - is_alternator_temp_compensating
    - is_alternator_fault
    - alternator_last_trigger_reason
    - alternator_manual_override
  summary_keys:
    - charging_enabled
    - charge_mode
    - target_voltage_v
    - charge_current_a
    - temp_compensation_active
    - fault
    - last_trigger_reason

# Tier-b: tests are optional (and we have no real smart alternator
# regulator + battery + ignition + temperature probe bench to
# integration-test against). The tests/test_connection_yml.py file
# below asserts the manifest itself is honest about its tier +
# requirements; that satisfies the audit without claiming fake
# integration coverage.
tests:
  - tests/test_connection_yml.py

tier_requirements:
  # The only thing a tier-b connection needs is a published recipe
  # doc. We publish docs/recipe.md below.
  - docs_recipe_published

tier_warnings:
  # We have no real alternator regulator + ignition signal +
  # battery temperature probe on the bench to integration-test
  # against (no operator path choice to drive an integration
  # test).
  - no_real_alternator_regulator_for_integration_test
  # The recipe depends on the operator running an alternator-
  # side regulator or relay + battery temperature probe +
  # ignition signal; we cannot bench-test any of that.
  - recipe_depends_on_user_running_alternator_or_relay_plus_temp_probe_plus_ignition
  # Path choice honesty — DC-DC-charger-linked regulator Path A
  # vs MQTT-bridged regulator Path B vs field-relay Path C vs
  # ignition-only read-only Path D depends on existing IoT
  # wiring + regulator preference + comfort with MQTT bridge vs
  # relay-friendly templates.
  - optional_dc_dc_charger_vs_mqtt_bridge_vs_relay_vs_read_only_choice
  # The safety interlocks documented in §8 are operator-wired,
  # not RoamCore-enforced. The recipe walks through every
  # interlock in detail; tier-a promotion would move the
  # asserts into RoamCore-side integration code.
  - requires_operator_wiring_temperature_probe_plus_ignition_plus_soc_before_first_use

