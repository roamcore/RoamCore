# Frigate — vendor-neutral NVR backend with on-device
# person / car / animal / package detection that the
# upstream HA core `frigate` integration exposes for
# IP-camera motion detection + recording + audit trails
# — tier-b recipe connection.
#
# Promoted from docs/catalog/cctv/frigate.md (legacy
# 669-byte tier-c claim stub — "CCTV with Frigate
# (spec + setup ideas): A single-page spec for a low-CPU
# CCTV system using Frigate + go2rtc, designed for
# predictable storage and practical van use" with no
# recipe + no contract + no automations + no install
# path — just a placeholder with an aspirational tier-c
# claim). The legacy stub's tier-c claim was honest-
# upstream-truth: RoamCore ships NO native NVR engine
# (no `custom_components/frigate/` directory in the repo
# today — the upstream HA core `frigate` integration IS
# the canonical NVR integration; RoamCore RECIPES over
# it). The picker promotes the legacy stub into a
# tier-b recipe connection because the contract layer
# is the canonical RoamCore contribution (the 12
# `rc_security_*` + `rc_storage_*` tiles + the recipe +
# the §8 MANDATORY automations) while the upstream
# engines are the HA core `frigate` integration (since
# 2022.x) + the upstream `camera` platform (since 2022.x
# — exposes a GUI flow for the operator to add derived
# motion entities from the upstream sensors) + the
# upstream `input_boolean` + `input_text` +
# `input_datetime` + `input_button` + `select` helpers
# (since 2022.x — expose a GUI flow for the operator to
# add the helper entities from the HA UI under Settings
# → Helpers) + the upstream `recorder` integration (since
# 2022.x — the canonical recording service for Home
# Assistant automations) + the upstream `logbook`
# integration (since 2022.x — the canonical audit-log
# destination for Home Assistant automations) + the
# upstream `template:` sensor wrapper (since 2022.x —
# wraps any upstream sensor state into a derived
# `sensor.*` entity) + the upstream `template:`
# binary_sensor wrapper (since 2022.x — wraps any
# upstream binary_sensor state into a derived
# `binary_sensor.*` entity) + the upstream `button:`
# domain helper (since 2022.x — exposes the
# operator-triggered one-tap reset-recipe button helper)
# + the upstream `script:` integration (since 2022.x —
# exposes the script-runner operator-wired setup flow
# for the §8.5 records-on-motion guard's `record` service
# wrapper). RoamCore does NOT fork any of these; the
# wrapper is the contract layer + the recipe + the §8
# MANDATORY automations + the per-camera offline guard
# + the per-camera records-on-motion guard + the
# per-camera motion-mask guard + the storage-full guard
# + the retentions-spin-down guard. The legacy doc now
# carries a SUPERSEDED banner pointing at this
# connection.

id: frigate
name: Frigate
description: >-
  Vendor-neutral NVR backend with on-device person / car
  / animal / package detection that the upstream HA core
  `frigate` integration exposes for IP-camera motion
  detection + recording + audit trails. The recipe is the
  umbrella for "the camera backend everything depends
  on": the operator picks ONE of THREE upstream NVR paths
  (Path A HACS frigate add-on, Path B external / cloud
  NVR, Path C local container / VM NVR) + mounts the
  camera URLs + confirms the cameras are online +
  enables + starts recording + audits + can revert via
  the one-tap reset-now button. RoamCore ships no native
  NVR engine; the wrapper is a thin RoamCore upstream-
  entity-aggregation layer + the contract layer + the
  FIVE §8 MANDATORY automations over the upstream HA
  core `frigate` integration (since 2022.x — exposes the
  canonical NVR backend for Home Assistant automations)
  + the upstream `camera` platform (since 2022.x —
  exposes a GUI flow for the operator to add the
  upstream cameras via the HA UI under Settings →
  Devices & services → Integrations → Add Integration →
  Camera) + the HA core `input_boolean` + `input_text` +
  `input_datetime` + `input_button` + `select` helpers
  (since 2022.x — expose a GUI flow for the operator to
  add the helper entities from the HA UI under Settings
  → Helpers) + the upstream `recorder` integration
  (since 2022.x — the canonical recording service for
  Home Assistant automations) + the upstream `logbook`
  integration (since 2022.x — the canonical audit-log
  destination for Home Assistant automations) + the HA
  core `template:` sensor wrapper (since 2022.x — wraps
  any upstream sensor state into a derived `sensor.*`
  entity) + the HA core `template:` binary_sensor wrapper
  (since 2022.x — wraps any upstream binary_sensor state
  into a derived `binary_sensor.*` entity) + the
  upstream `button:` domain helper (since 2022.x —
  exposes a GUI flow for the operator to trigger the
  reset-now button from the HA UI) + the upstream
  `script:` integration (since 2022.x — exposes the
  script-runner operator-wired setup flow for the §8.5
  records-on-motion guard's `record` service wrapper).
version: 1
category: cctv
tier: b
status: beta
tags:
  - frigate
  - nvr
  - cctv
  - camera
  - detection
  - person
  - car
  - animal
  - package
  - recording
  - audit
  - vendor-neutral
  - upstream
  - ha-core
  - security

# Wizard contract (tier-b honest contract: the recipe is
# NOT a one-tap install; the operator walks the FIVE-step
# operator-pickable flow).
wizard:
  connection_kind: recipe
  one_tap: false

# Who owns this slice + who to ping for changes.
owners:
  - bernard
  - roamcore-core

# Where the source-of-truth docs live.
docs:
  recipe: docs/recipe.md
  design: docs/design.md
  troubleshooting: docs/troubleshooting.md
  supersedes: docs/catalog/cctv/frigate.md

# What the operator needs to install for the recipe.
# The recipe is honest-upstream-truth: the upstream HA
# core `frigate` integration + the upstream `camera`
# platform + the upstream HA core `input_boolean` +
# `input_text` + `input_datetime` + `input_button` +
# `select` helpers + the upstream `recorder`
# integration + the upstream `logbook` integration + the
# HA core `template:` sensor + binary_sensor wrappers +
# the upstream `button:` domain helper + the upstream
# `script:` integration all expose their own
# operator-wired setup flow + GUI flow since 2022.x —
# honest upstream truth, NOT a tier-a marker for
# RoamCore's tier. The tier-a marker for RoamCore would
# be a RoamCore-owned NVR engine + RoamCore-owned
# integration code + integration tests against a
# RoamCore-owned NVR engine bench. None of those are
# shipped at tier-b.
install:
  # The UPSTREAM HA core `frigate` integration (since
  # 2022.x — exposes the canonical NVR backend for Home
  # Assistant automations) + the UPSTREAM `camera`
  # platform (since 2022.x — exposes a GUI flow for the
  # operator to add the upstream cameras via the HA UI
  # under Settings → Devices & services → Integrations →
  # Add Integration → Camera) + the UPSTREAM HA core
  # `input_boolean` + `input_text` + `input_datetime` +
  # `input_button` + `select` helpers (since 2022.x —
  # expose a GUI flow for the operator to add the helper
  # entities from the HA UI under Settings → Helpers) +
  # the UPSTREAM `recorder` integration (since 2022.x —
  # the canonical recording service for Home Assistant
  # automations) + the UPSTREAM HA core `logbook`
  # integration (since 2022.x — the canonical audit-log
  # destination for Home Assistant automations) + the
  # UPSTREAM HA core `template:` sensor + binary_sensor
  # wrappers (since 2022.x — expose a GUI flow for the
  # operator to add a derived entity from the upstream
  # sensors) + the UPSTREAM `button:` domain helper
  # (since 2022.x — exposes a GUI flow for the operator
  # to trigger the reset-now button from the HA UI) +
  # the UPSTREAM `script:` integration (since 2022.x —
  # exposes the script-runner operator-wired setup flow
  # for the §8.5 records-on-motion guard's `record`
  # service wrapper) ALL expose a GUI flow since 2022.x.
  # install.config_flow is TRUE here because the UPSTREAM
  # HA core `frigate` integration + the UPSTREAM
  # `camera` platform + the UPSTREAM HA core
  # `input_boolean` + `input_text` + `input_datetime` +
  # `input_button` + `select` helpers + the UPSTREAM
  # `recorder` integration + the UPSTREAM HA core
  # `logbook` integration + the UPSTREAM HA core
  # `template:` sensor + binary_sensor wrappers + the
  # UPSTREAM `button:` domain helper + the UPSTREAM
  # `script:` integration ALL expose a GUI flow. That's
  # honest upstream truth, NOT a tier-a marker for
  # RoamCore's tier. The tier-a marker for RoamCore
  # would be a RoamCore-owned operator-wired setup flow
  # + RoamCore-owned integration code + integration
  # tests against a RoamCore-owned NVR engine bench.
  # None of those are shipped at tier-b.
  config_flow: true
  # install.hacs is TRUE because the recommended Path A
  # (HACS frigate add-on) depends on a HACS add-on as the
  # canonical upstream vendor-neutral local NVR. The
  # operator MUST install the HACS frigate add-on from
  # the HACS default store before the §3 Path A wire-up.
  # Without the HACS frigate add-on installed, the
  # upstream HA core `frigate` integration has no local
  # NVR to point at (the upstream `frigate` integration
  # is a client; it needs an NVR engine to connect to).
  # The recipe documents the HACS frigate add-on install
  # path in §3 Path A.
  hacs: true
  # The recipe depends on the operator choosing ONE of
  # the THREE upstream NVR paths documented in §3 (Path
  # A HACS frigate add-on, Path B external / cloud NVR,
  # Path C local container / VM NVR). Forgetting to pick
  # a path means the upstream HA core `frigate`
  # integration has no NVR engine to connect to (the
  # upstream `frigate` integration is a client; it needs
  # an NVR engine to connect to).
  requires_user_choice: true
  # The recipe depends on the operator editing the
  # camera URLs via `input_text.rc_security_camera_url`
  # (a comma-separated list of camera URLs) + the
  # optional camera username + password + motion
  # detection toggle. Forgetting to wire the URLs means
  # the upstream `frigate` integration cannot connect
  # to any cameras.
  requires_user_input: true

# External upstream integration references. The recipe
# is honest-upstream-truth: the HA core `frigate`
# integration IS the canonical NVR integration (since
# 2022.x); RoamCore does NOT fork any of these. The
# links.official list points at the canonical upstream
# integration docs.
