    - https://www.home-assistant.io/integrations/frigate/
    - https://www.home-assistant.io/integrations/camera/
    - https://www.home-assistant.io/integrations/input_boolean/
    - https://www.home-assistant.io/integrations/input_text/
    - https://www.home-assistant.io/integrations/input_datetime/
    - https://www.home-assistant.io/integrations/input_button/
    - https://www.home-assistant.io/integrations/select/
    - https://www.home-assistant.io/integrations/recorder/
    - https://www.home-assistant.io/integrations/template/
    - https://www.home-assistant.io/integrations/logbook/
    - https://www.home-assistant.io/integrations/script/
  hacs:
    - https://hacs.xyz/docs/setup/prerequisites
  community:
    - https://www.home-assistant.io/docs/authentication/
    - https://www.home-assistant.io/integrations/recorder/
    - https://www.home-assistant.io/docs/scripts/

# Tier-b contracts. tier_requirements lists the audit's
# hard requirements for tier-b; tier_warnings lists the
# honest disclosures about why this slice is tier-b
# rather than tier-a.
tier_requirements:
  # The recipe MUST be published at the path declared in
  # docs.recipe (the source-of-truth howto).
  - docs_recipe_published
  # The dashboard tiles MUST be vendor-neutral per
  # docs/reference/rc-entity-naming.md (no vendor names
  # in any `rc_*` tile id).
  - dashboard_tiles_vendor_neutral
  # The connection.yml MUST declare a category that
  # matches the legacy catalog path's category (the
  # legacy doc lives at docs/catalog/cctv/frigate.md).
  - category_matches_legacy_doc
  # The FIVE §8 MANDATORY automations MUST be documented
  # in the recipe (per-camera offline guard + per-camera
  # records-on-motion guard + per-camera motion-mask
  # guard + storage-full guard + retentions-spin-down
  # guard).
  - automations_documented
tier_warnings:
  # No RoamCore-owned NVR engine on CI to integration-
  # test against (the bench would require canned fixture
  # responses for camera-offline events + canned fixture
  # responses for records-on-motion events + canned
  # fixture responses for motion-mask changes events +
  # canned fixture responses for storage-full events +
  # canned fixture responses for retentions-spin-down
  # events — all wired together in a controlled
  # environment).
  - no_native_nvr_engine_for_integration_test
  # The recipe depends on the operator choosing ONE of
  # the THREE upstream NVR paths documented in §3 (Path
  # A HACS frigate add-on, Path B external / cloud NVR,
  # Path C local container / VM NVR).
  - recipe_depends_on_user_choosing_nvr_path
  # The recipe depends on the operator editing the
  # camera URLs at `input_text.rc_security_camera_url`
  # (a comma-separated list of camera URLs) + the
  # optional camera username + password + motion
  # detection toggle.
  - recipe_depends_on_user_wiring_camera_urls
  # The operator must confirm the cameras are online
  # (`binary_sensor.rc_security_camera_online` reads
  # TRUE) before the first recording; the §8.1
  # per-camera offline guard surfaces a critical
  # notification when a camera has gone offline.
  - requires_operator_confirming_cameras_online_before_first_recording
  # The §8.5 records-on-motion guard MUST be wired to the
  # `input_boolean.rc_storage_recording_enabled` toggle;
  # forgetting to wire the guard means a misconfigured
  # deployment could record without the operator's
  # consent.
  - records_on_motion_guard_must_be_wired

# The 12 vendor-neutral contract tiles documented in the
# recipe §7 contract layer. Every tile id MUST match
# `^[a-z_]+\.rc_(security|storage)_[a-z0-9_]+$` per
# docs/reference/rc-entity-naming.md; the `security`
# subsystem is OWNED by this slice (the FIRST
# `security`-category `security` slice in the RoamCore
# connection pipeline — the `security` subsystem addition
# to docs/reference/rc-entity-naming.md is the FIRST
# `security`-category `security` slice) and the `storage`
# subsystem is OWNED by this slice (the FIRST
# `security`-category `storage` slice in the RoamCore
# connection pipeline — the `storage` subsystem addition
# to docs/reference/rc-entity-naming.md is the FIRST
# `security`-category `storage` slice).
#
# The 12 contract tiles are split into 4 cameras + 4
# detection + 4 recording/storage:
#   binary_sensor.rc_security_camera_online
#     (the generic per-camera online chip; mirrors the
#      upstream `frigate` integration's camera-online
#      state; the §8.1 per-camera offline guard's
#      canonical safety chip + the §8.2 cameras-online
#      guard's target)
#   binary_sensor.rc_security_camera_recording
#     (the generic per-camera recording chip; mirrors
#      the upstream `recorder` integration's recording
#      state for the camera; the §8.5 records-on-motion
#      guard's target)
#   sensor.rc_security_camera_last_motion
#     (the generic per-camera last-motion timestamp;
#      mirrors the upstream `frigate` integration's
#      last-motion event for the camera; the §8.3
#      per-camera motion-mask guard's target)
#   sensor.rc_security_camera_motion_mask
#     (the generic per-camera motion-mask count; mirrors
#      the upstream `frigate` integration's motion-mask
#      state for the camera; the §8.3 per-camera
#      motion-mask guard's target)
#   sensor.rc_security_detection_person_count
#     (the generic per-camera person-detection count
#      aggregated across all cameras; mirrors the
#      upstream `frigate` integration's detection event
#      log for `person` label)
#   sensor.rc_security_detection_car_count
#     (the generic per-camera car-detection count
#      aggregated across all cameras; mirrors the
#      upstream `frigate` integration's detection event
#      log for `car` label)
#   sensor.rc_security_detection_animal_count
#     (the generic per-camera animal-detection count
#      aggregated across all cameras; mirrors the
#      upstream `frigate` integration's detection event
#      log for `animal` label)
#   sensor.rc_security_detection_package_count
#     (the generic per-camera package-detection count
#      aggregated across all cameras; mirrors the
#      upstream `frigate` integration's detection event
#      log for `package` label)
#   input_boolean.rc_storage_recording_enabled
#     (the generic master enable for the upstream
#      `recorder` integration's `record` service; default
#      OFF for the recommended safe-default mode; the
#      §8.5 records-on-motion guard fires whenever a
#      `record` service call arrives while this toggle
#      is OFF)
#   sensor.rc_storage_recording_used
#     (the generic per-camera recording storage used in
#      gigabytes; mirrors the upstream `recorder`
#      integration's storage stat)
#   sensor.rc_storage_recording_free
#     (the generic per-camera recording storage free in
#      gigabytes; mirrors the upstream `recorder`
#      integration's storage stat; the §8.4 storage-full
#      guard fires when this dips below 10 GB)
#   sensor.rc_storage_recording_retention_today_count
#     (the generic per-camera recording retention today
#      count; the count of recordings retained today
#      before the retention-spin-down cycle; the §8.5
#      retentions-spin-down guard fires when this
#      exceeds the operator's configured threshold)
dashboard:
  tiles:
    - binary_sensor.rc_security_camera_online
    - binary_sensor.rc_security_camera_recording
    - sensor.rc_security_camera_last_motion
    - sensor.rc_security_camera_motion_mask
    - sensor.rc_security_detection_person_count
    - sensor.rc_security_detection_car_count
    - sensor.rc_security_detection_animal_count
    - sensor.rc_security_detection_package_count
    - input_boolean.rc_storage_recording_enabled
    - sensor.rc_storage_recording_used
    - sensor.rc_storage_recording_free
    - sensor.rc_storage_recording_retention_today_count

