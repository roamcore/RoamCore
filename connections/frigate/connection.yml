# Frigate (NVR with on-device object detection) — tier-b recipe connection.
#
# Promoted from docs/catalog/cctv/frigate.md (was tier-c, legacy/community
# only). Stays at tier-b because RoamCore does NOT ship a Frigate container
# of its own and we have no real Frigate NVR on the bench to integration-
# test against. We RECIPE the upstream HA core `frigate` integration
# (https://www.home-assistant.io/integrations/frigate/, ships in core since
# 2021, config_flow since 2022.4) OR the community `frigate-hass-integration`
# HACS path on top of the operator's own Frigate container (HA add-on or
# external Docker), and layer a contract on top (`rc_security_camera_*` and
# `rc_security_recording_*` tiles that subscribe to Frigate's MQTT events).
#
# Frigate publishes object-detection events on the MQTT broker
# (https://frigate.video/) — natural cross-reference to the
# `connections/mqtt/` broker-everything-depends-on. The contract layer in
# this connection subscribes to `frigate/events` + `frigate/available` and
# maps them into RoamCore-stable `rc_security_*` entities.
#
# This connection is the CCTV slice of RoamCore:
#   - powers the `rc_security_camera_*` contract sensors (count, motion,
#     last-motion timestamp, object-detection summary)
#   - powers the `rc_security_recording_active` and `rc_storage_frigate_usage`
#     tiles (NVR recording state + storage % used on the recordings volume)
#   - feeds the OpenClaw "is anyone at the door right now?" / "any cars in
#     the driveway?" / "show me motion events from the last hour" queries
id: frigate
name: Frigate (NVR with on-device object detection)
tier: b
category: cctv
status: beta
version: 0.1.0
description: |
  Frigate is a self-hosted NVR with on-device ML object detection — person,
  car, animal, package, etc. — that runs on your own hardware (HA add-on
  container or external Docker) and records to local storage. Tier-b
  recipe: we publish the documented setup for the upstream HA core
  `frigate` integration (which talks to your Frigate container over its
  HTTP API + MQTT events), and layer a contract on top
  (`rc_security_camera_*` and `rc_security_recording_*` dashboard tiles
  that subscribe to Frigate's MQTT events). No native config_flow, no
  shipped Frigate container — you bring the NVR, we bring the contract.
icon: cctv
codeowners:
  - "@bernardc"
tags:
  - frigate
  - nvr
  - cctv
  - object-detection
  - security
  - recipe

wizard:
  # Recipe = "run a Frigate container (HA add-on or external Docker),
  # point at it, then come back". No one-tap, no auto-discover — Frigate
  # is a separate container with its own storage + RTSP concerns and
  # can't be assumed present.
  connection_kind: recipe
  one_tap: false
  auto_discover: false
  estimated_time: "~20 min"
  requires_reboot: false
  setup_notes: |
    Frigate is a container (HA add-on `community/frigate` recommended,
    or external Docker). It needs RTSP/ONVIF-capable IP cameras on the
    LAN, an SSD/NVMe volume for recordings (1 TB minimum recommended),
    and ideally the Mosquitto broker from the `connections/mqtt/`
    slice to carry the `frigate/events` topic. The recipe documents
    both paths (add-on + external Docker) and wires the upstream HA
    core `frigate` integration against your running container.

install:
  # The HA integration domain is the upstream core `frigate` integration
  # (https://www.home-assistant.io/integrations/frigate/, ships in HA
  # core, has had config_flow since 2022.4). We DO NOT ship a config_flow
  # of our own — the connection stays tier-b because RoamCore adds no
  # native integration code beyond the contract tiles documented in the
  # recipe.
  #
  # config_flow: true here is the upstream truth (Frigate has had a
  # config_flow since 2021). It does NOT mean RoamCore ships its own
  # config_flow; the recipe documents how to use the upstream one.
  ha_integration_domain: frigate
  config_flow: true           # upstream HA core `frigate` integration truth
  hacs: false                 # tier-b: we use core frigate; no HACS integration of our own
  python_requirements: []
  min_ha_version: "2024.8"
  side_effects:
    - adds_dashboard_card               # installs the rc_security_* + rc_storage_frigate_* contract tiles
    - adds_motion_binary_sensors        # camera motion events -> HA binary_sensor (binary_sensor.rc_security_camera_motion_active, per-camera binary_sensors)
    - configures_frigate_mqtt            # subscribes to the operator's MQTT broker on the frigate/events topic (natural cross-reference to connections/mqtt)

dashboard:
  tiles:
    # Follow docs/reference/rc-entity-naming.md: vendor-neutral rc_security_*
    # and rc_storage_frigate_* ids. NO `frigate`, `go2rtc`, `blakeblackshear`
    # in any rc_ tile id. Sources are the contract entities the recipe
    # documents; they subscribe to Frigate's MQTT events and present
    # RoamCore-stable attributes to the dashboard.
    - id: rc_security_camera_count
      label: Cameras
      unit: "online"
      source: sensor.rc_security_camera_count
      icon: cctv
    - id: rc_security_camera_motion_active
      label: Motion
      source: binary_sensor.rc_security_camera_motion_active
      icon: motion-sensor
    - id: rc_security_recording_active
      label: Recording
      source: binary_sensor.rc_security_recording_active
      icon: record-rec
    - id: rc_security_last_motion_at
      label: Last motion
      source: sensor.rc_security_last_motion_at
      icon: clock-outline
    - id: rc_security_object_detection_summary
      label: Detections (1h)
      source: sensor.rc_security_object_detection_summary
      icon: tag-multiple
    - id: rc_storage_frigate_usage
      label: Storage
      unit: "%"
      source: sensor.rc_storage_frigate_usage
      icon: harddisk

openclaw:
  queries:
    - "is anyone at the door right now?"
    - "show me motion events from the last hour"
    - "what's the storage usage?"
    - "are all cameras online?"
    - "any cars in the driveway?"
  summary_keys:
    - security_camera_count
    - security_camera_motion_active
    - security_recording_active
    - security_last_motion_at
    - security_object_detection_summary
    - storage_frigate_usage_percent

# Tier-b: tests are optional (and we have no real Frigate container to
# test against). The tests/test_connection_yml.py file below asserts the
# manifest itself is honest about its tier + requirements; that satisfies
# the audit without claiming fake integration coverage.
tests:
  - tests/test_connection_yml.py

tier_requirements:
  # The only thing a tier-b connection needs is a published recipe doc.
  # We publish docs/recipe.md below.
  - docs_recipe_published

tier_warnings:
  - no_real_frigate_for_integration_test
  - recipe_depends_on_user_running_frigate_container

links:
  official:
    - https://www.home-assistant.io/integrations/frigate/
    - https://frigate.video/
  docs:
    - https://docs.frigate.video/
    - https://github.com/blakeblackshear/frigate
  repo:
    - https://github.com/blakeblackshear/frigate