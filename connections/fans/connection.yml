description: |
  Fans (vendor-neutral fan-controller umbrella for HA, covering
  rooftop vent fans + circulation fans + bathroom exhaust fans —
  rooftop + circulation fans cover the climate-aware airflow +
  the rain-sensor safety block; bathroom exhaust fans wire as a
  separate downstream `fan.*` entity that RoamCore does NOT
  own) — the umbrella for "Fans are a simple upgrade that
  massively improves comfort: airflow, condensation control,
  cooking smells, and keeping the van livable in warm weather" —
  is the ventilation-category complement to the broader
  RoamCore climate-aware automation affordances. The single
  "is the fan currently running?" tile aggregates the upstream
  fan state into one dashboard indicator; the "current speed"
  tile surfaces the fan's 0-100 percent; the "fan mode"
  selector is the operator-facing affordance (one of `off` /
  `low` / `med` / `high` / `auto` / `rain_safe`); the "fan
  active" tile is the AND gate (TRUE iff the fan is currently
  running); the "runtime minutes today" tile is the daily
  runtime aggregate; the "last trigger reason" tile surfaces
  the reason the fan was last turned on (one of `manual` /
  `humidity` / `temperature` / `schedule` / `sleep`); the
  "run-now 15min" button is the manual override (the operator
  can force the fan to run for 15 minutes from the dashboard
  without waiting for the auto-fan-on-humidity-high or auto-
  fan-on-temperature-high automations); the "rain sensor
  active" tile is the rooftop safety block (TRUE iff the rain
  sensor is wet — the rooftop fan is forced OFF + the rooftop
  vent cover is forced CLOSED when this tile is TRUE).

  RoamCore does NOT ship a native fan integration; we RECIPE
  the well-understood upstream HA core `fan` integration
  (since 2022.x — has exposed a `set_percentage` service + a
  `percentage` attribute + a `preset_mode` attribute + the
  `fan.turn_on` / `fan.turn_off` / `fan.toggle` /
  `fan.set_percentage` / `fan.set_preset_mode` services + the
  `fan` domain since 2022.x) + the HA core `template:` fan
  wrapper (since 2022.x — wraps any relay state or upstream
  `fan.*` entity into a virtual `fan.*` entity that exposes
  the standard `percentage` + `preset_mode` + the
  `fan.set_percentage` service contract) + the HA core
  `zwave_js` integration (since 2022.x — surfaces Z-Wave fan
  controllers like the Zooz ZEN17 + Aeotec Nano Switch +
  Inovelli LZW42 as `fan.*` entities) + the HA core `zha`
  integration (since 2022.x — surfaces Zigbee fan controllers
  like generic-Zigbee fan controllers + the Tuya Zigbee fan
  family as `fan.*` entities) + the HACS `bond` integration
  (HACS — surfaces Bond Home RF-bridge-controlled ceiling
  fans + Hunter SIMPLEconnect fans as `fan.*` entities) + the
  HACS `tuya` integration (HACS — surfaces Tuya Wi-Fi smart
  fans as `fan.*` entities) + the HA core `mqtt` integration
  (since 2022.x — surfaces MQTT-driven fan controllers +
  Tasmota-flashed fan controllers as `fan.*` entities). The
  umbrella publishes the 8 `rc_fan_*` contract tiles
  documented below (vendor-neutral — no MaxxAir / Fan-Tastic /
  MAXXAIR Deluxe / Heng's / Vento / generic-Zigbee /
  generic-Z-Wave / Tuya / Shelly / Zooz / Aeotec / Inovelli /
  Bond Home / Hunter / Shelly names leak into the tile ids).
  RoamCore does NOT fork any of the upstream fan integrations;
  the contract layer is a thin upstream-entity-aggregation
  wrapper + the vendor-neutral tile surface + the rain-sensor
  safety block.

  The recipe covers the FOUR operator-pickable fan-controller
  paths (Path A Z-Wave / Zigbee / MQTT fan controllers + Path
  B Wi-Fi / BLE smart fans via Bond Home + Hunter SIMPLEconnect
  + Tuya + Path C generic 12 V / 24 V fan + relay + Path D
  all-in-one smart fan like MaxxAir / Fan-Tastic / MAXXAIR
  Deluxe rooftop vent fan) + the FIVE §8 automations (auto-
  fan on humidity high + auto-fan on temperature high +
  manual override via `button.rc_fan_run_now_15min` + rain-
  sensor hard-block + Sleep mode suppression via
  `select.rc_mode`) + the 8 `rc_fan_*` contract tiles + the
  6 §9 troubleshooting entries + the §10 privacy section (no
  RoamCore-side telemetry; the upstream fan entity's logs
  are operator-owned via the HA core logbook; MaxxAir /
  Fan-Tastic / MAXXAIR Deluxe / Bond Home / Hunter
  SIMPLEconnect / Tuya require their own cloud auth for
  first-time setup if the operator selects Path B / Path D
  but subsequent runs are local; Path A Z-Wave / Zigbee is
  fully local) + the §11 tier-a promotion outline (real
  Z-Wave fan controller + 12 V fan + Bond Home + MaxxAir +
  rain sensor on CI bench + RoamCore-owned operator-wired
  setup flow walking the operator through choosing Path A /
  B / C / D + declaring the upstream entities + the rain-
  sensor safety block + integration tests asserting a
  humidity-high event triggers the auto-fan + a rain-sensor-
  trip event forces the fan off + a Sleep mode change
  suppresses the auto-fan) + the §12 cross-references (the
  HVAC basics Wave 3 #49 connection for
  `sensor.rc_hvac_interior_temperature` +
  `sensor.rc_hvac_interior_humidity` + the time-atomic Wave
  3 #55 connection for the time-of-day / sunrise-sunset
  primitives used by the §8 Sleep mode suppression +
  the cover entities for the §8.4 rain-sensor hard-block +
  the mode/automation-builder Wave 2 #23 connection for the
  `select.rc_mode` tile + the RFID-blocker-free rain sensor
  contract + the climate-aware automation pattern from the
  HVAC basics Wave 3 #49 connection).

  The REUSE-FIRST strategy is intentional: HA's core `fan`
  integration (since 2022.x) handles 95%+ of operator-facing
  fan operators (the `set_percentage` service + the
  `percentage` attribute + the `preset_mode` attribute); the
  HA core `template:` fan wrapper (since 2022.x) wraps any
  relay state into a virtual `fan.*` entity that exposes the
  standard contract; the HA core `zwave_js` integration
  (since 2022.x) handles the Z-Wave fan controllers; the HA
  core `zha` integration (since 2022.x) handles the Zigbee
  fan controllers; the HACS `bond` integration (HACS)
  handles the Bond Home + Hunter SIMPLEconnect fans; the
  HACS `tuya` integration (HACS) handles the Tuya Wi-Fi
  smart fans; the HA core `mqtt` integration (since 2022.x)
  handles the Tasmota-flashed relay + the operator's MQTT-
  driven fan controllers. All upstream integrations are
  upstream / vendor / HACS code; the RoamCore wrapper is a
  thin upstream-entity-aggregation layer + the contract
  layer + the rain-sensor safety block.
