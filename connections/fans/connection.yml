wizard:
  connection_kind: recipe
  one_tap: false
  auto_discover: false
  estimated_time: "~30 min"
  requires_reboot: false
  setup_notes: |
    Fans requires the operator to (a) have at least 1
    controllable fan installed (rooftop vent fan + circulation
    fan + bathroom exhaust fan), (b) pick ONE of the FOUR
    fan-controller paths (Path A Z-Wave / Zigbee / MQTT fan
    controllers + Path B Wi-Fi / BLE smart fans via Bond
    Home + Hunter SIMPLEconnect + Tuya + Path C generic
    12 V / 24 V fan + relay + Path D all-in-one smart fan
    like MaxxAir / Fan-Tastic / MAXXAIR Deluxe), (c) set up
    the chosen path's upstream integration (Path A — install
    the HA core `zwave_js` integration OR the HA core `zha`
    integration OR the HA core `mqtt` integration + wire the
    fan controller into HA + verify the upstream `fan.*`
    entity exists; Path B — install the HACS `bond`
    integration OR the HACS `tuya` integration OR the HACS
    `hunterdouglas_simplify` integration + wire the smart
    fan into HA + verify the upstream `fan.*` entity
    exists; Path C — install the HA core Shelly integration
    OR the HA core `zwave_js` integration + wire the relay
    into HA + create a `template:` fan wrapping the relay
    state into a virtual `fan.ventilation` entity; Path D —
    install the rooftop vent fan per the manufacturer
    instructions + wire it into HA via the manufacturer-
    recommended integration + verify the upstream `fan.*`
    entity + the upstream `cover.*` entity exist), (d)
    configure temperature + humidity via the HVAC basics
    Wave 3 #49 connection's `sensor.rc_hvac_interior_
    temperature` + `sensor.rc_hvac_interior_humidity`
    (REQUIRED — the §8.1 + §8.2 auto-fan automations read
    from these tiles), (e) configure the optional rain
    sensor for the rooftop rain-safe mode (REQUIRED for
    Path D rooftop vent fans; OPTIONAL for Path A / Path B
    / Path C — the §8.4 rain-sensor hard-block automation
    reads from `binary_sensor.rc_fan_rain_sensor_active`),
    (f) configure optional time-of-day / sunrise-sunset for
    the Sleep mode suppression via the time-atomic Wave 3
    #55 connection, (g) configure the operator-facing
    `fan.rc_fan_main` contract tile to point at the
    operator's chosen upstream `fan.*` entity, (h)
    configure `select.rc_fan_mode` to the operator's chosen
    starting mode (default `auto`), (i) wire the FIVE §8
    automations (auto-fan on humidity high + auto-fan on
    temperature high + manual override via
    `button.rc_fan_run_now_15min` + rain-sensor hard-block
    + Sleep mode suppression via `select.rc_mode`). RoamCore
    does NOT maintain a custom fan integration; the HA core
    `fan` integration handles 95%+ of operator-facing fan
    operators (the `set_percentage` service + the
    `percentage` attribute + the `preset_mode` attribute);
    the HA core `template:` fan wrapper handles the
    operator's relay-driven fan; the HACS `bond` integration
    handles the Bond Home + Hunter SIMPLEconnect fans; the
    HACS `tuya` integration handles the Tuya Wi-Fi smart
    fans; the upstream manufacturer integration handles the
    Path D rooftop vent fans.

