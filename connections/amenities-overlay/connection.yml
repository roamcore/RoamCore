wizard:
  connection_kind: recipe
  one_tap: false
  auto_discover: false
  estimated_time: "~25 min"
  requires_reboot: false
  setup_notes: |
    Amenities overlay requires the operator to (a)
    verify the upstream Overpass API
    (`https://overpass-api.de/api/interpreter`) is
    reachable from the HA host (curl the endpoint
    with a minimal query), (b) install the upstream
    HA core `rest:` integration (auto-installed in
    every HA install since 2017 — exposes a GUI flow
    for the operator to add a derived `sensor.*`
    entity from an HTTP endpoint under Settings →
    Devices & Services → Add Integration → REST),
    (c) install the upstream HA core `input_boolean`
    + `input_select` + `input_number` helpers (HA
    core since 2022.x — auto-installed in every HA
    install + exposed via the HA UI under Settings →
    Helpers), (d) wire the upstream Overpass `rest:`
    sensor (the operator configures the REST endpoint
    + the JSON path + the scan interval pointing at
    `https://overpass-api.de/api/interpreter` with a
    minimal `amenity=drinking_water` query for the
    water category + an equivalent query for each of
    the 8 categories), (e) optionally install the
    RoamCore TileServer add-on (Wave 2 catalog #21)
    for the offline POI cache + populate the cache
    with POIs for the operator's most-travelled
    areas, (f) configure the operator-facing
    `input_boolean.rc_amenities_overlay_enabled` +
    `input_boolean.rc_amenities_overlay_fail_safe` +
    `select.rc_amenities_overlay_radius_km` +
    `select.rc_amenities_overlay_data_source` +
    `number.rc_amenities_overlay_cache_ttl_min` +
    `number.rc_amenities_overlay_rate_limit_per_hour`
    contract tiles to point at the upstream helpers,
    (g) wire the FIVE §8 MANDATORY automations
    (overlay must fail safe + overlay must be rate-
    limited + overlay must be user-configurable +
    overlay must require internet OR offline cache +
    overlay auto-disables when vehicle is moving > N
    km/h), (h) enable amenities overlay via
    `input_boolean.rc_amenities_overlay_enabled` +
    pick the POI categories via the per-category
    enable buttons + pick the radius + pick the data
    source. RoamCore does NOT maintain a custom
    amenities-overlay engine; the upstream Overpass
    API + the HA core `rest:` integration + the HA
    core `input_boolean` + `input_select` +
    `input_number` helpers + the HA core `template:`
    sensor + `template:` binary_sensor wrappers +
    the optional RoamCore TileServer add-on handle
    95%+ of operator-facing amenities-overlay
    operations.

