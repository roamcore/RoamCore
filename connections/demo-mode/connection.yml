wizard:
  connection_kind: recipe
  one_tap: false
  auto_discover: false
  estimated_time: "~20 min"
  requires_reboot: false
  setup_notes: |
    Demo mode requires the operator to (a) install the
    upstream HA core `input_boolean` + `input_select` +
    `input_text` + `input_number` helpers (HA core since
    2022.x — these are auto-installed in every HA install
    + exposed via the HA UI under Settings → Helpers),
    (b) wire the upstream sensor availability signals
    (the operator's chosen battery sensor — Victron /
    Renogy / generic shunt; the operator's chosen tank
    sensor — SeeLevel / Garnet / Mopeka / generic
    resistive; the operator's chosen LTE-up binary
    sensor — Peplink / Teltonika / Starlink / generic
    router), (c) configure the operator-facing
    `input_boolean.rc_demo_mode_enabled` +
    `select.rc_demo_mode_scenario` +
    `sensor.rc_demo_mode_active_scenario` +
    `binary_sensor.rc_demo_mode_is_blocking_real_hardware`
    + `sensor.rc_demo_mode_demo_value_battery_soc_percent`
    + `sensor.rc_demo_mode_demo_value_water_fresh_percent`
    + `binary_sensor.rc_demo_mode_demo_value_connectivity_
    lte_up` contract tiles to point at the upstream
    entities + populate `input_text.rc_demo_mode_real_
    hardware_targets` with the comma-separated list of
    real-hardware entity ids the §9.2 never-controls-
    hardware guard should protect, (d) wire the FIVE §8
    MANDATORY automations (auto-disable on real sensor
    reconnect + never-controls-actual-hardware guard +
    blocks-remote-access guard + audit-log entry +
    operator-only guard), (e) enable demo mode via one
    of the four `button.rc_demo_mode_enable_*` buttons
    (or by flipping `input_boolean.rc_demo_mode_enabled`
    ON manually) + pick a scenario via
    `select.rc_demo_mode_scenario`. RoamCore does NOT
    maintain a custom demo-mode engine; the HA core
    `input_boolean` + `input_select` + `input_text` +
    `input_number` helpers + the HA core `template:`
    sensor + `template:` binary_sensor wrappers handle
    95%+ of operator-facing demo-mode operations.

install:
  ha_integration_domain: input_boolean
  config_flow: true
  hacs: false
  hacs_url: ""
  doc_recipe_only: false
  python_requirements: []
  min_ha_version: "2022.6"
  side_effects:
    - registers_demo_mode_enabled_contract_tile
    - registers_demo_mode_scenario_contract_tile
    - registers_demo_mode_active_scenario_contract_tile
    - registers_demo_mode_is_blocking_real_hardware_contract_tile
    - registers_demo_mode_demo_value_battery_soc_percent_contract_tile
    - registers_demo_mode_demo_value_water_fresh_percent_contract_tile
    - registers_demo_mode_demo_value_connectivity_lte_up_contract_tile
    - registers_demo_mode_enable_battery_contract_tile
    - registers_demo_mode_enable_water_contract_tile
    - registers_demo_mode_enable_connectivity_contract_tile
    - registers_demo_mode_disable_contract_tile
    - may_register_demo_mode_auto_disable_automation
    - may_register_demo_mode_never_controls_hardware_automation
    - may_register_demo_mode_blocks_remote_access_automation
    - may_register_demo_mode_audit_log_automation
    - may_register_demo_mode_operator_only_automation

dashboard:
  title: "Demo mode"
  tiles:
    - input_boolean.rc_demo_mode_enabled
    - select.rc_demo_mode_scenario
    - sensor.rc_demo_mode_active_scenario
    - binary_sensor.rc_demo_mode_is_blocking_real_hardware
    - sensor.rc_demo_mode_demo_value_battery_soc_percent
    - sensor.rc_demo_mode_demo_value_water_fresh_percent
    - binary_sensor.rc_demo_mode_demo_value_connectivity_lte_up
    - button.rc_demo_mode_enable_battery
    - button.rc_demo_mode_enable_water
    - button.rc_demo_mode_enable_connectivity
    - button.rc_demo_mode_disable

openclaw:
  queries:
    - "is demo mode enabled?"
    - "what demo scenario is active?"
    - "is demo mode blocking real hardware?"
    - "what is the demo battery SoC?"
    - "what is the demo fresh-water percentage?"
    - "is the demo LTE upstream up?"
    - "enable battery demo"
    - "enable water demo"
    - "enable connectivity demo"
    - "disable demo mode"
  summary_keys:
    - demo_mode_enabled
    - demo_mode_scenario
    - demo_mode_active_scenario
    - demo_mode_is_blocking_real_hardware
    - demo_mode_demo_value_battery_soc_percent
    - demo_mode_demo_value_water_fresh_percent
    - demo_mode_demo_value_connectivity_lte_up

tests:
