wizard:
  connection_kind: recipe
  one_tap: false
  auto_discover: false
  estimated_time: "~15 min"
  requires_reboot: false
  setup_notes: |
    Agent actions allowlist requires the operator to (a)
    confirm the existing `input_boolean.rc_agent_actions_
    enabled` kill switch (already shipped in
    `homeassistant/packages/roamcore_agent_actions.yaml`;
    DO NOT redefine the package), (b) install the upstream
    HA core `input_boolean` + `input_text` + `input_number`
    + `input_select` + `input_datetime` + `input_button` +
    `script` helpers (HA core since 2022.x — these are auto-
    installed in every HA install + exposed via the HA UI
    under Settings → Helpers), (c) configure the operator-
    facing `input_text.rc_agent_actions_policy_path` +
    `input_boolean.rc_agent_actions_require_confirmation` +
    `select.rc_agent_actions_default_duration` +
    `input_datetime.rc_agent_actions_session_expires_at` +
    `sensor.rc_agent_actions_seconds_until_expiry` +
    `sensor.rc_agent_actions_last_action_id` +
    `sensor.rc_agent_actions_last_action_at` +
    `sensor.rc_agent_actions_last_action_result` +
    `binary_sensor.rc_agent_actions_is_blocked_by_kill_
    switch` + `button.rc_agent_actions_disable_now`
    contract tiles to point at the upstream entities, (d)
    populate the policy file at
    `input_text.rc_agent_actions_policy_path` (default
    `/config/.roamcore/agent_allowlist.yaml`; the slice
    ships an EXAMPLE policy file at
    `connections/agent-actions-allowlist/docs/policy.example.yaml`
    the operator copies to that path and edits for their
    setup), (e) wire the FIVE §8 MANDATORY automations
    (kill-switch-blocks-everything guard + session-timeout
    guard + audit-log entry + require-confirmation guard +
    outside-allowlist deny-by-default guard), (f) follow the
    FIVE-step operator flow — Step 1 confirm the kill switch
    is OFF (the §8.1 kill-switch-blocks-everything guard
    defaults the kill switch OFF; Step 2 mount the policy
    file at the operator-chosen path; Step 3 pick the default
    duration (Off / 1h / 6h / 24h / 7d / Never; default
    24h); Step 4 enable the kill switch + set the require-
    confirmation toggle + watch the session_expires_at
    countdown; Step 5 audit the action logbook + press
    `button.rc_agent_actions_disable_now` to revert. RoamCore
    does NOT maintain a custom agent-actions engine; the HA
    core `input_boolean` + `input_text` + `input_number` +
    `input_select` + `input_datetime` + `input_button` +
    `script` helpers + the HA core `template:` sensor
    wrapper + the HA core `logbook` integration handle 95%+
    of operator-facing agent-actions operations.

