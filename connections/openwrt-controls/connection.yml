# Tier-a recipe: tests assert manifest honesty (the 27 tiles + the 4
# control scripts + the 5 safety tiles + the FOUR §8 MANDATORY
# automations + the cross-references + the bench-fixture gap). No
# pytest integration tests for the OpenWrt packages on CI bench
# (the OpenWrt REST API is the actual surface; the bench-fixture
# gap is documented in §12 of the recipe).
tests:
  - tests/test_connection_yml.py

tier_requirements:
  # The only thing a tier-a recipe connection needs (per the
  # tier-a-but-flagged honesty pattern from the openclaw-api /
  # openclaw-json-api / map-dashboard / advanced-mode slices).
  ha_package: true
  one_tap_install: false     # recipe over upstream HA core `rest:` + `command_line:` + `select:` integrations
  docs_recipe_published: true
  smoketest_present: false   # curl-based smoketest not applicable (OpenWrt REST API requires a live OpenWrt instance); pytest bench fixtures gap documented in §12
  integration_tests_bench_fixture_gap_documented: true
  integration_tests:
    present: false
    reason: "No real OpenWrt router on the CI bench to integration-test against; the OpenWrt REST API is the actual surface. Tier-a promotion requires adding canned fixture responses for offline / online / degraded / LTE-missing events + a controlled environment to integration-test against."
    bench_artifacts_needed:
      - "canned OpenWrt REST response (all rc_openwrt_* fields populated — online)"
      - "canned OpenWrt REST response (all rc_openwrt_* fields null/unknown — offline)"
      - "canned OpenWrt REST response (degraded Starlink state)"
      - "canned OpenWrt REST response (LTE SIM missing)"
      - "canned OpenWrt REST response (firewall unexpected state)"
      - "preferred-WAN selector = Starlink fires script.rc_openwrt_prefer_starlink"
      - "preferred-WAN selector = LTE fires script.rc_openwrt_prefer_lte"
      - "preferred-WAN selector = Auto fires script.rc_openwrt_prefer_auto"
      - "restart-network BLOCKS without confirm-flag"
      - "restart-network proceeds with confirm-flag ON, then clears confirm-flag"

tier_warnings:
  - no_pytest_bench_fixtures_for_openwrt_packages
  - recipe_depends_on_user_wiring_api_url_and_token
  - recipe_depends_on_user_wiring_lte_sim_state
  - requires_operator_wiring_confirm_flag_before_first_use
  - restart_network_critical_guard_must_be_wired

