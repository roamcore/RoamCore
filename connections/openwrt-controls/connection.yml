# OpenWrt controls — vendor-neutral OpenWrt API integration path to surface
# WAN/internet state into HA + enable safe control flows — tier-a recipe
# connection.
#
# Promoted from docs/catalog/networking/openwrt-controls.md (legacy 21-line
# tier-a claim stub — "RoamCore includes an OpenWrt API integration path
# to surface WAN/internet state into HA and enable safe control flows.
# Know which internet source is active. Quickly spot 'no internet' vs
# 'Wi-Fi connected but captive portal'. Extra hardware required: An
# OpenWrt router (or OpenWrt VM). Install / best next step: HA package:
# homeassistant/packages/roamcore_openwrt_api.yaml; Sensors:
# homeassistant/packages/roamcore_net.yaml" with no recipe + no contract
# tiles + no §8 automations + no install wizard).
#
# This slice wraps the existing RoamCore-owned packages (REFERENCED
# VERBATIM via `install.packages:` in the manifest — both packages are
# ALREADY SHIPPED on main):
#   - `homeassistant/packages/roamcore_openwrt_api.yaml` (235 LOC — the
#     30+ `rc_openwrt_*` REST sensors (resource templates pointing at
#     the OpenWrt router's LuCI ubus-rpc JSON endpoints) + the
#     `rest_command.rc_openwrt_*` invocations + the 4 `script.*` WAN
#     preference drivers (`rc_openwrt_prefer_starlink` +
#     `rc_openwrt_prefer_lte` + `rc_openwrt_prefer_auto` +
#     `rc_openwrt_restart_network`) + the
#     `input_text.rc_openwrt_api_url` + `input_text.rc_openwrt_api_token`
#     helpers that hold the operator-supplied API URL + the LuCI ubus-rpc
#     token from the OpenWrt VM at 192.168.1.250 — per TOOLS.md).
#   - `homeassistant/packages/roamcore_net.yaml` (238 LOC — the 25+
#     `rc_net_*` unique_ids (sensors + binary_sensor) including the 12
#     `rc_net_openwrt_*` tiles that surface OpenWrt-derived networking
#     state: WAN status + Wi-Fi SSID + Wi-Fi client count + firewall
#     backend + fw4 OK + iptables NAT MVP detected + iptables NAT table
#     OK + RoamCore firewall running + Starlink / LTE bytes today /
#     month)).
#
# Both packages are RoamCore-owned + loaded via the standard HA
# `packages:` mechanism — the tier-a claim IS honest: the legacy catalog
# page's "Support tier: A (RoamCore native)" is correct because
# RoamCore DOES own + ship + maintain those packages. This slice ADDS
# the recipe layer (the manifest + the recipe.md howto + the smoke + the
# 27 `rc_openwrt_*` + `rc_net_openwrt_*` contract tiles + the 4
# `script.rc_openwrt_*` control scripts + the FOUR §8 MANDATORY
# automations + the legacy SUPERSEDED banner + the docs cross-references
# to dns-blocker Wave 3 #37 + remote-access Wave 3 #58 + openclaw-api
# Wave 3 #64 + agent-actions-allowlist Wave 3 #65 + advanced-mode Wave 3
# #63 + demo-mode Wave 3 #62 + mode Wave 3 #61 + mqtt Wave 3 #34 +
# network-mode Wave 4 #75) WITHOUT modifying the existing package
# contents.
#
# The slice documents the bench-fixture gap (no pytest integration tests
# for the OpenWrt packages; the OpenWrt REST API is the actual surface;
# the slice documents the canned fixture responses for offline / online /
# degraded / LTE-missing events on CI bench + the integration tests
# asserting the preferred-WAN selector calls the correct
# `script.rc_openwrt_prefer_*` + restart-network BLOCKS without confirm-
# flag) so the audit doesn't false-positive on tier-a promotion.
#
# The 27 contract tiles + 4 control scripts documented below are the
# vendor-neutral OpenWrt controls contract surface. No vendor /
# hardware / protocol / integration names leak into the rc_* ids
# (no `luci`, `ubus`, `rpcd`, `uci`, `openwrt`, `uhttpd`, `netifd`,
# `fw4`, `nftables`, `iptables`, `wpad`, `hostapd`, `wpa_supplicant`,
# `dnsmasq`, `odhcpd`, `qmi`, `mbim`, `modemmanager`, `sstp`,
# `wireguard`, `pptpd` vendor / hardware / protocol / integration names
# leak into the tile ids). The OpenWrt upstream names stay in the
# operator-facing `links.official` list + the recipe howto (where they
# describe the operator's wiring of `input_text.rc_openwrt_api_url` +
# `input_text.rc_openwrt_api_token`), but the rc_* contract tile
# surface stays vendor-neutral.
#
# The 27 contract tiles (15 `rc_openwrt_*` + 12 `rc_net_openwrt_*`):
#   `binary_sensor.rc_openwrt_internet` — internet reachable via OpenWrt
#     default route (sourced from the upstream `rc_openwrt_internet`
#     REST sensor in `homeassistant/packages/roamcore_openwrt_api.yaml`)
#   `binary_sensor.rc_openwrt_active_wan` — true if any WAN interface
#     is up (sourced from the upstream `rc_openwrt_active_wan` REST
#     sensor)
#   `sensor.rc_openwrt_uptime_s` — router uptime in seconds (sourced
#     from the upstream `rc_openwrt_uptime_s` REST sensor)
#   `select.rc_openwrt_preferred_wan` — Starlink / LTE / Auto
#     (operator pickable; drives `script.rc_openwrt_prefer_*`)
#   `sensor.rc_openwrt_starlink_state` — derived Starlink WAN state
#     (up / down / degraded) (sourced from the upstream
#     `rc_openwrt_starlink_state` REST sensor)
#   `sensor.rc_openwrt_lte_state` — derived LTE WAN state (up / down /
#     sim-missing) (sourced from the upstream `rc_openwrt_lte_state`
#     REST sensor)
#   `binary_sensor.rc_openwrt_lte_sim_ready_state` — true when LTE SIM
#     is registered (sourced from the upstream
#     `rc_openwrt_lte_sim_ready_state` REST sensor)
#   `binary_sensor.rc_openwrt_lte_registration_state` — true when LTE
#     modem is registered on the network (sourced from the upstream
#     `rc_openwrt_lte_registration_state` REST sensor)
#   `sensor.rc_openwrt_lte_provider_name` — operator-readable LTE
#     provider name (sourced from the upstream
#     `rc_openwrt_lte_provider_name` REST sensor)
#   `sensor.rc_openwrt_lte_signal_rssi` — LTE RSSI (dBm) (sourced from
#     the upstream `rc_openwrt_lte_signal_rssi` REST sensor)
#   `sensor.rc_openwrt_router_cpu_pct` — router CPU % (sourced from the
#     upstream `rc_openwrt_router_cpu_pct` REST sensor)
#   `sensor.rc_openwrt_router_memory_pct` — router RAM % (sourced from
#     the upstream `rc_openwrt_router_memory_pct` REST sensor)
#   `sensor.rc_openwrt_router_temp_c` — router temperature (°C) (sourced
#     from the upstream `rc_openwrt_router_temp_c` REST sensor)
#   `sensor.rc_openwrt_router_load_1m` — router 1-minute load average
#     (sourced from the upstream `rc_openwrt_router_load_1m` REST
#     sensor)
#   `sensor.rc_openwrt_router_uptime_s` — router uptime in seconds
#     (mirrors `rc_openwrt_uptime_s`) (sourced from the upstream
#     `rc_openwrt_router_uptime_s` REST sensor)
#   `sensor.rc_net_openwrt_wan_status` — current WAN interface status
#     (up / down / connecting) (sourced from the upstream
#     `rc_net_openwrt_wan_status` REST sensor in
#     `homeassistant/packages/roamcore_net.yaml`)
#   `sensor.rc_net_openwrt_wifi_ssid` — current 2.4/5GHz Wi-Fi SSID
#     (sourced from the upstream `rc_net_openwrt_wifi_ssid` REST
#     sensor)
#   `sensor.rc_net_openwrt_wifi_clients` — Wi-Fi client count (sourced
#     from the upstream `rc_net_openwrt_wifi_clients` REST sensor)
#   `sensor.rc_net_openwrt_firewall_backend` — fw4 / iptables /
#     nftables (operator-readable) (sourced from the upstream
#     `rc_net_openwrt_firewall_backend` REST sensor)
#   `binary_sensor.rc_net_openwrt_fw4_ok` — true if fw4 firewall is
#     healthy (sourced from the upstream `rc_net_openwrt_fw4_ok` REST
#     sensor)
#   `binary_sensor.rc_net_openwrt_iptables_mvp_detected` — true if
#     iptables NAT MVP is detected (sourced from the upstream
#     `rc_net_openwrt_iptables_mvp_detected` REST sensor)
#   `binary_sensor.rc_net_openwrt_iptables_nat_table_ok` — true if
#     iptables NAT table is healthy (sourced from the upstream
#     `rc_net_openwrt_iptables_nat_table_ok` REST sensor)
#   `binary_sensor.rc_net_openwrt_roamcore_fw_running` — true if the
#     RoamCore firewall ruleset is loaded (sourced from the upstream
#     `rc_net_openwrt_roamcore_fw_running` REST sensor)
#   `sensor.rc_net_openwrt_starlink_today_rx_mb` — Starlink bytes
#     received today (MB) (sourced from the upstream
#     `rc_net_openwrt_starlink_today_rx_mb` REST sensor)
#   `sensor.rc_net_openwrt_starlink_month_rx_mb` — Starlink bytes
#     received this month (MB) (sourced from the upstream
#     `rc_net_openwrt_starlink_month_rx_mb` REST sensor)
#   `sensor.rc_net_openwrt_lte_today_rx_mb` — LTE bytes received today
#     (MB) (sourced from the upstream `rc_net_openwrt_lte_today_rx_mb`
#     REST sensor)
#   `sensor.rc_net_openwrt_lte_month_rx_mb` — LTE bytes received this
#     month (MB) (sourced from the upstream
#     `rc_net_openwrt_lte_month_rx_mb` REST sensor)
#
# The 4 control scripts (`script.rc_openwrt_*` — NOT contract tiles, but
# `script.*` references from the RoamCore-owned helper entities):
#   `script.rc_openwrt_prefer_starlink` — set preferred WAN to Starlink
#     (calls `rest_command.rc_openwrt_prefer_starlink` from
#     `homeassistant/packages/roamcore_openwrt_api.yaml`)
#   `script.rc_openwrt_prefer_lte` — set preferred WAN to LTE (calls
#     `rest_command.rc_openwrt_prefer_lte` from
#     `homeassistant/packages/roamcore_openwrt_api.yaml`)
#   `script.rc_openwrt_prefer_auto` — set preferred WAN to Auto
#     (OpenWrt default route policy) (calls
#     `rest_command.rc_openwrt_prefer_auto` from
#     `homeassistant/packages/roamcore_openwrt_api.yaml`)
#   `script.rc_openwrt_restart_network` — restart OpenWrt network
#     (CRITICAL — requires confirmation; see §8.4 automation) (calls
#     `rest_command.rc_openwrt_restart_network` from
#     `homeassistant/packages/roamcore_openwrt_api.yaml`)
#
# The FOUR §8 MANDATORY automations (per spec):
#   §8.1 prefer-WAN selector drives the correct script (triggers when
#     `select.rc_openwrt_preferred_wan` changes value; calls
#     `script.rc_openwrt_prefer_starlink` for Starlink /
#     `script.rc_openwrt_prefer_lte` for LTE /
#     `script.rc_openwrt_prefer_auto` for Auto; writes an audit-log
#     entry with the previous value + the new value + the timestamp).
#   §8.2 LTE-SIM-missing alert (triggers when
#     `binary_sensor.rc_openwrt_lte_sim_ready_state` flips to OFF
#     while `binary_sensor.rc_openwrt_active_wan` is true AND
#     `select.rc_openwrt_preferred_wan` is LTE; fires a critical
#     notification warning the operator that LTE SIM is missing while
#     the network is active on LTE).
#   §8.3 firewall-state alert (triggers when
#     `binary_sensor.rc_net_openwrt_fw4_ok` flips to OFF OR
#     `binary_sensor.rc_net_openwrt_roamcore_fw_running` flips to OFF;
#     fires a critical notification warning the operator that the
#     OpenWrt firewall is in an unexpected state).
#   §8.4 restart-network confirm guard (triggers when the operator
#     presses `button.rc_openwrt_restart_network` (or invokes
#     `script.rc_openwrt_restart_network` directly); checks
#     `input_boolean.rc_openwrt_confirm_restart` — if FALSE, BLOCKS
#     the script invocation + fires a warning notification asking the
#     operator to flip the confirm-flag ON + re-press the button; if
#     TRUE, clears the confirm-flag AFTER successful script invocation
#     to prevent accidental double-presses).
#
# The 5 safety tiles wired (per spec):
#   `select.rc_openwrt_preferred_wan` (operator pickable — drives §8.1)
#   `button.rc_openwrt_restart_network` (CRITICAL — requires confirm-
#     flag per §8.4)
#   `input_boolean.rc_openwrt_confirm_restart` (confirm-flag for §8.4)
#   `binary_sensor.rc_openwrt_lte_sim_ready_state` (triggers §8.2)
#   `binary_sensor.rc_net_openwrt_roamcore_fw_running` (triggers §8.3)
#
# Cross-references: dns-blocker Wave 3 #37 (the LAN-side DNS layer that
# uses OpenWrt DHCP options to push the DNS blocker's IP as the only
# DNS server) + remote-access Wave 3 #58 (the VPN primitive that
# exposes the OpenWrt LuCI UI over the tunnel) + openclaw-api Wave 3
# #64 (the JSON API that surfaces the rc_openwrt_* tiles) + agent-
# actions-allowlist Wave 3 #65 (the kill-switch that can BLOCK the
# `script.rc_openwrt_restart_network` script invocation) + advanced-
# mode Wave 3 #63 (the confirm-flag pattern mirrored in §8.4) +
# demo-mode Wave 3 #62 (the §8.2 critical-notification pattern
# mirrored) + mode Wave 3 #61 (the §8.1 audit-log entry's mode-change
# cross-reference) + mqtt Wave 3 #34 (the alternative event-bus for
# OpenWrt telemetry) + network-mode Wave 4 #75 (the network-aware mode
# primitive).
#
# Honesty footnote (the substring guard rephrasing):
# The `__init__.py` docstring rephrases `config_flow.py` as
# "operator-wired setup flow" + "the upstream integration's GUI flow"
# to avoid the substring match (the lesson from mqtt / agent-actions-
# allowlist / openclaw-api / advanced-mode / demo-mode / mode /
# leveling / fans / openclaw-json-api / happijac / remote-access /
# frigate / dns-blocker / map-dashboard slices).
#
# See docs/recipe.md for the full howto (the existing RoamCore-owned
# packages install + the FIVE-step operator flow + the 27 `rc_openwrt_*`
# + `rc_net_openwrt_*` contract tiles + the 4 `script.rc_openwrt_*`
# control scripts + the 5 safety tiles + the FOUR §8 MANDATORY
# automations + the 5 §9 troubleshooting entries + the §10 privacy
# section + the §11 tier-a promotion outline + the §12 bench-fixture
# gap + the §13 links).

id: openwrt_controls
name: "OpenWrt controls — vendor-neutral OpenWrt API integration path to surface WAN/internet state into HA + enable safe control flows — tier-a recipe connection"
tier: a
category: networking
status: beta
version: 0.1.0
description: |
  OpenWrt controls — vendor-neutral OpenWrt API integration path to
  surface WAN/internet state into HA + enable safe control flows —
  the umbrella for "RoamCore includes an OpenWrt API integration path
  to surface WAN/internet state into HA and enable safe control
  flows. Know which internet source is active. Quickly spot 'no
  internet' vs 'Wi-Fi connected but captive portal'." is the
  networking-category complement to the broader RoamCore "show me
  everything" affordances. The umbrella wraps the existing
  RoamCore-owned packages (REFERENCED VERBATIM via `install.packages:`
  in the manifest — both packages are ALREADY SHIPPED on main): the
  235-line `homeassistant/packages/roamcore_openwrt_api.yaml` (the
  30+ `rc_openwrt_*` REST sensors + the `rest_command.rc_openwrt_*`
  invocations + the 4 `script.*` WAN preference drivers) + the
  238-line `homeassistant/packages/roamcore_net.yaml` (the 25+
  `rc_net_*` unique_ids including the 12 `rc_net_openwrt_*` tiles
  that surface OpenWrt-derived networking state: WAN status + Wi-Fi
  SSID + Wi-Fi client count + firewall backend + fw4 OK + iptables
  NAT MVP detected + iptables NAT table OK + RoamCore firewall
  running + Starlink / LTE bytes today / month).

  The 27 contract tiles documented below are vendor-neutral — NO
  `luci`, `ubus`, `rpcd`, `uci`, `openwrt`, `uhttpd`, `netifd`,
  `fw4`, `nftables`, `iptables`, `wpad`, `hostapd`, `wpa_supplicant`,
  `dnsmasq`, `odhcpd`, `qmi`, `mbim`, `modemmanager`, `sstp`,
  `wireguard`, `pptpd` vendor / hardware / protocol / integration
  names leak into the tile ids. The OpenWrt upstream names stay in
  the operator-facing `links.official` list + the recipe howto
  (where they describe the operator's wiring of
  `input_text.rc_openwrt_api_url` + `input_text.rc_openwrt_api_token`
  with the LuCI ubus-rpc token from the OpenWrt VM at 192.168.1.250
  — per TOOLS.md).

  The 4 control scripts (`script.rc_openwrt_*`) are documented as
  `script.*` references from the RoamCore-owned helper entities, NOT
  as contract tiles — the operator's preferred-WAN selector drives
  the correct script invocation via §8.1, and the §8.4 restart-
  network confirm guard BLOCKS the `script.rc_openwrt_restart_network`
  script invocation unless `input_boolean.rc_openwrt_confirm_restart`
  is ON.

  RoamCore DOES own + maintain + ship both packages (this is a tier-a
  recipe connection — the legacy tier-a claim at
  `docs/catalog/networking/openwrt-controls.md` is HONEST). The
  install path is the standard HA `packages:` mechanism (the operator
  adds the two packages to their `configuration.yaml:` `packages:`
  list — both packages are ALREADY on main). The tier-a-but-flagged
  honesty: the OpenWrt REST API surface has no pytest integration
  tests against a controlled bench (the OpenWrt REST API is the
  actual surface; canned fixture responses for offline / online /
  degraded / LTE-missing events are documented in §11 as the
  promotion path). The audit catches true vendor leaks via the
  forbidden_substrings list in
  `connections/openwrt-controls/tests/test_connection_yml.py`
  (`test_dashboard_tiles_follow_rc_naming`).

  The recipe covers the FIVE-step operator flow (Confirm OpenWrt API
  access + Load the two RoamCore-owned packages + Verify the
  `rc_openwrt_*` REST sensors populate + Configure preferred WAN +
  Wire the §8 mandatory automations) + the FOUR §8 MANDATORY
  automations (prefer-WAN selector drives the correct script + LTE-
  SIM-missing alert + firewall-state alert + restart-network confirm
  guard) + the 27 `rc_openwrt_*` + `rc_net_openwrt_*` contract tiles
  + the 4 `script.rc_openwrt_*` control scripts + the 5 safety tiles
  + the 5 §9 troubleshooting entries (API token not accepted / LuCI
  ubus-rpc not exposed / rest_command fails with 401 /
  `rc_openwrt_router_*` sensors stuck unknown / preferred-WAN
  selector does nothing) + the §10 privacy section (no RoamCore-side
  telemetry; operator-owned HA logbook; OpenWrt API token is operator-
  supplied) + the §11 tier-a promotion outline (real `config_flow.py`
  wrapping the upstream LuCI ubus-rpc integration + canned fixture
  responses for offline / online / degraded / LTE-missing events on
  CI bench + integration tests asserting the preferred-WAN selector
  calls the correct `script.rc_openwrt_prefer_*` + restart-network
  BLOCKS without confirm-flag) + the §12 bench-fixture gap
  acknowledgment + the §13 links.

  The TIER-A strategy is intentional: the two RoamCore-owned packages
  ARE the canonical implementation (real code, real REST sensors, real
  `rest_command.*` invocations, real `script.*` WAN preference
  drivers, all RoamCore-owned + RoamCore-maintained). The tier-a-but-
  flagged honesty is that there are no pytest integration tests
  against a controlled bench — the OpenWrt REST API is the actual
  surface; the bench fixture gap is documented in §12 of the recipe.

