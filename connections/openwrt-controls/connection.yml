wizard:
  connection_kind: recipe
  one_tap: false
  auto_discover: false
  estimated_time: "~20 min"
  requires_reboot: false
  setup_notes: |
    OpenWrt controls requires the operator to (a) confirm OpenWrt
    API access (the operator fills `input_text.rc_openwrt_api_url`
    + `input_text.rc_openwrt_api_token` with the LuCI ubus-rpc token
    from the OpenWrt VM at 192.168.1.250 — per TOOLS.md), (b) load
    the two RoamCore-owned packages via the standard HA `packages:`
    mechanism (both packages are ALREADY on main — add
    `homeassistant/packages/roamcore_openwrt_api.yaml` +
    `homeassistant/packages/roamcore_net.yaml` to the operator's
    `configuration.yaml:` `packages:` list), (c) verify the
    `rc_openwrt_*` REST sensors populate (check the Developer Tools
    → States panel for the 15 `rc_openwrt_*` + 12 `rc_net_openwrt_*`
    entities — they should populate within 30 seconds of HA start
    once the package is loaded), (d) configure preferred WAN (set
    `select.rc_openwrt_preferred_wan` to Starlink / LTE / Auto via
    the dashboard Settings → OpenWrt → Preferred WAN selector), (e)
    wire the FOUR §8 MANDATORY automations (prefer-WAN selector
    drives the correct script + LTE-SIM-missing alert + firewall-
    state alert + restart-network confirm guard), and (f) follow the
    FIVE-step operator flow documented in docs/recipe.md §5.

install:
  ha_integration_domain: rest
  config_flow: true            # UPSTREAM truth (HA core `rest:` integration + `command_line:` integration + `select:` integration all expose a GUI flow since 2018.x); NOT a RoamCore-owned config_flow
  hacs: false                  # tier-a recipe: no HACS integration of our own (the upstream packages are loaded via the standard HA `packages:` mechanism)
  doc_recipe_only: true        # the recipe in docs/recipe.md IS the install
  python_requirements: []
  min_ha_version: "2022.6"
  packages:
    - homeassistant/packages/roamcore_openwrt_api.yaml
    - homeassistant/packages/roamcore_net.yaml
  side_effects:
    - adds_dashboard_card               # installs the 27 rc_openwrt_* + rc_net_openwrt_* contract tiles
    - configures_wan_preference_helper  # §5 step 4 — `select.rc_openwrt_preferred_wan` + the 4 `script.rc_openwrt_prefer_*` drivers
    - configures_restart_confirm_helper # §5 step 5 — `input_boolean.rc_openwrt_confirm_restart` for the §8.4 confirm guard

