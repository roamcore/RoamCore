wizard:
  connection_kind: recipe
  one_tap: false
  auto_discover: false
  estimated_time: "~45 min"
  requires_reboot: false
  setup_notes: |
    Remote access requires the operator to (a) have an always-
    on HA instance reachable from the operator's home network,
    (b) pick ONE of the four remote-access paths (Path A
    Tailscale + Path B Cloudflare Tunnel + Path C Nabu Casa
    HA Cloud + Path D Wireguard), (c) set up the chosen path
    (Path A — install the HA core `tailscale` integration OR
    the HACS Tailscale add-on + login to Tailscale + enable
    MagicDNS + add the operator's devices to the tailnet; Path
    B — create a Cloudflare account + add the operator's
    domain to Cloudflare + create a Cloudflare Tunnel pointing
    at the HA server's local URL + install the `cloudflared`
    daemon on the HA server via the HACS `cloudflared` add-on;
    Path C — subscribe to Nabu Casa HA Cloud via the HA Cloud
    panel + enable remote access + verify the Nabu Casa remote
    URL; Path D — install the HACS `wireguard` add-on OR a
    manual Wireguard install + generate server keys + generate
    per-client keys + configure the Wireguard server interface
    + add the operator's devices as Wireguard peers + configure
    firewall rules), (d) configure the operator's account on
    the chosen vendor's service (Tailscale account for Path A +
    Cloudflare account for Path B + Nabu Casa subscription for
    Path C + nothing extra for Path D — the operator owns the
    Wireguard keys), (e) configure the HA server's firewall to
    permit the chosen path's port range (UDP 41641 for Path A
    Tailscale + outbound HTTPS 7844 for Path B Cloudflare
    Tunnel + outbound HTTPS for Path C Nabu Casa + UDP 51820
    for Path D Wireguard), (f) install the HA Companion app
    for the OFF-LAN affordance (the HA Companion app's
    `external_url` setting points the phone at the chosen
    remote-access URL when the operator is OFF-LAN), (g)
    configure the operator's DNS provider account if Path B
    Cloudflare Tunnel is chosen (Cloudflare-managed domain +
    Cloudflare DNS), (h) configure the
    `binary_sensor.rc_remote_access_enabled` kill-switch tile,
    (i) configure the `select.rc_remote_access_path` tile to
    the chosen path. RoamCore does NOT maintain a custom
    remote-access integration; HA's core `tailscale` integration
    handles the Tailscale tailnet device status; the HACS
    `cloudflared` add-on handles the Cloudflare Tunnel; the HA
    Core `cloud` integration handles the Nabu Casa remote URL;
    the HACS `wireguard` add-on handles the Wireguard server;
    the HA Companion app's `external_url` setting handles the
    OFF-LAN affordance.

  # Phase 6 — the wizard is the four-paths picker the operator sees.
  # Path A is wired up (full implementation this slice); Path B / C / D
  # are stubs that route to a "coming soon" stage until the follow-up
  # slices (#122.b / #122.c) ship. Every path is honest about being a
  # tier-b recipe over the upstream HA core `tailscale` integration
  # (Path A) / HACS `cloudflared` add-on (Path B) / HA Core `cloud`
  # integration (Path C) / HACS `wireguard` add-on (Path D); RoamCore
  # does NOT promote any of these to tier-a.
  setup_paths:
    - id: tailscale
      label: "Tailscale (recommended)"
      connection_kind: recipe
      tier: b
      recipe_over: "HA core `tailscale` integration (since 2022.x) + HACS Tailscale add-on"
      estimated_time: "~15 min"
      requires_reboot: false
      requires_inputs:
        - "Tailscale account"
        - "Tailscale auth key"
        - "Tailscale tailnet hostname"
      side_effects:
        - registers_wizard_helpers_input_selects
        - registers_wizard_helpers_input_texts
        - registers_wizard_template_binary_sensors
        - registers_wizard_template_sensor_status
        - registers_wizard_advance_automation
        - registers_wizard_recovery_automation
        - registers_wizard_detect_existing_automation
        - registers_wizard_path_pick_routing_automation
        - advances_setup_wizard_stage_to_map_on_completion
      setup_notes: |
        Pick this to set up Tailscale on your van right now — the wizard
        walks you through it.

    - id: cloudflare
      label: "Cloudflare Tunnel (coming soon)"
      connection_kind: recipe
      tier: b
      recipe_over: "HACS `cloudflared` add-on + Cloudflare-managed domain"
      estimated_time: "~30 min"
      requires_reboot: false
      requires_inputs:
        - "Cloudflare account"
        - "Cloudflare-managed domain"
        - "Cloudflare Tunnel DNS hostname"
      side_effects:
        - registers_wizard_helpers_input_selects
        - registers_wizard_helpers_input_texts
        - routes_to_cloudflare_stub_stage
      setup_notes: |
        Coming soon — Path A is wired now.

    - id: nabu_casa
      label: "Nabu Casa HA Cloud (coming soon)"
      connection_kind: recipe
      tier: b
      recipe_over: "HA Core `cloud` integration (since 2022.x) + Nabu Casa subscription"
      estimated_time: "~10 min"
      requires_reboot: false
      requires_inputs:
        - "Nabu Casa HA Cloud subscription"
        - "Nabu Casa account login"
      side_effects:
        - registers_wizard_helpers_input_selects
        - registers_wizard_helpers_input_texts
        - routes_to_nabu_casa_stub_stage
      setup_notes: |
        Coming soon — Path A is wired now.

    - id: wireguard
      label: "Wireguard (self-hosted VPN)"
      connection_kind: recipe
      tier: b
      recipe_over: "HACS `wireguard` add-on + manual per-client key management"
      estimated_time: "~45 min"
      requires_reboot: false
      requires_inputs:
        - "Wireguard server endpoint (public hostname or IP)"
        - "Wireguard server public key"
        - "Wireguard peer (client) private key"
        - "Wireguard peer allowed IPs (e.g. 10.0.0.2/32)"
      side_effects:
        - registers_wizard_helpers_input_selects
        - registers_wizard_helpers_input_texts
        - registers_wizard_template_binary_sensors
        - registers_wizard_template_sensor_status
        - registers_wizard_advance_automation
        - registers_wizard_recovery_automation
        - registers_wizard_detect_existing_automation
        - registers_wizard_path_pick_routing_automation
        - advances_setup_wizard_stage_to_map_on_completion
      setup_notes: |
        Pick this if you already run your own Wireguard VPN — the wizard
        walks you through it in four plain-English taps.

    - id: skip
      label: "Skip remote access"
      connection_kind: skip
      tier: b
      recipe_over: "no remote access — reachable only on home Wi-Fi"
      estimated_time: "~0 min"
      requires_reboot: false
      requires_inputs: []
      side_effects:
        - routes_to_done_stage_with_skip_notification
      setup_notes: |
        Skip remote access entirely — your van stays reachable only on home Wi-Fi.

