wizard:
  connection_kind: recipe
  one_tap: false
  auto_discover: false
  estimated_time: "~45 min"
  requires_reboot: false
  setup_notes: |
    Leveling requires the operator to (a) pick ONE of the
    FOUR paths (Path A phone IMU + Path B permanent IMU
    board with four sub-flavors ESPHome MPU-6050 / ESPHome
    MPU-9250 / ESPHome BNO055 / ESPHome LSM6DS3 + Path C
    levelling jacks with three sub-flavors HWH / Lippert /
    Power Gear / Bigfoot + Path D Bluetooth pads with
    three sub-flavors Mopeka / Lippert / TireMinder), (b)
    set up the chosen path's upstream integration (Path A —
    install the HA Companion app on the operator's phone +
    enable the IMU sensor permission; Path B — flash the
    ESPHome firmware to the ESP32 / ESP8266 + the ESPHome
    integration auto-discovers the IMU board; Path C —
    wire the 8-channel / 12-channel / 16-channel relay
    board + the HA core `template:` switch wrapper; Path D
    — install the HACS `mopeka` / `bno055` / `esp32_imu`
    integration OR the vendor app), (c) verify the upstream
    `sensor.*` entities exist (Path A — `sensor.<phone>_
    accelerometer` + `sensor.<phone>_gyroscope` +
    `sensor.<phone>_orientation`; Path B —
    `sensor.<board>_mpu6050_accel_x` etc. OR
    `sensor.<board>_bno055_orientation_x` etc.; Path D —
    `sensor.<pad>_pitch` + `sensor.<pad>_roll`), (d)
    configure the operator-facing `sensor.rc_level_pitch_
    degrees` + `sensor.rc_level_roll_degrees` +
    `sensor.rc_level_max_tilt_degrees` +
    `binary_sensor.rc_level_is_level` +
    `binary_sensor.rc_level_is_close_to_level` contract
    tiles to point at the operator's chosen upstream
    `sensor.*` entities, (e) configure `select.rc_level_
    mode` to the operator's chosen starting mode (default
    `read_only`), (f) wire the FIVE §8 MANDATORY automations
    (auto-warn when out of level + sleep-mode warning +
    fridge safety gate + auto-jack extend (Path C only) +
    calibration reminder), (g) press `button.rc_level_
    calibrate_now` once to seed the calibration offset
    (REQUIRED before first use — the fridge-safe tile
    depends on a calibrated zero). RoamCore does NOT maintain
    a custom levelling integration; the HA core `sensor`
    integration + the HA core `template:` sensor wrapper
    + the HA Companion app + the ESPHome components + the
    HACS `mopeka` / `bno055` / `esp32_imu` integrations +
    the upstream pneumatic / hydraulic levelling jack
    relay wiring handle 95%+ of operator-facing levelling
    operators.

