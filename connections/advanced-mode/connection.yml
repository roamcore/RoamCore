wizard:
  connection_kind: recipe
  one_tap: false
  auto_discover: false
  estimated_time: "~15 min"
  requires_reboot: false
  setup_notes: |
    Advanced mode requires the operator to (a) install the
    upstream HA core `input_boolean` + `input_text` +
    `input_datetime` + `input_button` + `select` helpers (HA
    core since 2022.x — these are auto-installed in every HA
    install + exposed via the HA UI under Settings → Helpers),
    (b) configure the operator-facing
    `input_boolean.rc_advanced_mode_confirmed` +
    `input_boolean.rc_advanced_mode_enabled` +
    `input_datetime.rc_advanced_mode_session_expires_at` +
    `sensor.rc_advanced_mode_seconds_until_expiry` +
    `sensor.rc_advanced_mode_session_action_count` +
    `sensor.rc_advanced_mode_last_action_at` +
    `binary_sensor.rc_advanced_mode_is_active` +
    `binary_sensor.rc_advanced_mode_is_blocking_destructive_calls`
    + `select.rc_advanced_mode_session_duration` +
    `button.rc_advanced_mode_enable` +
    `button.rc_advanced_mode_disable_now` contract tiles to
    point at the upstream entities + populate
    `input_text.rc_advanced_mode_destructive_call_targets`
    with the comma-separated list of destructive irreversible
    service names the §8.5 destructive-calls block should
    protect (e.g. `switch.turn_off, climate.turn_off,
    script.rc_factory_reset`), (c) wire the FIVE §8 MANDATORY
    automations (confirm-before-toggle-on guard + auto-disable
    after session timeout + hides-for-non-owners guard +
    audit-log entry + blocks-destructive-irreversible-service-
    calls guard), (d) follow the FOUR-step operator flow —
    Step 1 flip the confirm-flag ON; Step 2 flip the master
    enable toggle ON (or press the `button.rc_advanced_mode_
    enable` button); Step 3 watch the session_expires_at
    countdown; Step 4 audit destructive calls + press
    `button.rc_advanced_mode_disable_now` to revert. RoamCore
    does NOT maintain a custom advanced-mode engine; the HA
    core `input_boolean` + `input_text` + `input_datetime` +
    `input_button` + `select` helpers + the HA core
    `template:` sensor + `template:` binary_sensor wrappers
    handle 95%+ of operator-facing advanced-mode operations.

