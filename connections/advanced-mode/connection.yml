# Advanced mode — vendor-neutral power-user toggle + session-timeout guard + destructive-calls block — tier-b recipe connection.
#
# Promoted from a legacy spec (legacy tier-a
# claim stub, 13 lines — "RoamCore includes an Advanced Mode
# toggle that can reveal extra controls and diagnostics without
# cluttering the default UI. Keeps the dashboard clean for daily
# use. Still gives power users access to deeper controls when
# needed. None. HA package:
# homeassistant/packages/roamcore_advanced_mode.yaml" with no
# recipe + no contract + no automations + no install path). The
# legacy stub's tier-a claim is honest-upstream-truth: RoamCore
# ships NO native advanced-mode engine (no
# `custom_components/roamcore_advanced_mode/` directory in the
# repo today). The picker promotes the legacy stub into tier-b
# because the contract layer is the canonical RoamCore
# contribution (the 11 `rc_advanced_mode_*` tiles + the recipe
# + the FIVE §8 MANDATORY automations) while the upstream engines
# are HA core `input_boolean` + `input_text` + `input_datetime`
# helpers (since 2022.x) + the HA core `input_button` helper
# (since 2022.x) + the HA core `select` helper (since 2024.x) +
# the HA core `template:` sensor wrapper (since 2022.x) + the HA
# core `template:` binary_sensor wrapper (since 2022.x). The
# legacy doc now carries a SUPERSEDED banner pointing at this
# connection.

# The recipe walks the operator through the FOUR-step operator
# flow:
#   - Step 1 — Confirm — the operator explicitly confirms
#     "I understand advanced mode exposes destructive irreversible
#     service calls" by flipping
#     `input_boolean.rc_advanced_mode_confirmed` helper ON (default
#     OFF). Without this confirm, advanced controls stay hidden
#     even if the master toggle is ON.
#   - Step 2 — Enable — the operator flips
#     `input_boolean.rc_advanced_mode_enabled` ON. The dashboard
#     now shows the "advanced" badge + reveals the hidden
#     diagnostics tiles + unlocks the operator-only controls.
#   - Step 3 — Session window — once enabled, advanced mode
#     stays ON until either the operator disables it OR the
#     `input_datetime.rc_advanced_mode_session_expires_at`
#     timestamp is reached (default: 24 hours from when the
#     toggle was flipped ON, controlled by the
#     `select.rc_advanced_mode_session_duration` selector 1 hour
#     / 6 hours / 24 hours / 7 days / Never). After timeout, the
#     toggle auto-reverts to OFF.
#   - Step 4 — Audit + revert — every advanced-mode toggle flip
#     + every destructive irreversible service call that the
#     operator initiates while advanced mode is ON is logged to
#     `sensor.rc_advanced_mode_last_action_at` + counted in
#     `sensor.rc_advanced_mode_session_action_count`. The operator
#     can revert at any time via `button.rc_advanced_mode_disable_now`.

# The 11 `rc_advanced_mode_*` contract tiles are vendor-neutral
# — no vendor names leak into the tile ids (no `victron` /
# `see level` / `seelevel` / `garnet` / `mopeka` / `renogy` /
# `starlink` / `peplink` / `teltonika` / `unifi` / `ubiquiti` /
# `mqtt` / `webhook` / `rest` / `api` / `http` / `https` /
# `input_boolean` / `input_text` / `input_datetime` /
# `input_button` / `select` / `template` / `gps` /
# `accelerometer` / `phone` / `companion` / `ha` /
# `homeassistant` / `hacs` / `zigbee` / `zwave` / `zha` /
# `deconz` / `tasmota` / `esp32` / `esp8266` / `shelly` /
# `sonoff` / `wifi` / `wi-fi` / `ble` / `bluetooth` / `iphone` /
# `ios` / `android` / `samsung` / `pixel` / `xiaomi` / `huawei`
# vendor / hardware / protocol / integration names leak into
# the tile ids). The legitimate generic nouns `advanced`,
# `mode`, `session`, `enable`, `disable`, `confirm`, `action`,
# `count`, `timestamp`, `duration`, `destructive`,
# `irreversible`, `expiry`, `expire`, `audit`, `revert`,
# `toggle` are allowed (they describe what the tile is for, not
# which vendor). The contract surface is:
#   - `input_boolean.rc_advanced_mode_confirmed` — the
#     confirm-flag — operator must flip this ON to acknowledge
#     that advanced mode exposes destructive irreversible
#     service calls; default OFF; surfaces as a yellow
#     "confirm advanced mode" chip in the dashboard until
#     flipped ON.
#   - `input_boolean.rc_advanced_mode_enabled` — master enable
#     toggle — OFF by default; must be operator-confirmed ON
#     before advanced controls surface in the dashboard;
#     surfaces as a green "advanced mode active" chip when ON.
#   - `input_datetime.rc_advanced_mode_session_expires_at` —
#     the timestamp at which advanced mode auto-reverts to OFF;
#     set to "now + selected duration" when the toggle is
#     flipped ON; surfaces as "expires in 23h 14m" in the
#     dashboard.
#   - `sensor.rc_advanced_mode_seconds_until_expiry` — the
#     resolved seconds-until-auto-revert; surfaces as a
#     countdown timer in the dashboard.
#   - `sensor.rc_advanced_mode_session_action_count` — the
#     number of destructive irreversible service calls the
#     operator has initiated while advanced mode is ON in the
#     current session; surfaces as "12 destructive calls this
#     session" in the dashboard; resets to 0 when the session
#     expires or is manually disabled.
#   - `sensor.rc_advanced_mode_last_action_at` — the timestamp
#     of the last destructive irreversible service call the
#     operator initiated while advanced mode is ON; surfaces as
#     "last: 14m ago" in the dashboard.
#   - `binary_sensor.rc_advanced_mode_is_active` — true when
#     advanced mode is ON AND the confirm-flag is ON AND the
#     session has not expired; surfaces in the dashboard as a
#     green "active" chip + reveals the hidden controls; turns
#     red if any of those three conditions fail.
#   - `binary_sensor.rc_advanced_mode_is_blocking_destructive_calls`
#     — true when advanced mode would block destructive
#     irreversible service calls — should ALWAYS be true when
#     the toggle is OFF; surfaces in the dashboard as a green
#     "destructive blocked" chip; turns red if a
#     misconfiguration would let a destructive service call
#     slip through while advanced mode is OFF.
#   - `select.rc_advanced_mode_session_duration` — the
#     operator-pickable session duration for auto-revert: 1
#     hour / 6 hours / 24 hours / 7 days / Never; default 24
#     hours; surfaced as a select picker in the dashboard.
#   - `button.rc_advanced_mode_enable` — operator-triggered:
#     one-tap enable advanced mode — equivalent to flipping
#     the master toggle ON, sets session_expires_at to "now +
#     selected duration", and surfaces a confirm-modal if the
#     confirm-flag is OFF.
#   - `button.rc_advanced_mode_disable_now` — operator-
#     triggered: one-tap disable advanced mode NOW — flips the
#     master toggle OFF, clears the session_expires_at, and
#     surfaces a "advanced mode disabled" toast.

# The umbrella publishes the resulting data via the upstream HA
# core `input_boolean` + `input_text` + `input_datetime` +
# `input_button` helper entities (since 2022.x — expose the
# standard `input_boolean.toggle` + `input_text.set_value` +
# `input_datetime.set_datetime` + `input_button.press` services
# + the `input_boolean` / `select` / `sensor` / `binary_sensor`
# / `button` domain entities) + the HA core `template:` sensor
# wrapper (since 2022.x — wraps any upstream sensor state into
# a derived `sensor.*` entity) + the HA core `template:`
# binary_sensor wrapper (since 2022.x — wraps any upstream
# sensor threshold into a derived `binary_sensor.*` entity),
# then publishes the RoamCore advanced-mode contract tiles on
# top (the 11 contract entities documented in connection.yml —
# 1 input_boolean advanced_mode_confirmed + 1 input_boolean
# advanced_mode_enabled + 1 input_datetime
# advanced_mode_session_expires_at + 1 sensor
# advanced_mode_seconds_until_expiry + 1 sensor
# advanced_mode_session_action_count + 1 sensor
# advanced_mode_last_action_at + 1 binary_sensor
# advanced_mode_is_active + 1 binary_sensor
# advanced_mode_is_blocking_destructive_calls + 1 select
# advanced_mode_session_duration + 1 button
# advanced_mode_enable + 1 button advanced_mode_disable_now =
# 11 contract entities).

# The audit + boundary CI can detect an `advanced-mode/` folder
# that claims to be a connection via the `DOMAIN` constant
# exported in __init__.py. The wizard reads the manifest +
# recipe at runtime.

# The real per-operator advanced-mode affordance path is:
#     Operator-side choice of the FOUR-step flow (Confirm ->
#       Enable -> Session window -> Audit + revert) -> upstream
#         entities (the HA core `input_boolean.rc_advanced_mode_
#         confirmed` for the confirm-flag; the HA core
#         `input_boolean.rc_advanced_mode_enabled` for the
#         master enable; the HA core `input_datetime.rc_advanced_
#         mode_session_expires_at` for the session expiry
#         timestamp; the HA core `sensor.rc_advanced_mode_
#         seconds_until_expiry` `template:` sensor for the
#         resolved countdown; the HA core `sensor.rc_advanced_
#         mode_session_action_count` `template:` sensor for the
#         destructive-call counter; the HA core `sensor.rc_
#         advanced_mode_last_action_at` `template:` sensor for
#         the last destructive-call timestamp; the HA core
#         `binary_sensor.rc_advanced_mode_is_active` `template:`
#         binary_sensor for the resolved active chip; the HA core
#         `binary_sensor.rc_advanced_mode_is_blocking_destructive_
#         calls` `template:` binary_sensor for the safety chip;
#         the HA core `select.rc_advanced_mode_session_duration`
#         for the auto-revert duration picker; the HA core
#         `button.rc_advanced_mode_enable` + `button.rc_advanced_
#         mode_disable_now` for the operator-triggered one-tap
#         enable / disable affordances)
#         -> upstream signals (the operator's chosen destructive
#            irreversible service call targets — the operator
#            populates `input_text.rc_advanced_mode_destructive_
#            call_targets` with the comma-separated list of
#            service names the §8.5 destructive-calls block
#            should protect)
#         -> RoamCore contract layer (HA core `template:` sensor
#            + binary_sensor + select + the operator's
#            `input_boolean` / `input_text` / `input_datetime` /
#            `input_button` for the contract tiles + the
#            `command_line` integration for any upstream
#            reachability probe)
#         -> dashboard tiles + OpenClaw queries
#             ("is advanced mode active?",
#              "is advanced mode blocking destructive calls?",
#              "how many destructive calls this session?",
#              "when was the last destructive call?",
#              "when does advanced mode expire?",
#              "enable advanced mode",
#              "disable advanced mode now")

#     Safety interlocks (the recipe is the contract layer; the
#     automation wrappers are documented in §8):
#         -> The RoamCore confirm-before-toggle-on guard is the
#            §8.1 automation that fires when a non-operator
#            source tries to flip
#            `input_boolean.rc_advanced_mode_enabled` ON without
#            first flipping `input_boolean.rc_advanced_mode_
#            confirmed` ON. The automation BLOCKS the enable
#            flip + writes an audit-log entry + fires a
#            notification warning the operator that the
#            confirm-flag must be flipped ON first.
#         -> The RoamCore auto-disable after session timeout
#            guard is the §8.2 automation that fires when
#            `input_datetime.rc_advanced_mode_session_expires_at`
#            timestamp is reached. The automation clears the
#            enable toggle + clears the session_expires_at +
#            writes an audit-log entry + fires a notification
#            warning the operator that advanced mode has been
#            auto-disabled.
#         -> The RoamCore hides-for-non-owners guard is the §8.3
#            automation that fires when a non-owner dashboard
#            session attempts to view the advanced-mode dashboard
#            page while `input_boolean.rc_advanced_mode_enabled`
#            is ON. The automation hides the advanced-mode tiles
#            + surfaces an "advanced mode hidden for non-owners"
#            banner + writes an audit-log entry.
#         -> The RoamCore audit-log-entry guard is the §8.4
#            automation that fires on every destructive
#            irreversible service call the operator initiates
#            while `input_boolean.rc_advanced_mode_enabled` is
#            ON. The automation writes an audit-log entry with
#            the service name + the target entity + the operator
#            identity (if the remote-access session tracks it) +
#            the timestamp + the reason.
#         -> The RoamCore blocks-destructive-irreversible-service-
#            calls guard is the §8.5 automation that fires when
#            ANY `script.*` / `automation.*` action tries to call
#            a destructive irreversible service (the operator has
#            flagged in `input_text.rc_advanced_mode_destructive_
#            call_targets`) while `input_boolean.rc_advanced_mode_
#            enabled` is OFF. The automation BLOCKS the service
#            call + logs a security-style audit entry + flips
#            `binary_sensor.rc_advanced_mode_is_blocking_
#            destructive_calls` to FALSE + fires a critical
#            notification.

#     Cross-references:
#         -> The HA core `input_boolean` + `input_text` +
#            `input_datetime` + `input_button` + `select` helper
#            entities are the canonical umbrella (since 2022.x —
#            expose the standard contract).
#         -> The HA core `template:` sensor wrapper is the
#            canonical seconds-until-expiry + session-action-count
#            + last-action-at derivation (since 2022.x).
#         -> The HA core `template:` binary_sensor wrapper is the
#            canonical is-active + is-blocking-destructive-calls
#            derivation (since 2022.x).
#         -> The time-atomic Wave 3 #55 connection cross-
#            references the time-of-day primitives used by the
#            §8.2 auto-disable-after-session-timeout guard's
#            expiry timestamp.
#         -> The remote-access Wave 3 #58 connection cross-
#            references the VPN primitive used by the §8.3
#            hides-for-non-owners guard's owner-identity check.
#         -> The mode Wave 3 #61 connection cross-references the
#            §8.4 audit-log entry's mode-change cross-reference
#            (the guard surfaces advanced-mode transitions on
#            the mode-change notification timeline).
#         -> The demo-mode Wave 3 #62 connection cross-
#            references the §8.1 confirm-before-toggle-on guard's
#            confirm-flag pattern (mirrors the demo-mode §8.5
#            operator-only guard's confirm-flag pattern).

# See docs/recipe.md for the full howto (HA core `input_boolean`
# + `input_text` + `input_datetime` + `input_button` + `select`
# helper install + HA core `template:` sensor wrapper install +
# HA core `template:` binary_sensor wrapper install + the FOUR-
# step operator-pickable advanced-mode flow + the 11
# `rc_advanced_mode_*` contract tiles + the FIVE §8 MANDATORY
# automations + the 6 §9 troubleshooting entries + privacy +
# tier-a promotion outline).

# Honesty footnote (install.config_flow = true is NOT a tier-a
# marker): The UPSTREAM HA core `input_boolean` + `input_text`
# + `input_datetime` + `input_button` + `select` helpers (since
# 2022.x — expose a GUI flow for the operator to add the helper
# entities from the HA UI under Settings → Helpers) + the HA
# core `template:` sensor wrapper (since 2022.x — expose a GUI
# flow for the operator to add a derived entity from the
# upstream sensors) + the HA core `template:` binary_sensor
# wrapper (since 2022.x — expose a GUI flow for the operator
# to add a derived binary_sensor from the upstream sensors)
# ALL expose a GUI flow. That's honest upstream truth, NOT a
# tier-a marker for RoamCore's tier. The tier-a marker for
# RoamCore would be a RoamCore-owned operator-wired setup flow
# + RoamCore-owned integration code + integration tests against
# a RoamCore-owned advanced-mode engine bench (a controlled
# environment with canned fixture responses for session-expired
# events + canned fixture responses for destructive-service-call
# blocking events + canned fixture responses for non-owner
# dashboard session events). None of those are shipped at
# tier-b. Tier-b honesty: HA core `input_boolean` + `input_text`
# + `input_datetime` + `input_button` + `select` + HA core
# `template:` are all upstream / vendor / HACS code; the
# RoamCore wrapper is a thin upstream-entity-aggregation layer
# + the contract layer + the FIVE §8 MANDATORY automations.

id: advanced_mode
name: "Advanced mode — vendor-neutral power-user toggle + session-timeout guard + destructive-calls block — tier-b recipe connection"
tier: b
category: ai
status: beta
version: 0.1.0
description: |
  Advanced mode — vendor-neutral power-user toggle + session-
  timeout guard + destructive-calls block — the umbrella for
  "RoamCore includes an Advanced Mode toggle that can reveal
  extra controls and diagnostics without cluttering the default
  UI. Keeps the dashboard clean for daily use. Still gives
  power users access to deeper controls when needed" — is the
  ai-category complement to the broader RoamCore "show me
  everything" affordances. The single "confirmed" toggle is the
  operator's confirm-flag (operator must flip ON before the
  master enable toggle will surface the hidden controls; the
  confirm-flag is a "I understand advanced mode exposes
  destructive irreversible service calls" acknowledgement);
  the master "enabled" toggle is the operator's master enable
  (OFF by default; must be operator-confirmed ON before
  advanced controls surface in the dashboard); the "session
  expires at" timestamp is the auto-revert deadline (set to
  "now + selected duration" when the toggle is flipped ON;
  default 24 hours; surfaces as "expires in 23h 14m" in the
  dashboard); the "seconds until expiry" tile is the resolved
  countdown timer; the "session action count" tile is the
  number of destructive irreversible service calls the
  operator has initiated while advanced mode is ON in the
  current session (surfaces as "12 destructive calls this
  session" in the dashboard; resets to 0 when the session
  expires or is manually disabled); the "last action at" tile
  is the timestamp of the last destructive irreversible service
  call the operator initiated while advanced mode is ON
  (surfaces as "last: 14m ago" in the dashboard); the "is
  active" binary_sensor is the resolved active chip (true when
  advanced mode is ON AND the confirm-flag is ON AND the
  session has not expired; turns red if any of those three
  conditions fail); the "is blocking destructive calls"
  binary_sensor is the safety chip (should ALWAYS be true when
  the toggle is OFF; turns red if a misconfiguration would let
  a destructive service call slip through while advanced mode
  is OFF); the "session duration" select is the operator-
  pickable auto-revert duration (1 hour / 6 hours / 24 hours /
  7 days / Never; default 24 hours); the "enable" button is
  the operator-triggered one-tap enable (flips the master
  toggle ON + sets session_expires_at to "now + selected
  duration" + surfaces a confirm-modal if the confirm-flag is
  OFF); the "disable now" button is the operator-triggered
  one-tap disable (flips the master toggle OFF + clears the
  session_expires_at + surfaces a "advanced mode disabled"
  toast).

  RoamCore does NOT ship a native advanced-mode engine; we
  RECIPE the well-understood upstream HA core `input_boolean`
  + `input_text` + `input_datetime` + `input_button` + `select`
  helper entities (since 2022.x — expose a GUI flow for the
  operator to add the helper entities from the HA UI under
  Settings → Helpers) + the HA core `template:` sensor wrapper
  (since 2022.x — expose a GUI flow for the operator to add a
  derived `sensor.*` entity from the upstream sensors) + the
  HA core `template:` binary_sensor wrapper (since 2022.x —
  expose a GUI flow for the operator to add a derived
  `binary_sensor.*` entity from the upstream sensors). The
  umbrella publishes the 11 `rc_advanced_mode_*` contract tiles
  documented below (vendor-neutral — no Victron / SeeLevel /
  Garnet / Mopeka / Renogy / Starlink / Peplink / Teltonika /
  Unifi / Ubiquiti / MQTT / webhook / REST / API / HTTP / HTTPS
  / Companion / ESPHome / phone / GPS / accelerometer / iPhone
  / iOS / Android / Samsung / Pixel / OnePlus / Xiaomi /
  Huawei / input_boolean / input_text / input_datetime /
  input_button / select / template / Z-Wave / Zigbee / ZHA /
  Deconz / Tasmota / Shelly / Sonoff / ESP32 / ESP8266 / Wi-Fi
  / BLE / Bluetooth names leak into the tile ids). RoamCore
  does NOT fork any of the upstream helpers; the contract layer
  is a thin upstream-entity-aggregation wrapper + the vendor-
  neutral tile surface + the FIVE §8 MANDATORY automations.

  The recipe covers the FOUR-step operator flow (Confirm +
  Enable + Session window + Audit + revert) + the FIVE §8
  MANDATORY automations (confirm-before-toggle-on guard +
  auto-disable after session timeout + hides-for-non-owners
  guard + audit-log entry + blocks-destructive-irreversible-
  service-calls guard) + the 11 `rc_advanced_mode_*` contract
  tiles + the §9 troubleshooting entries (6 entries) + the
  §10 privacy section (no RoamCore-side telemetry; the
  upstream helper entities' logs are operator-owned via the HA
  core logbook; advanced-mode values are clearly labelled as
  advanced + never reach the operator's default automations) +
  the §11 tier-a promotion outline (real advanced-mode engine +
  canned fixture responses for session-expired events on CI
  bench + canned fixture responses for destructive-service-call
  blocking events + canned fixture responses for non-owner
  dashboard session events + RoamCore-owned operator-wired
  setup flow walking the operator through Confirm + Enable +
  Session window + Audit + declare the upstream destructive
  irreversible service call targets + the §8 automations +
  integration tests asserting a session-expired event auto-
  disables advanced mode + a destructive-service-call attempt
  on a flagged target triggers the blocks-destructive-
  irreversible-service-calls guard + a non-owner dashboard
  session triggers the hides-for-non-owners guard) + the §12
  cross-references (the time-atomic Wave 3 #55 connection for
  the time-of-day primitives used by the §8.2 auto-disable-
  after-session-timeout guard's expiry timestamp + the remote-
  access Wave 3 #58 connection for the VPN primitive used by
  the §8.3 hides-for-non-owners guard's owner-identity check +
  the mode Wave 3 #61 connection for the §8.4 audit-log
  entry's mode-change cross-reference + the demo-mode Wave 3
  #62 connection for the §8.1 confirm-before-toggle-on
  guard's confirm-flag pattern + the leveling Wave 3 #60
  connection for the §8.5 blocks-destructive-irreversible-
  service-calls guard's levelling-jack protection cross-
  reference + the fans Wave 3 #59 connection for the §8.5
  blocks-destructive-irreversible-service-calls guard's
  fan-protection cross-reference).

  The REUSE-FIRST strategy is intentional: HA's core
  `input_boolean` + `input_text` + `input_datetime` +
  `input_button` + `select` helper entities (since 2022.x)
  handle the upstream advanced-mode state storage (95%+ of
  operator-facing advanced-mode operations); the HA core
  `template:` sensor wrapper (since 2022.x) derives the
  seconds-until-expiry + session-action-count + last-action-at
  tiles from the upstream state; the HA core `template:`
  binary_sensor wrapper (since 2022.x) derives the is-active +
  is-blocking-destructive-calls tiles from the upstream state.
  All upstream helpers + integrations are upstream / vendor /
  HACS code; the RoamCore wrapper is a thin upstream-entity-
  aggregation layer + the contract layer + the FIVE §8
  MANDATORY automations.
