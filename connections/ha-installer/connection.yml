wizard:
  connection_kind: shell_installer
  one_tap: false
  auto_discover: false
  estimated_time: "~5 min"
  requires_reboot: true
  setup_notes: |
    HA installer requires the operator to (a) be on a
    HAOS host with the Terminal & SSH add-on enabled,
    (b) SSH into the HA host, (c) run the one-line
    install command from `docs/howto/homeassistant-installer.md`
    (`curl -fsSL https://raw.githubusercontent.com/roamcore/RoamCore/main/install.sh | sh`),
    (d) optionally pin a specific ref via `ROAMCORE_REF=`
    (e.g. `ROAMCORE_REF=v0.1.0 curl ... | sh`), (e)
    optionally set `RC_API_TOKEN` for any future
    automation hooks (the installer doesn't currently
    consume it but the wiring is in place), (f) restart
    Home Assistant so the packages + custom components
    are reloaded, (g) verify the install via the
    dashboard's 5 `rc_ha_installer_*` status tiles +
    the operator's manual `ls -la /config/packages |
    grep roamcore` check, (h) wire the FIVE §8
    MANDATORY automations (install-button guard +
    uninstall-button guard + stale-version detector +
    installed-assets-match-repo + install-failure
    capture), (i) follow the FIVE-step operator flow —
    Step 1 tap `input_button.rc_ha_installer_run_install`
    OR run the `curl ... | sh` one-liner; Step 2 verify
    the 5 directories are populated under `/config/` +
    confirm `sensor.rc_ha_installer_status` flipped to
    `Installed`; Step 3 optionally pin a specific ref
    by setting `input_text.rc_ha_installer_installed_ref`;
    Step 4 tap `input_button.rc_ha_installer_run_uninstall`
    OR run the `curl ... | sh` uninstall one-liner; Step 5
    rerun install (the installer detects the prior state +
    creates backups + writes a new manifest).

install:
  ha_integration_domain: ha_installer
  config_flow: false
  hacs: false
  doc_recipe_only: true
  python_requirements: []
  min_ha_version: "2022.6"
  installer_scripts_at_repo_root: true
  side_effects:
    - registers_install_shell_wrapper
    - registers_uninstall_shell_wrapper
    - copies_homeassistant_packages_to_config
    - copies_homeassistant_custom_components_to_config
    - copies_homeassistant_www_to_config
    - copies_homeassistant_lovelace_to_config
    - copies_homeassistant_tools_to_config
    - writes_install_manifest
    - writes_install_info
    - creates_backup_snapshot
    - registers_ha_installer_installed_ref_contract_tile
    - registers_ha_installer_installed_at_contract_tile
    - registers_ha_installer_installed_repo_contract_tile
    - registers_ha_installer_run_install_contract_tile
    - registers_ha_installer_run_uninstall_contract_tile
    - registers_ha_installer_last_error_contract_tile
    - registers_ha_installer_backups_enabled_contract_tile
    - registers_ha_installer_status_contract_tile
    - registers_ha_installer_files_installed_count_contract_tile
    - registers_ha_installer_installed_assets_match_repo_contract_tile
    - may_register_install_button_guard_automation
    - may_register_uninstall_button_guard_automation
    - may_register_stale_version_detector_automation
    - may_register_installed_assets_match_repo_automation
    - may_register_install_failure_capture_automation
  install_root_wrapper: install.sh
  install_root_uninstall_wrapper: uninstall.sh
  install_canonical: homeassistant/install.sh
  install_canonical_uninstall: homeassistant/uninstall.sh
  install_howto: docs/howto/homeassistant-installer.md
  install_smoketest: scripts/checks/ha-beta-smoke.sh

dashboard:
  title: "HA installer"
  tiles:
    - input_text.rc_ha_installer_installed_ref
    - input_text.rc_ha_installer_installed_at
    - input_text.rc_ha_installer_installed_repo
    - input_button.rc_ha_installer_run_install
    - input_button.rc_ha_installer_run_uninstall
    - input_text.rc_ha_installer_last_error
    - input_boolean.rc_ha_installer_backups_enabled
    - sensor.rc_ha_installer_status
    - sensor.rc_ha_installer_files_installed_count
    - binary_sensor.rc_ha_installer_installed_assets_match_repo

openclaw:
  queries:
    - "is RoamCore installed?"
    - "which ref is installed?"
    - "when was it last installed?"
    - "which repo was used?"
    - "how many files are installed?"
    - "do the installed assets match the repo?"
    - "is the install stale?"
    - "what was the last error?"
    - "run install now"
    - "run uninstall now"

contract:
  installer_version: 1
  ref_pin_supported: true
  rc_api_token_aware: true
  bump_notify_automation: rc_ha_installer_install_failure_capture

contract_tiles:
  - input_text.rc_ha_installer_installed_ref
  - input_text.rc_ha_installer_installed_at
  - input_text.rc_ha_installer_installed_repo
  - input_button.rc_ha_installer_run_install
  - input_button.rc_ha_installer_run_uninstall
  - input_text.rc_ha_installer_last_error
  - input_boolean.rc_ha_installer_backups_enabled
  - sensor.rc_ha_installer_status
  - sensor.rc_ha_installer_files_installed_count
  - binary_sensor.rc_ha_installer_installed_assets_match_repo

automations:
  - id: rc_ha_installer_install_button_guard
    title: "Install-button guard"
  - id: rc_ha_installer_uninstall_button_guard
    title: "Uninstall-button guard"
  - id: rc_ha_installer_stale_version_detector
    title: "Stale-version detector"
  - id: rc_ha_installer_installed_assets_match_repo
    title: "Installed-assets-match-repo guard"
  - id: rc_ha_installer_install_failure_capture
    title: "Install-failure capture"

upstream_truth:
  reuse_first: true
  rocore_owned:
    - install.sh
    - uninstall.sh
    - homeassistant/install.sh
    - homeassistant/uninstall.sh
    - docs/howto/homeassistant-installer.md
    - scripts/checks/ha-beta-smoke.sh
  vendor_neutral: true

tests:
  - tests/test_connection_yml.py

tier_requirements:
  native_installer_code: true
  one_line_install: true
  one_line_uninstall: true
  idempotent_guard: true
  backups_enabled: true
  rc_api_token_aware: true
  install_howto_published: true
  installer_scripts_at_repo_root: true
  smoketest_present: true
  integration_tests_bench_fixture_gap_documented: true
  docs_recipe_published: true
  smoketest_path: scripts/checks/ha-beta-smoke.sh
  integration_tests:
    present: false
    reason: "Smoketest is shell-only (scripts/checks/ha-beta-smoke.sh validates the installer scripts are syntactically correct + the operator howto exists + the 5 directories are present); no pytest bench fixtures for the install / uninstall flow. Tier-a promotion requires adding pytest fixtures + a controlled environment (a HA core container via docker-compose + canned fixture responses for the install + uninstall exit codes + the 5 §8 MANDATORY automation triggers) to integration-test against."
    bench_artifacts_needed:
      - "canned install-success response (curl exit 0 + manifest.txt populated)"
      - "canned install-failure response (curl exit non-zero + stderr captured into input_text.rc_ha_installer_last_error)"
      - "canned uninstall-success response (curl exit 0 + manifest.txt truncated)"
      - "canned uninstall-failure response (curl exit non-zero + stderr captured)"
      - "canned reinstall response (prior manifest detected + backup created)"
      - "canned stale-version response (installed_ref != ROAMCORE_REF for > 7 days)"
      - "canned installed-assets-match response (files_installed_count matches repo inventory)"
      - "canned installed-assets-mismatch response (files_installed_count differs from repo inventory)"

tier_warnings:
  - no_pytest_integration_tests_against_controlled_bench
  - installer_is_shell_script_not_python_integration
  - recipe_depends_on_user_running_curl_or_tapping_install_button
  - requires_haos_or_supervised_or_core_with_ssh_addon
  - idempotency_guarded_by_backup_dir_creation_only

links:
  official:
    - https://www.home-assistant.io/installation/
  custom_references:
    - install.sh
    - uninstall.sh
    - homeassistant/install.sh
    - homeassistant/uninstall.sh
    - docs/howto/homeassistant-installer.md
    - scripts/checks/ha-beta-smoke.sh
  cross_references:
    - ../trip-local-tier-a/
    - ../trip-wrapped-tier-a/
    - ../openclaw-api/
    - ../bed-lift-diy/
