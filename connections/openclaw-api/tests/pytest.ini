# pytest configuration for the OpenClaw API integration tests.
#
# The session-scoped `hass` fixture + function-scoped `hass_client`
# fixture in conftest.py require pytest-asyncio's session-scoped loop
# mode. We pin both the default fixture loop AND the default test loop
# to `session` so a single event loop spans the whole test run —
# HA's `HomeAssistant` instance binds to a specific event loop, and
# aiohttp's `TestClient` requires the same loop. Mixing per-test loops
# with a session-scoped HA causes the "Timeout context manager should
# be used inside a task" RuntimeError that crops up when the test
# runs on a different loop than the one HA was bootstrapped on.
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
