version: 0.1.0
state: Available
description: |
  OpenClaw JSON API — vendor-neutral machine-readable
  summary + skill + rc-dump + timeseries endpoints for
  local agents — the umbrella for "RoamCore exposes
  stable JSON endpoints for local agents (system summary
  + skill execution) so assistants can read state and
  (optionally) take safe actions" — is the ai-category
  complement to the broader RoamCore "show me everything"
  affordances. The umbrella wraps the existing
  RoamCore-owned custom component at
  `homeassistant/custom_components/roamcore_openclaw_api/`
  (233 lines of Python code, real `HomeAssistantView`
  registrations at `/api/roamcore/openclaw/summary` +
  `/api/roamcore/openclaw/skill` + the diagnostic
  endpoint `/api/roamcore/openclaw/rc_dump` + the time-
  series endpoints `/api/roamcore/openclaw/timeseries/
  catalog` + `/api/roamcore/openclaw/timeseries`; the
  integration reads ONLY from `rc_*` contract entities so
  the JSON payload stays vendor-neutral). The canonical
  contract spec lives at
  `docs/reference/openclaw-json-api.md` (230 lines); the
  canonical agent install guide lives at
  `docs/howto/openclaw-roamcore-skill.md` (62 lines); the
  canonical curl smoketest lives at
  `homeassistant/tools/openclaw_api_smoketest.sh`
  (40 lines, validates `contract.version == 1` + the
  top-level keys `power`, `map`, `level`, `debug` are
  present in `/summary` + `contract.version == 1` +
  `openclaw_summary_url` + `requires_auth` +
  `summary_contract` are present in `/skill`).

  The 12 `rc_openclaw_api_*` contract tiles are the
  dashboard-side companion to the integration's JSON
  endpoints: the `enabled` + `requires_auth` toggles
  are HA core `input_boolean` helpers from
  `homeassistant/packages/roamcore_openclaw_api_controls.yaml`;
  the `contract_version` + `last_request_at` +
  `request_count_24h` + `average_latency_ms` +
  `openclaw_summary_url` + `skill_version` tiles are HA
  core `template:` sensors derived from the integration's
  audit-log entries; the `is_reachable` +
  `requires_auth_active` tiles are HA core `template:`
  binary_sensors; the `test_now` + `bust_cache` tiles are
  HA core `input_button` helpers that fire the
  integration's `roamcore_openclaw_api.test_now` +
  `roamcore_openclaw_api.bust_cache` services.

  RoamCore DOES own + maintain + ship a real custom
  component (this is the FIRST TRUE tier-a connection in
  the pipeline — the legacy tier-a claim at
  `docs/catalog/ai/openclaw-json-api.md` is HONEST). The
  install path is HACS (RoamCore is shipped as a HACS
  custom repository, then Settings → Devices & services →
  RoamCore → Configure → Enable OpenClaw API) OR the
  legacy `configuration.yaml:` path (the operator adds
  `roamcore_openclaw_api:` to their config). The tier-a-
  but-flagged honesty: the integration has real code + a
  curl-based smoketest + a canonical spec, but it does
  NOT have pytest integration tests against a controlled
  bench (the bench fixture gap that keeps this at
  tier-a-but-flagged for the audit's
  `test_status_reflects_no_*_engine` pattern). The
  promotion path to fully-fledged tier-a is documented
  in §11 of the recipe.

  RoamCore does NOT maintain a vendor-specific integration
  for the JSON endpoints (the endpoints are vendor-
  neutral — they read only from `rc_*` contract entities,
  not from vendor entities). The 12 `rc_openclaw_api_*`
  contract tiles are vendor-neutral — NO Victron /
  SeeLevel / Garnet / Mopeka / Renogy / Starlink /
  Peplink / Teltonika / Unifi / Ubiquiti / MQTT /
  webhook / REST / Companion / ESPHome / phone / GPS /
  accelerometer / iPhone / iOS / Android / Samsung /
  Pixel / OnePlus / Xiaomi / Huawei names leak into the
  tile ids. The audit catches true vendor leaks via the
  forbidden_substrings list in
  `connections/openclaw-api/tests/test_connection_yml.py`
  (`test_dashboard_tiles_follow_rc_naming`).

  The recipe covers the FOUR-step operator flow (Enable +
  Auth setup + Skill discovery + Live use) + the FIVE
  §8 MANDATORY automations (API-disabled returns 404
  guard + auth-required-when-enabled guard + rc-dump-
  only-includes-rc-prefix guard + agent-skill-discovery
  guard + contract-version-bump-notify guard) + the 12
  `rc_openclaw_api_*` contract tiles + the §9
  troubleshooting entries (6 entries) + the §10
  privacy section (the API exposes ONLY the `rc_*`
  contract surface — no vendor entities, no LLAT, no
  dashboards, no scripts, no automations; auth-required-
  by-default recommended; LAN-only deployment
  recommended for the no-auth mode) + the §11 tier-a
  promotion outline (real pytest integration tests
  against a controlled bench with canned fixture
  responses for /summary + /skill + /rc_dump + /timeseries
  endpoints, all wired together in a controlled
  environment) + the §12 cross-references (the
  existing custom component at
  `homeassistant/custom_components/roamcore_openclaw_api/`
  + the helper package at
  `homeassistant/packages/roamcore_openclaw_api_controls.yaml`
  + the curl smoketest at
  `homeassistant/tools/openclaw_api_smoketest.sh` + the
  canonical spec at `docs/reference/openclaw-json-api.md`
  + the agent install guide at
  `docs/howto/openclaw-roamcore-skill.md` + the agent-
  side skill at `openclaw/skills/roamcore/SKILL.md` + the
  mode Wave 3 #61 + the advanced-mode Wave 3 #63 + the
  demo-mode Wave 3 #62 + the leveling Wave 3 #60).

  The TIER-A strategy is intentional: the RoamCore-owned
  custom component at
  `homeassistant/custom_components/roamcore_openclaw_api/`
  is the canonical implementation (real code, real
  `HomeAssistantView` registrations, real `__init__.py`
  + `view.py` + `const.py` + `manifest.json` files,
  all RoamCore-owned + RoamCore-maintained). The
  tier-a-but-flagged honesty is that the integration has
  a curl-based smoketest, not pytest integration tests
  against a controlled bench — the bench fixture gap is
  documented in `tier_requirements.integration_tests`
  below (8 canned-response bench artifacts needed for
  full tier-a promotion).
