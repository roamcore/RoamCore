wizard:
  connection_kind: native_integration
  one_tap: true
  auto_discover: true
  estimated_time: "~5 min"
  requires_reboot: false
  setup_notes: |
    OpenClaw JSON API requires the operator to (a) install
    the RoamCore-owned custom component at
    `homeassistant/custom_components/roamcore_openclaw_api/`
    via HACS (preferred) OR via the legacy `configuration
    .yaml:` path (operator adds `roamcore_openclaw_api:`
    to their config), (b) configure the existing helper
    entities at `homeassistant/packages/roamcore_openclaw_api_controls.yaml`
    (the helper package ships with `input_boolean.
    rc_openclaw_api_enabled: initial: false` +
    `input_boolean.rc_openclaw_api_requires_auth:
    initial: false` — operator flips the enables via the
    dashboard Settings → OpenClaw API → Connect / Setup
    toggle, or via the integration options flow, or via
    the `roamcore_openclaw_api.options_set` service, or
    directly via the legacy helper), (c) if the operator
    wants auth, create a Home Assistant Long-Lived Access
    Token (LLAT) under Home Assistant → Profile → Long-
    Lived Access Tokens → Create Token, and provide that
    LLAT to their OpenClaw agent (the LLAT is NOT stored
    in RoamCore — the operator owns the token), (d) wire
    the FIVE §8 MANDATORY automations (API-disabled
    returns 404 guard + auth-required-when-enabled guard
    + rc-dump-only-includes-rc-prefix guard + agent-
    skill-discovery guard + contract-version-bump-notify
    guard), (e) follow the FOUR-step operator flow —
    Step 1 flip the `input_boolean.rc_openclaw_api_enabled`
    toggle ON; Step 2 flip the `input_boolean.rc_openclaw_
    api_requires_auth` toggle ON (recommended) AND create
    an LLAT if not already done; Step 3 point the OpenClaw
    agent at `/api/roamcore/openclaw/skill` for discovery
    (the §8.4 agent-skill-discovery guard fires); Step 4
    point the OpenClaw agent at `/api/roamcore/openclaw/
    summary` for live use (and optionally `/rc_dump` +
    `/timeseries/*`). The existing integration handles
    the JSON endpoint logic; this connection's recipe is
    the dashboard-side companion (the 12 contract tiles +
    the §8 automations + the privacy / troubleshooting /
    tier-a-promotion guides).

