    scan_interval: 60

  - platform: command_line
    name: "RC Trip Stats Total Drive Time"
    unique_id: rc_trip_stats_total_drive_time
    command: >-
      sh -lc 'python3 - <<"PY"
      import json, os
      candidates=(
        "/config/.storage/roamcore_trip_stats.json",
        "/homeassistant/.storage/roamcore_trip_stats.json",
        "/tmp/roamcore_trip_stats.json",
      )
      p=next((x for x in candidates if os.path.exists(x)), "")
      try:
        o=json.load(open(p,"r"))
        if not o.get("tracker_available"): raise SystemExit("unavail")
        hms=o.get("total_drive_time_hms") or "0h 00m"
        print(hms)
      except Exception:
        print("unknown")
      PY'
    scan_interval: 60

  - platform: command_line
    name: "RC Trip Stats Today Segments"
    unique_id: rc_trip_stats_today_segments
    command: >-
      sh -lc 'python3 - <<"PY"
      import json, os
      candidates=(
        "/config/.storage/roamcore_trip_stats.json",
        "/homeassistant/.storage/roamcore_trip_stats.json",
        "/tmp/roamcore_trip_stats.json",
      )
      p=next((x for x in candidates if os.path.exists(x)), "")
      try:
        o=json.load(open(p,"r"))
        if not o.get("tracker_available"): raise SystemExit("unavail")
        n=int(o.get("today",{}).get("segments") or 0)
        print(n)
      except Exception:
        print("unknown")
      PY'
    scan_interval: 60

  - platform: command_line
    name: "RC Trip Stats Today Stops"
    unique_id: rc_trip_stats_today_stops
    command: >-
      sh -lc 'python3 - <<"PY"
      import json, os
      candidates=(
        "/config/.storage/roamcore_trip_stats.json",
        "/homeassistant/.storage/roamcore_trip_stats.json",
