        "/config/.storage/roamcore_trip_stats.json",
        "/homeassistant/.storage/roamcore_trip_stats.json",
        "/tmp/roamcore_trip_stats.json",
      )
      p=next((x for x in candidates if os.path.exists(x)), "")
      try:
        o=json.load(open(p,"r"))
        if not o.get("tracker_available"): raise SystemExit("unavail")
        mi=float(o.get("total_distance_mi") or 0)
        print(round(mi,2))
      except Exception:
        print("unknown")
      PY'
    scan_interval: 60

  - platform: command_line
    name: "RC Trip Stats Today Drive Time"
    unique_id: rc_trip_stats_today_drive_time
    command: >-
      sh -lc 'python3 - <<"PY"
      import json, os
      candidates=(
        "/config/.storage/roamcore_trip_stats.json",
        "/homeassistant/.storage/roamcore_trip_stats.json",
        "/tmp/roamcore_trip_stats.json",
      )
      p=next((x for x in candidates if os.path.exists(x)), "")
      try:
        o=json.load(open(p,"r"))
        if not o.get("tracker_available"): raise SystemExit("unavail")
        hms=o.get("today_drive_time_hms") or "0h 00m"
        print(hms)
      except Exception:
