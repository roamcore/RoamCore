# RoamCore contract entities: Mode subsystem (MVP scaffold)
# Naming convention reference:
#   RoamCore/docs/reference/rc-entity-naming.md
#
# This is a minimal foundation for the planned Mode / automation builder.
# It deliberately does NOT implement automations yet; it only defines the
# canonical "current mode" entity that future UI + automation layers can use.

input_select:
  rc_mode:
    name: "RC Mode"
    options:
      - auto
      - travel
      - camp
      - stealth
      - off
    initial: auto
    icon: mdi:route

template:
  - sensor:
      - name: "RC Mode Current"
        unique_id: rc_mode_current
        state: >-
          {{ states('input_select.rc_mode') }}


# Convenience scripts (UI-friendly quick-set)
script:
  rc_mode_set_auto:
    alias: "RC Mode: Auto"
    sequence:
      - service: input_select.select_option
        data:
          entity_id: input_select.rc_mode
          option: auto

  rc_mode_set_travel:
    alias: "RC Mode: Travel"
    sequence:
      - service: input_select.select_option
        data:
          entity_id: input_select.rc_mode
          option: travel

  rc_mode_set_camp:
    alias: "RC Mode: Camp"
    sequence:
      - service: input_select.select_option
        data:
          entity_id: input_select.rc_mode
          option: camp

  rc_mode_set_stealth:
    alias: "RC Mode: Stealth"
    sequence:
      - service: input_select.select_option
        data:
          entity_id: input_select.rc_mode
          option: stealth

  rc_mode_set_off:
    alias: "RC Mode: Off"
    sequence:
      - service: input_select.select_option
        data:
          entity_id: input_select.rc_mode
          option: off


  # ---
  # Mode application scaffold
  #
  # This is intentionally non-destructive: it currently only logs which mode
  # would be applied. Later, each branch can be extended to call real services.

  rc_mode_apply:
    alias: "RC Mode: Apply"
    mode: single
    sequence:
      - choose:
          - conditions: "{{ is_state('input_select.rc_mode', 'auto') }}"
            sequence:
              - service: script.rc_mode_apply_auto
          - conditions: "{{ is_state('input_select.rc_mode', 'travel') }}"
            sequence:
              - service: script.rc_mode_apply_travel
          - conditions: "{{ is_state('input_select.rc_mode', 'camp') }}"
            sequence:
              - service: script.rc_mode_apply_camp
          - conditions: "{{ is_state('input_select.rc_mode', 'stealth') }}"
            sequence:
              - service: script.rc_mode_apply_stealth
          - conditions: "{{ is_state('input_select.rc_mode', 'off') }}"
            sequence:
              - service: script.rc_mode_apply_off

  rc_mode_apply_auto:
    alias: "RC Mode: Apply Auto"
    sequence:
      - service: logbook.log
        data:
          name: RoamCore
          message: "Mode apply (scaffold): auto"

  rc_mode_apply_travel:
    alias: "RC Mode: Apply Travel"
    sequence:
      - service: logbook.log
        data:
          name: RoamCore
          message: "Mode apply (scaffold): travel"

  rc_mode_apply_camp:
    alias: "RC Mode: Apply Camp"
    sequence:
      - service: logbook.log
        data:
          name: RoamCore
          message: "Mode apply (scaffold): camp"

  rc_mode_apply_stealth:
    alias: "RC Mode: Apply Stealth"
    sequence:
      - service: logbook.log
        data:
          name: RoamCore
          message: "Mode apply (scaffold): stealth"

  rc_mode_apply_off:
    alias: "RC Mode: Apply Off"
    sequence:
      - service: logbook.log
        data:
          name: RoamCore
          message: "Mode apply (scaffold): off"
