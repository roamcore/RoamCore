# RoamCore contract entities: Power subsystem
# Naming convention reference:
#   RoamCore/docs/reference/rc-entity-naming.md
#
# Mapping strategy (Wave 9 #114 — "power mock-kill"):
# - Prefer the canonical RoamCore Victron Auto add-on entity (sensor.vt_*).
# - Otherwise fall back to the legacy user-side Victron integration (sensor.victron_*).
# - If BOTH are unavailable/unknown → emit "unavailable" literally.
# - There is NO mock fallback in this package. The previous legacy fallback
#   chain (input_number.<legacy-mock-prefix>.*) silently produced plausible-
#   looking tiles on broken installs, which violated Directive Rule 4
#   ("Don't mark successful if automated action can't be verified") and
#   gave the user a lie instead of a setup prompt.
# - When the canonical vt_* source is missing, the dashboard reads
#   binary_sensor.rc_power_no_real_source and shows
#   "Power not connected — go to Setup" instead of a tile.
#
# Recovery banner entity (also defined below):
#   binary_sensor.rc_power_no_real_source
#   - on when ANY of sensor.vt_battery_soc_percent, sensor.vt_solar_power_w,
#     sensor.vt_dc_load_power_w, sensor.vt_ac_in_power_w, sensor.vt_ac_out_power_w
#     is unavailable/unknown.
#   - consumed by the RoamCore Power dashboard card to switch from the numeric
#     tile to the "Power not connected — go to Setup" banner.
#
# The dev-mock helpers still exist in homeassistant/packages/roamcore_dev_mocks.yaml
# for non-power demos; this package just no longer uses them. Removing the
# references here makes the tile honest: a broken install cannot present a
# plausible-but-fake value.

template:
  - sensor:
      - name: "RC Power Battery SoC"
        unique_id: rc_power_battery_soc
        unit_of_measurement: "%"
        state: >-
          {% set v = states('sensor.vt_battery_soc_percent') %}
          {% if v not in ['unknown','unavailable','none',''] %}
            {{ v }}
          {% else %}
            {% set v2 = states('sensor.victron_battery_soc') %}
            {% if v2 not in ['unknown','unavailable','none',''] %}
              {{ v2 }}
            {% else %}
              unavailable
            {% endif %}
          {% endif %}

      - name: "RC Power Solar Power"
        unique_id: rc_power_solar_power
        unit_of_measurement: "W"
        device_class: power
        state: >-
          {% set v = states('sensor.vt_solar_power_w') %}
          {% if v not in ['unknown','unavailable','none',''] %}
            {{ v }}
          {% else %}
            {% set v2 = states('sensor.victron_pv_power') %}
            {% if v2 not in ['unknown','unavailable','none',''] %}
              {{ v2 }}
            {% else %}
              unavailable
            {% endif %}
          {% endif %}

      - name: "RC Power Load Power"
        unique_id: rc_power_load_power
        unit_of_measurement: "W"
        device_class: power
        state: >-
          {% set v = states('sensor.vt_dc_load_power_w') %}
          {% if v not in ['unknown','unavailable','none',''] %}
            {{ v }}
          {% else %}
            {% set v2 = states('sensor.victron_load_power') %}
            {% if v2 not in ['unknown','unavailable','none',''] %}
              {{ v2 }}
            {% else %}
              unavailable
            {% endif %}
          {% endif %}

      - name: "RC Power AC In Power"
        unique_id: rc_power_ac_in_power
        unit_of_measurement: "W"
        device_class: power
        state: >-
          {% set v = states('sensor.vt_ac_in_power_w') %}
          {% if v not in ['unknown','unavailable','none',''] %}
            {{ v }}
          {% else %}
            {# No legacy victron_* mapping for AC in; missing source = unavailable. #}
            unavailable
          {% endif %}

      - name: "RC Power AC Out Power"
        unique_id: rc_power_ac_out_power
        unit_of_measurement: "W"
        device_class: power
        state: >-
          {% set v = states('sensor.vt_ac_out_power_w') %}
          {% if v not in ['unknown','unavailable','none',''] %}
            {{ v }}
          {% else %}
            unavailable
          {% endif %}

      - name: "RC Power Inverter Status"
        unique_id: rc_power_inverter_status
        icon: mdi:power
        state: >-
          {% set code = states('sensor.vt_inverter_state_code') %}
          {% if code not in ['unknown','unavailable','none',''] %}
            {# Map common VE.Bus codes to friendly labels; otherwise keep the code. #}
            {% set c = code | int(-1) %}
            {% if c == 0 %}
              off
            {% elif c == 8 %}
              passthru
            {% elif c == 9 %}
              inverting
            {% elif c == 2 %}
              fault
            {% else %}
              state_{{ c }}
            {% endif %}
          {% else %}
            {% set v2 = states('sensor.victron_inverter_state') %}
            {% if v2 not in ['unknown','unavailable','none',''] %}
              {{ v2 }}
            {% else %}
              unavailable
            {% endif %}
          {% endif %}

      # --- Power detail metrics ---
      # These have no vt_* mapping today; with no real source they surface
      # as "unavailable" instead of a fake mock value. The user's correct
      # next step is "go to Setup" — driven by rc_power_no_real_source.
      - name: "RC Power Battery Voltage"
        unique_id: rc_power_battery_voltage
        unit_of_measurement: "V"
        state: >-
          {% set v = states('sensor.vt_battery_voltage_v') %}
          {% if v not in ['unknown','unavailable','none',''] %}
            {{ v }}
          {% else %}
            unavailable
          {% endif %}

      - name: "RC Power Battery Current"
        unique_id: rc_power_battery_current
        unit_of_measurement: "A"
        state: >-
          {% set v = states('sensor.vt_battery_current_a') %}
          {% if v not in ['unknown','unavailable','none',''] %}
            {{ v }}
          {% else %}
            unavailable
          {% endif %}

      - name: "RC Power Battery Power"
        unique_id: rc_power_battery_power
        unit_of_measurement: "W"
        device_class: power
        state: >-
          {% set v = states('sensor.vt_battery_power_w') %}
          {% if v not in ['unknown','unavailable','none',''] %}
            {{ v }}
          {% else %}
            unavailable
          {% endif %}

      - name: "RC Power Battery State"
        unique_id: rc_power_battery_state
        icon: mdi:battery
        state: >-
          {# Derived from battery power sign. Positive => charging, negative => discharging. #}
          {% set p_raw = states('sensor.rc_power_battery_power') %}
          {% if p_raw in ['unknown','unavailable','none',''] %}
            unavailable
          {% else %}
            {% set p = p_raw | float(0) %}
            {% if p > 50 %}
              charging
            {% elif p < -50 %}
              discharging
            {% else %}
              idle
            {% endif %}
          {% endif %}

      - name: "RC Power Battery Temperature"
        unique_id: rc_power_battery_temperature_c
        unit_of_measurement: "°C"
        state: >-
          {% set v = states('sensor.vt_battery_temperature_c') %}
          {% if v not in ['unknown','unavailable','none',''] %}
            {{ v }}
          {% else %}
            unavailable
          {% endif %}

      - name: "RC Power Battery Capacity"
        unique_id: rc_power_battery_capacity_ah
        unit_of_measurement: "Ah"
        state: >-
          {# No vt_* mapping today; surface as unavailable until one exists. #}
          unavailable

      - name: "RC Power Battery Cycle Count"
        unique_id: rc_power_battery_cycle_count
        state: >-
          unavailable

      - name: "RC Power Battery Health"
        unique_id: rc_power_battery_health
        unit_of_measurement: "%"
        state: >-
          unavailable

      - name: "RC Power Solar Energy Today"
        unique_id: rc_power_solar_energy_today_kwh
        unit_of_measurement: "kWh"
        state: >-
          unavailable

      - name: "RC Power Solar Energy Total"
        unique_id: rc_power_solar_energy_total_kwh
        unit_of_measurement: "kWh"
        state: >-
          unavailable

      - name: "RC Power Solar Panel Voltage"
        unique_id: rc_power_solar_panel_voltage
        unit_of_measurement: "V"
        state: >-
          unavailable

      - name: "RC Power Solar Panel Current"
        unique_id: rc_power_solar_panel_current
        unit_of_measurement: "A"
        state: >-
          unavailable

      - name: "RC Power Solar Efficiency"
        unique_id: rc_power_solar_efficiency
        unit_of_measurement: "%"
        state: >-
          unavailable

      - name: "RC Power Load Fridge"
        unique_id: rc_power_load_fridge_w
        unit_of_measurement: "W"
        state: >-
          unavailable

      - name: "RC Power Load Lights"
        unique_id: rc_power_load_lights_w
        unit_of_measurement: "W"
        state: >-
          unavailable

      - name: "RC Power Load Heater"
        unique_id: rc_power_load_heater_w
        unit_of_measurement: "W"
        state: >-
          unavailable

      - name: "RC Power Load Water Pump"
        unique_id: rc_power_load_water_pump_w
        unit_of_measurement: "W"
        state: >-
          unavailable

      - name: "RC Power Load Other"
        unique_id: rc_power_load_other_w
        unit_of_measurement: "W"
        state: >-
          unavailable

      - name: "RC Power Inverter Output Power"
        unique_id: rc_power_inverter_output_power_w
        unit_of_measurement: "W"
        state: >-
          unavailable

      - name: "RC Power Inverter Output Voltage"
        unique_id: rc_power_inverter_output_voltage_v
        unit_of_measurement: "V"
        state: >-
          unavailable

      - name: "RC Power Inverter Frequency"
        unique_id: rc_power_inverter_frequency_hz
        unit_of_measurement: "Hz"
        state: >-
          unavailable

      - name: "RC Power Inverter Temperature"
        unique_id: rc_power_inverter_temperature_c
        unit_of_measurement: "°C"
        state: >-
          unavailable

      - name: "RC Power Shore Voltage"
        unique_id: rc_power_shore_voltage_v
        unit_of_measurement: "V"
        state: >-
          unavailable

      - name: "RC Power Shore Current"
        unique_id: rc_power_shore_current_a
        unit_of_measurement: "A"
        state: >-
          unavailable

      - name: "RC Power Shore Power"
        unique_id: rc_power_shore_power_w
        unit_of_measurement: "W"
        state: >-
          unavailable

      - name: "RC Power Alternator Voltage"
        unique_id: rc_power_alt_voltage_v
        unit_of_measurement: "V"
        state: >-
          unavailable

      - name: "RC Power Alternator Current"
        unique_id: rc_power_alt_current_a
        unit_of_measurement: "A"
        state: >-
          unavailable

      - name: "RC Power Alternator Power"
        unique_id: rc_power_alt_power_w
        unit_of_measurement: "W"
        state: >-
          unavailable

  - binary_sensor:
      - name: "RC Power Shore Connected"
        unique_id: rc_power_shore_connected
        state: >-
          {% set v = states('binary_sensor.vt_shore_connected') %}
          {% if v in ['on','off'] %}
            {{ true if v == 'on' else false }}
          {% else %}
            {% set src = states('binary_sensor.victron_grid_connected') %}
            {% if src in ['on','off'] %}
              {{ true if src == 'on' else false }}
            {% else %}
              unavailable
            {% endif %}
          {% endif %}

      # --- Recovery banner for the Power dashboard card ---
      # Aggregates the unavailability of the 5 canonical vt_* sensors that
      # drive the headline Power tiles. When any of them is unavailable/unknown
      # (i.e. the user has no real Victron / battery-monitor source registered),
      # this binary sensor turns on and the RoamCore Power dashboard card
      # switches to "Power not connected — go to Setup" instead of a fake
      # value. Surfaced clearly in the entity registry under rc_power_no_real_source.
      - name: "RC Power No Real Source"
        unique_id: rc_power_no_real_source
        device_class: problem
        icon: mdi:alert-circle-outline
        state: >-
          {% set sources = [
            'sensor.vt_battery_soc_percent',
            'sensor.vt_solar_power_w',
            'sensor.vt_dc_load_power_w',
            'sensor.vt_ac_in_power_w',
            'sensor.vt_ac_out_power_w',
          ] %}
          {% set ns = namespace(missing=false) %}
          {% for s in sources %}
            {% if states(s) in ['unknown','unavailable','none',''] %}
              {% set ns.missing = true %}
            {% endif %}
          {% endfor %}
          {{ ns.missing }}
