# RoamCore contract entities: Location subsystem (MVP)
# Naming convention reference:
#   RoamCore/docs/reference/rc-entity-naming.md

# MVP notes:
# - Primary source for live coordinates is typically Traccar via HA's Traccar integration.
# - The built-in Lovelace map card requires a `device_tracker` entity, but the RoamCore
#   contract prefers `rc_*` sensors. We bridge by mapping tracker attributes -> rc_*.
# - Configure your upstream tracker entity_id once via `input_text.rc_location_tracker_entity`.

input_text:
  rc_location_tracker_entity:
    name: "RC Location Tracker Entity"
    # Example: device_tracker.traccar_van
    initial: "device_tracker.traccar_van"

template:
  - sensor:
      - name: "RC Location Lat"
        unique_id: rc_location_lat
        icon: mdi:latitude
        state: >-
          {% set e = states('input_text.rc_location_tracker_entity') %}
          {{ state_attr(e, 'latitude') | float(default=none) }}
        availability: >-
          {% set e = states('input_text.rc_location_tracker_entity') %}
          {{ e not in ['unknown','unavailable',''] and state_attr(e,'latitude') is not none }}

      - name: "RC Location Lon"
        unique_id: rc_location_lon
        icon: mdi:longitude
        state: >-
          {% set e = states('input_text.rc_location_tracker_entity') %}
          {{ state_attr(e, 'longitude') | float(default=none) }}
        availability: >-
          {% set e = states('input_text.rc_location_tracker_entity') %}
          {{ e not in ['unknown','unavailable',''] and state_attr(e,'longitude') is not none }}

      - name: "RC Location Accuracy"
        unique_id: rc_location_accuracy_m
        unit_of_measurement: "m"
        icon: mdi:target
        state: >-
          {% set e = states('input_text.rc_location_tracker_entity') %}
          {{ state_attr(e, 'gps_accuracy')
              | default(state_attr(e, 'accuracy'), true)
              | float(default=none) }}
        availability: >-
          {% set e = states('input_text.rc_location_tracker_entity') %}
          {{ e not in ['unknown','unavailable',''] and (state_attr(e,'gps_accuracy') is not none or state_attr(e,'accuracy') is not none) }}

      - name: "RC Location Source"
        unique_id: rc_location_source
        icon: mdi:radar
        state: >-
          {% set e = states('input_text.rc_location_tracker_entity') %}
          {{ 'traccar' if e and e != '' else 'unknown' }}

      - name: "RC Location Speed"
        unique_id: rc_location_speed
        icon: mdi:speedometer
        state: >-
          {% set e = states('input_text.rc_location_tracker_entity') %}
          {{ state_attr(e, 'speed') | float(default=none) }}

      - name: "RC Location Heading"
        unique_id: rc_location_heading_deg
        unit_of_measurement: "°"
        icon: mdi:compass
        state: >-
          {% set e = states('input_text.rc_location_tracker_entity') %}
          {{ state_attr(e, 'course') | default(state_attr(e, 'heading'), true) | float(default=none) }}

      # Map / trip summary (mock)
      - name: "RC Map Location"
        unique_id: rc_map_location
        state: "{{ states('input_text.rc_mock_map_location') }}"

      - name: "RC Map Elevation"
        unique_id: rc_map_elevation_m
        unit_of_measurement: "m"
        state: "{{ states('input_number.rc_mock_map_elevation_m') }}"

      # Trip distance / time / segments / stops (Wave 2 #18).
      #
      # Fallthrough order (newest first, mocks last):
      #   1. `sensor.rc_trip_stats_*`     — live Traccar poll (Wave 2 #18).
      #   2. `sensor.rc_trip_wrapped_*`   — Trip Wrapped HTML export source.
      #   3. `sensor.rc_trip_local_*`     — local recorder-derived metrics.
      #   4. `input_*text/number.rc_mock_*` — dev / demo mocks.
      # The `unknown`/`unavailable`/empty-string guard preserves the
      # existing fallthrough when the upstream sensor isn't healthy yet.

      - name: "RC Trip Distance Today"
        unique_id: rc_trip_distance_today_mi
        unit_of_measurement: "mi"
        state: >-
          {% set s = states('sensor.rc_trip_stats_today_distance') %}
          {% set v = states('sensor.rc_trip_wrapped_today_distance') %}
          {% set v2 = states('sensor.rc_trip_local_today_distance') %}
          {{
            s if s not in ['unknown','unavailable','']
            else (v if v not in ['unknown','unavailable','']
            else (v2 if v2 not in ['unknown','unavailable',''] else states('input_number.rc_mock_trip_distance_today_mi')))
          }}

      - name: "RC Trip Distance Total"
        unique_id: rc_trip_distance_total_mi
        unit_of_measurement: "mi"
        state: >-
          {% set s = states('sensor.rc_trip_stats_total_distance') %}
          {{ s if s not in ['unknown','unavailable',''] else states('input_number.rc_mock_trip_distance_total_mi') }}

      - name: "RC Trip Time Today"
        unique_id: rc_trip_time_today
        state: >-
          {% set s = states('sensor.rc_trip_stats_today_drive_time') %}
          {% set v = states('sensor.rc_trip_wrapped_today_duration') %}
          {% set v2 = states('sensor.rc_trip_local_today_drive_time') %}
          {{ s if s not in ['unknown','unavailable',''] else (v if v not in ['unknown','unavailable',''] else (v2 if v2 not in ['unknown','unavailable',''] else states('input_text.rc_mock_trip_time_today'))) }}

      - name: "RC Trip Time Total"
        unique_id: rc_trip_time_total
        state: >-
          {% set s = states('sensor.rc_trip_stats_total_drive_time') %}
          {{ s if s not in ['unknown','unavailable',''] else states('input_text.rc_mock_trip_time_total') }}

      - name: "RC Trip Segments"
        unique_id: rc_trip_segments
        state: >-
          {% set s = states('sensor.rc_trip_stats_today_segments') %}
          {{ s if s not in ['unknown','unavailable',''] else states('input_number.rc_mock_trip_segments') }}

      - name: "RC Trip Stops"
        unique_id: rc_trip_stops
        state: >-
          {% set s = states('sensor.rc_trip_stats_today_stops') %}
          {% set v = states('sensor.rc_trip_wrapped_today_stops') %}
          {% set v2 = states('sensor.rc_trip_local_today_stops') %}
          {{ s if s not in ['unknown','unavailable',''] else (v if v not in ['unknown','unavailable',''] else (v2 if v2 not in ['unknown','unavailable',''] else states('input_number.rc_mock_trip_stops'))) }}

# ---------------------------------------------------------------------------
# Auto-fill rc_location_tracker_entity on first boot.
#
# Problem: RoamCore ships with the traccar_server integration (or HACS
# traccar) which creates device_tracker.traccar_<name> entities. The user has
# to manually set input_text.rc_location_tracker_entity so the rc_location_*
# template sensors above have a source. We can't do that headlessly because
# the entity_id depends on what the user named the device in Traccar.
#
# Solution: an automation triggered on `homeassistant_started` that:
#   1. Inspects the entity registry for any `device_tracker.traccar_*`
#      entity. If one (or more) exist, picks the first and writes its
#      entity_id into input_text.rc_location_tracker_entity.
#   2. Falls back to whatever the input_text is already set to (the
#      bootstrap default `device_tracker.traccar_van`), so users who name
#      their device `van` get the right thing on first install.
#   3. Also re-runs whenever a new device_tracker.traccar_* entity is
#      registered (e.g. user adds a second Traccar device). This handles
#      the "I added the integration mid-session" case.
#   4. If nothing matches and the input_text is blank, leaves it blank so
#      the rc_location_* templates degrade to `unknown` (existing safe
#      behaviour — no crashes).
#
# We use `event: homeassistant_started` + an entity_registry trigger so we
# don't need to import the registry at template time. The registry is
# resolved lazily inside the action template.
# ---------------------------------------------------------------------------
automation:
  - id: rc_location_autofill_tracker_entity
    alias: "RC: auto-fill rc_location_tracker_entity"
    description: >-
      On HA start and whenever a new device_tracker.traccar_* entity is
      registered, write the first matching entity_id into
      input_text.rc_location_tracker_entity so rc_location_* sensors resolve.
    mode: single
    trigger:
      - platform: homeassistant
        event: start
      - platform: event
        event_type: entity_registry_updated
        event_data:
          action: create
    condition: []
    action:
      - variables:
          traccar_trackers: >-
            {% set entities = states.device_tracker
                  | selectattr('entity_id', 'search', '^device_tracker\.traccar_')
                  | map(attribute='entity_id')
                  | list %}
            {{ entities | first | default('', true) }}
          current_entity: "{{ states('input_text.rc_location_tracker_entity') }}"
      - choose:
          # If we found a device_tracker.traccar_* entity and the input_text
          # is empty or still the bootstrap default `device_tracker.traccar_van`
          # (which may not exist yet on first boot), write it.
          - conditions:
              - "{{ traccar_trackers != '' }}"
              - "{{ current_entity in ['unknown', 'unavailable', '', 'device_tracker.traccar_van'] }}"
            action:
              - service: input_text.set_value
                target:
                  entity_id: input_text.rc_location_tracker_entity
                data:
                  value: "{{ traccar_trackers }}"
          # Otherwise, if the configured entity exists, leave it alone.
          - conditions:
              - "{{ current_entity not in ['unknown', 'unavailable', ''] }}"
              - "{{ states(current_entity) not in ['unknown', 'unavailable'] }}"
            action: []
          # Otherwise, nothing to do — rc_location_* sensors degrade to
          # `unknown` via the existing availability guards.
          - conditions: []
            action: []

# NOTE: This file is a Home Assistant package.
# Keep template entity names/unique_ids stable to preserve entity_id continuity.
