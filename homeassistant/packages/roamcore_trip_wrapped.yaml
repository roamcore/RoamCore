# RoamCore MVP: Trip Wrapped export wiring
#
# This package wires a dashboard button -> script -> shell_command that
# generates `/config/www/roamcore/trip_wrapped/latest.html`.
#
# Slice #21 adds the "seamless USP flow": two input_booleans track whether
# the operator has configured Traccar yet, and an automation turns ON the
# demo seed (and writes `latest.json`) so a brand-new install can show a
# fully-rendered Trip Wrapped with one tap.
#   - input_boolean.rc_trip_wrapped_demo  : ON by default (first-run demo).
#   - input_boolean.rc_trip_wrapped_real  : OFF until Traccar is configured.
# When rc_trip_wrapped_real flips ON, rc_trip_wrapped_demo is turned OFF.

# Ensure the custom component reverse-proxy is loaded so we can embed Traccar
# without local-network iframe blocks and without requiring the user to log in.
roamcore_traccar_proxy:

# --- Slice #21: Trip Wrapped seamless USP flow ---
# These two booleans gate whether the dashboard shows a "demo trip" CTA
# (default ON) or a "use my real trips" CTA (default OFF until Traccar is
# configured). The companion automation below keeps them mutually exclusive.
input_boolean:
  rc_trip_wrapped_demo:
    name: "RC Trip Wrapped — Show Demo"
    icon: mdi:movie-open-star
    # Default ON so the first-run UX always shows a fully-rendered report.
    initial: true
  rc_trip_wrapped_real:
    name: "RC Trip Wrapped — Use Real Trips"
    icon: mdi:car-connected
    # Default OFF until the operator configures Traccar.
    initial: false

input_text:
  rc_owner_name:
    name: "RC Owner Name"
    initial: "You"

  rc_traccar_base_url:
    name: "RC Traccar Base URL"
    initial: "http://localhost:8082"  # adjust for your Traccar add-on/external URL
    # PRIVACY: loopback default (local Traccar add-on); change to a
    # non-local host only after adding it to input_text.rc_trip_opt_in_domains
    # AND setting input_boolean.rc_trip_local_only to OFF.
  rc_traccar_username:
    name: "RC Traccar Username"
  rc_traccar_password:
    name: "RC Traccar Password"
    mode: password

  rc_traccar_ingress_path:
    name: "RC Traccar Ingress Path"
    # Example add-on ingress path: /hassio/ingress/a0d7b954_traccar/
    # NOTE: do NOT include a trailing slash; HA hassio handler can mis-parse it.
    initial: "/hassio/ingress/a0d7b954_traccar"

  rc_traccar_ui_url:
    name: "RC Traccar UI URL"
    # Use the same-origin HA reverse proxy so the UI can be embedded in HA mobile,
    # and auto-login can be handled server-side.
    initial: "/api/roamcore/traccar"

  rc_trip_wrapped_from:
    name: "RC Trip Wrapped From (ISO8601)"
    initial: "2026-03-01T00:00:00Z"
  rc_trip_wrapped_to:
    name: "RC Trip Wrapped To (ISO8601)"
    initial: "2026-03-08T00:00:00Z"

# Simple health check for the Traccar UI.
# This avoids adding more template sensors (packages don't merge template lists well).
binary_sensor:
  - platform: command_line
    name: "RC Traccar UI Reachable"
    unique_id: rc_traccar_ui_reachable
    command: >-
      sh -lc 'curl -fsS --max-time 5 "{{ states(''input_text.rc_traccar_ui_url'') }}" >/dev/null && echo ON || echo OFF'
    scan_interval: 30
    payload_on: "ON"
    payload_off: "OFF"

template:
  - binary_sensor:
      - name: "RC Trip Wrapped Latest Ready"
        unique_id: rc_trip_wrapped_latest_ready
        icon: mdi:share-variant
        state: >-
          {{ states('sensor.rc_trip_wrapped_latest_status') == 'ok' }}
        availability: >-
          {{ states('sensor.rc_trip_wrapped_latest_status') not in ['unknown','unavailable'] }}

input_number:
  rc_traccar_device_id:
    name: "RC Traccar Device ID"
    min: 1
    max: 999999
    step: 1
    mode: box
    initial: 1

shell_command:
  rc_trip_wrapped_export: >-
    python3 /config/tools/trip_wrapped/export.py
    --base-url {{ states('input_text.rc_traccar_base_url') }}
    --username {{ states('input_text.rc_traccar_username') }}
    --password {{ states('input_text.rc_traccar_password') }}
    --device-id {{ states('input_number.rc_traccar_device_id') | int }}
    --from {{ states('input_text.rc_trip_wrapped_from') }}
    --to {{ states('input_text.rc_trip_wrapped_to') }}
    --title "Trip Wrapped"
    --owner-name "{{ states('input_text.rc_owner_name') if states('input_text.rc_owner_name') not in ['unknown','unavailable','none',''] else 'You' }}"
    {% if is_state('input_boolean.rc_demo_mode','on') %} --demo {% endif %}
    --template story
    --out-json /config/www/roamcore/trip_wrapped/latest.json
    --out-html /config/www/roamcore/trip_wrapped/latest.html

  # Automatic "Today" export for dashboard tiles.
  # Uses HA's current time (UTC by default in this deployment) and writes a stable JSON used by sensors.
  rc_trip_wrapped_export_today: >-
    python3 /config/tools/trip_wrapped/export.py
    --base-url {{ states('input_text.rc_traccar_base_url') }}
    --username {{ states('input_text.rc_traccar_username') }}
    --password {{ states('input_text.rc_traccar_password') }}
    --device-id {{ states('input_number.rc_traccar_device_id') | int }}
    --from {{ now().replace(hour=0, minute=0, second=0, microsecond=0).isoformat() }}
    --to {{ now().isoformat() }}
    --title "RoamCore Trip Wrapped (Today)"
    {% if is_state('input_boolean.rc_demo_mode','on') %} --demo {% endif %}
    --template story
    --out-json /config/www/roamcore/trip_wrapped/today.json
    --out-html /config/www/roamcore/trip_wrapped/today.html

  # --- Slice #21: demo seed generator ---
  # Writes a fully-local demo Trip Wrapped JSON to `latest.json`.
  # Stdlib-only, no outbound HTTP (map URL points at local tileserver).
  rc_trip_wrapped_demo_seed: >-
    python3 /config/tools/trip_wrapped/demo_seed.py
    --out /config/www/roamcore/trip_wrapped/latest.json

script:
  rc_trip_wrapped_run:
    alias: "RC: Generate Trip Wrapped"
    mode: single
    sequence:
      - service: shell_command.rc_trip_wrapped_export
      - service: persistent_notification.create
        data:
          title: "Trip Wrapped ready"
          message: "Open: /local/roamcore/trip_wrapped/latest.html"

  rc_trip_wrapped_run_today:
    alias: "RC: Generate Trip Wrapped (Today)"
    mode: single
    sequence:
      - service: shell_command.rc_trip_wrapped_export_today

  # --- Slice #21: one-tap demo seed ---
  # Writes a fully-local demo Trip Wrapped JSON to `latest.json` so the
  # first-run Map → Trip Wrapped UI has something to render immediately.
  # No Traccar, no outbound HTTP — see demo_seed.py + privacy contract.
  rc_trip_wrapped_demo_seed:
    alias: "RC: Generate Trip Wrapped (Demo Seed)"
    mode: single
    sequence:
      - service: shell_command.rc_trip_wrapped_demo_seed
      - service: persistent_notification.create
        data:
          title: "Trip Wrapped demo ready"
          message: "Open: /local/roamcore/trip_wrapped/latest.json (demo)"

automation:
  - id: rc_trip_wrapped_auto_today
    alias: "RC: Auto-generate Trip Wrapped (Today)"
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/15"
    condition: []
    action:
      - service: script.rc_trip_wrapped_run_today

  # --- Slice #21: keep demo/real booleans mutually exclusive ---
  # When the operator flips "use real trips" ON (after configuring Traccar),
  # the demo flag is turned OFF so the dashboard stops showing the demo CTA.
  - id: rc_trip_wrapped_real_turns_off_demo
    alias: "RC: Real trips ON → demo OFF"
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.rc_trip_wrapped_real
        to: "on"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.rc_trip_wrapped_demo

  # When the operator flips the demo flag back ON (or installs a fresh
  # image where it defaults to ON), regenerate latest.json from the seed
  # so the dashboard can render the demo immediately on next load.
  - id: rc_trip_wrapped_demo_turns_on_seed
    alias: "RC: Demo ON → regenerate seed"
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.rc_trip_wrapped_demo
        to: "on"
    action:
      - service: script.rc_trip_wrapped_demo_seed

sensor:
  # Latest export status sensors (read from generated JSON).
  # These are used to make the UI deterministic: show “ready / needs setup / missing”
  # rather than silently failing.
  - platform: command_line
    name: "RC Trip Wrapped Latest Status"
    unique_id: rc_trip_wrapped_latest_status
    command: >-
      sh -lc 'python3 - <<"PY"
      import json
      p="/config/www/roamcore/trip_wrapped/latest.json"
      try:
        o=json.load(open(p,"r"))
        meta=o.get("meta",{}) or {}
        st=str(meta.get("dataStatus") or "ok")
        print(st)
      except Exception:
        print("missing")
      PY'
    scan_interval: 30

  - platform: command_line
    name: "RC Trip Wrapped Latest Generated At"
    unique_id: rc_trip_wrapped_latest_generated_at
    command: >-
      sh -lc 'python3 - <<"PY"
      import json
      p="/config/www/roamcore/trip_wrapped/latest.json"
      try:
        o=json.load(open(p,"r"))
        meta=o.get("meta",{}) or {}
        ga=str(meta.get("generatedAt") or "")
        print(ga if ga else "unknown")
      except Exception:
        print("unknown")
      PY'
    scan_interval: 30

  # Today summary sensors used by dashboard tiles.
  # These read the generated /local JSON so we don't recompute in the frontend.
  - platform: command_line
    name: "RC Trip Wrapped Today Distance"
    unique_id: rc_trip_wrapped_today_distance_mi
    unit_of_measurement: "mi"
    command: >-
      sh -lc 'python3 - <<"PY"
      import json,math
      p="/config/www/roamcore/trip_wrapped/today.json"
      try:
        o=json.load(open(p,"r"))
        m=float(o.get("stats",{}).get("totalDistanceM") or 0)
        mi=m/1609.344
        print(round(mi,2))
      except Exception:
        print("unknown")
      PY'
    scan_interval: 60

  - platform: command_line
    name: "RC Trip Wrapped Today Duration"
    unique_id: rc_trip_wrapped_today_duration_hms
    command: >-
      sh -lc 'python3 - <<"PY"
      import json
      p="/config/www/roamcore/trip_wrapped/today.json"
      try:
        o=json.load(open(p,"r"))
        s=int(o.get("stats",{}).get("totalDurationS") or 0)
        h=s//3600
        m=(s%3600)//60
        print(f"{h}:{m:02d}")
      except Exception:
        print("unknown")
      PY'
    scan_interval: 60

  - platform: command_line
    name: "RC Trip Wrapped Today Stops"
    unique_id: rc_trip_wrapped_today_stops
    command: >-
      sh -lc 'python3 - <<"PY"
      import json
      p="/config/www/roamcore/trip_wrapped/today.json"
      try:
        o=json.load(open(p,"r"))
        # MVP: use tripCount as a rough proxy for stops/segments until we compute real stop events.
        print(int((o.get("meta",{}).get("tripCount") or 0)))
      except Exception:
        print("unknown")
      PY'
    scan_interval: 60
