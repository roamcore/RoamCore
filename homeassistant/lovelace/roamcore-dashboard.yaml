  #     - entity: binary_sensor.rc_ota_rollback_pending
  #       name: Rollback pending
  #     - entity: sensor.rc_ota_snapshot_count
  #       name: Snapshots
  #     - entity: sensor.rc_ota_last_check
  #       name: Last check
  # - type: entities
  #   title: "OTA controls"
  #   entities:
  #     - entity: input_select.rc_ota_channel
  #     - entity: input_number.rc_ota_poll_minutes
  #     - entity: input_number.rc_ota_apply_hour
  #     - entity: input_boolean.rc_ota_auto_apply
  #     - entity: script.rc_ota_check
  #     - entity: script.rc_ota_apply
  #     - entity: script.rc_ota_rollback
