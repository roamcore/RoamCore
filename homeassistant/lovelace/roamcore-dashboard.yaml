# RoamCore Dashboard - Lovelace configuration
# This is a custom dashboard using the RoamCore custom cards.
# Reference: homeassistant/www/roamcore/*.js

title: RoamCore
views:
  # Main dashboard (home)
  - path: home
    title: Dashboard
    icon: mdi:home
    panel: true
    cards:
      - type: custom:roamcore-dashboard-card

  # Power detail page
  - path: power
    title: Power
    icon: mdi:lightning-bolt
    panel: false
    cards:
      - type: vertical-stack
        cards:
          - type: custom:roamcore-victron-connect
            title: Victron (Connect)
          - type: custom:roamcore-power-page

  # Network detail page
  - path: network
    title: Network
    icon: mdi:wifi
    panel: true
    cards:
      - type: custom:roamcore-network-page

  # Location/Map page
  - path: location
    title: Location
    icon: mdi:map-marker
    panel: true
    cards:
      - type: custom:roamcore-location-page

  # Map page (embedded)
  - path: map
    title: Map
    icon: mdi:map
    panel: true
    cards:
      - type: custom:roamcore-map-page

  # Traccar page (full UI, proxied + auto-login)
  - path: traccar
    title: Traccar
    icon: mdi:map-clock
    panel: true
    cards:
      - type: iframe
        url: /api/roamcore/traccar/
        aspect_ratio: 75%

  # Level page
  - path: level
    title: Level
    icon: mdi:spirit-level
    panel: true
    cards:
      - type: custom:roamcore-level-page

  # Settings page
  - path: settings
    title: Settings
    icon: mdi:cog
    panel: true
    cards:
      - type: custom:roamcore-settings-page

  # Setup wizard (guided first-run)
  - path: setup
    title: Setup
    icon: mdi:magic-staff
    panel: false
    cards:
      - type: markdown
        content: |
          # RoamCore Setup
          Guided first-run setup. You can revisit this any time.

      - type: entities
        title: Progress
        entities:
          - entity: sensor.rc_setup_progress
            name: Completed
          - entity: input_select.rc_setup_stage
            name: Current step
          - entity: binary_sensor.rc_setup_owner_ready
          - entity: binary_sensor.rc_setup_map_ready
          - entity: binary_sensor.rc_setup_trip_wrapped_ready
          - entity: binary_sensor.rc_setup_victron_ready

      - type: markdown
        content: |
          ## 1) Owner

      - type: entities
        title: Owner
        entities:
          - entity: input_text.rc_owner_name
            name: Owner name

      - type: markdown
        content: |
          ## 2) Map / Location
          If you don't see location data, set your tracker entity helper:
          `input_text.rc_location_tracker_entity`

      - type: entities
        title: Map settings
        entities:
          - entity: input_text.rc_location_tracker_entity
          - entity: input_text.rc_map_tile_url
          - entity: input_text.rc_map_tile_url_online
          - entity: input_text.rc_map_style_url
          - entity: input_number.rc_map_offline_max_zoom

      - type: map
        hours_to_show: 6
        default_zoom: 12
        entities: []

      - type: markdown
        content: |
          ## 3) Trip Wrapped (Traccar)
          Recommended: use a Traccar **user token** stored in `/config/secrets.yaml` as:
          `roamcore_traccar_user_token:`

      - type: entities
        title: Traccar
        entities:
          - entity: input_text.rc_traccar_base_url
            name: Traccar base URL
          - entity: input_number.rc_traccar_device_id
            name: Device ID
          - entity: input_text.rc_traccar_ui_url
            name: Traccar UI (proxy)
          - entity: input_text.rc_setup_traccar_user_token
            name: Paste Traccar user token
          - entity: script.rc_setup_save_traccar_user_token
            name: Save token securely
          - entity: script.rc_trip_wrapped_run_today
            name: Generate (Today)

      - type: markdown
        content: |
          Latest report:
          - [/local/roamcore/trip_wrapped/latest.html](/local/roamcore/trip_wrapped/latest.html)

      - type: markdown
        content: |
          ## 4) Victron
          Use the connect card to discover and connect.

      - type: vertical-stack
        cards:
          - type: custom:roamcore-victron-connect
            title: Victron (Connect)
          - type: entities
            title: Victron backend health
            entities:
              - entity: binary_sensor.rc_system_power_backend_connected
              - entity: sensor.rc_system_power_backend_status
              - entity: sensor.rc_system_power_backend_snapshot_state
              - entity: sensor.rc_system_power_backend_devices
              - entity: sensor.rc_system_power_backend_topics

      - type: markdown
        content: |
          ## Finish
          When the checks are green, you're ready.
          - Open dashboard: `/roamcore/home`

  # Diagnostics (support / bring-up)
  - path: diagnostics
    title: Diagnostics
    icon: mdi:stethoscope
    panel: true
    cards:
      - type: custom:roamcore-diagnostics-page

  # Debug / health view (MVP observability)
  - path: status
    title: Status
    icon: mdi:heart-pulse
    panel: false
    cards:
      - type: entities
        title: Power backend (Victron)
        entities:
          - entity: binary_sensor.rc_system_power_backend_connected
          - entity: sensor.rc_system_power_backend_status
          - entity: sensor.rc_system_power_backend_snapshot_state
          - entity: sensor.rc_system_power_backend_devices
          - entity: sensor.rc_system_power_backend_topics

      - type: entities
        title: Networking (rc_net_*)
        entities:
          - entity: sensor.rc_net_wan_status
          - entity: sensor.rc_net_wan_source
          - entity: sensor.rc_net_ping
          - entity: sensor.rc_net_download
          - entity: sensor.rc_net_upload
          - entity: sensor.rc_net_packet_loss
          - entity: sensor.rc_net_jitter
          - entity: sensor.rc_net_uptime
          - entity: sensor.rc_net_last_disconnect
