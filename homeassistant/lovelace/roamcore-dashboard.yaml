  #   title: "RoamCore OTA"
  #   content: |
  #     # RoamCore OTA
  #     Channel: **{{ states('input_select.rc_ota_channel') }}** ·
  #     Running: **{{ states('input_text.rc_ota_running_version') }}** ·
  #     Latest: **{{ states('sensor.rc_ota_latest_version') }}**
  #
  #     RoamCore OTA only talks to api.github.com over HTTPS — no telemetry.
