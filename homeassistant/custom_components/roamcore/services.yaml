secrets_set:
  name: Set secret in /config/secrets.yaml
  description: Best-effort atomic update to set a key/value pair in secrets.yaml.
  fields:
    key:
      name: Key
      description: The secrets.yaml key to set.
      required: true
      example: roamcore_traccar_user_token
      selector:
        text: {}
    value:
      name: Value
      description: The value to store.
      required: true
      selector:
        text: {}

secrets_delete:
  name: Delete secret from /config/secrets.yaml
  description: Best-effort atomic update to remove a key from secrets.yaml.
  fields:
    key:
      name: Key
      description: The secrets.yaml key to delete.
      required: true
      selector:
        text: {}

provision_assets:
  name: Provision RoamCore assets into /config
  description: >-
    Downloads the RoamCore repo archive and installs homeassistant/* assets into
    your Home Assistant /config directory (packages, www, dashboards, tools).
  fields:
    repo:
      name: Repo URL
      description: GitHub repo to download.
      required: false
      example: https://github.com/roamcore/RoamCore
      selector:
        text: {}
    ref:
      name: Ref
      description: Git ref (branch/tag/commit) to provision.
      required: false
      example: main
      selector:
        text: {}

export_support_bundle:
  name: Export RoamCore support bundle
  description: >-
    Writes a diagnostic support bundle to /config/.roamcore/support/<timestamp>/
    and optionally creates a zip archive.
  fields:
    zip:
      name: Create zip
      description: If true, also create /config/.roamcore/support/<timestamp>.zip.
      required: false
      default: true
      selector:
        boolean: {}

backup_update:
  name: Backup + Update RoamCore assets
  description: >-
    Creates a full Home Assistant backup when Supervisor backup services are
    available (best-effort), then provisions RoamCore homeassistant/* assets
    into /config for the given git ref.

    Notes:
    - Home Assistant is NOT restarted automatically.
    - Provisioning creates per-file backups under /config/.roamcore/backups/.
  fields:
    repo:
      name: Repo URL
      description: GitHub repo to download.
      required: false
      example: https://github.com/roamcore/RoamCore
      selector:
        text: {}
    ref:
      name: Ref
      description: Git ref (tag/commit/branch) to provision. If omitted, uses the configured provision_ref option.
      required: false
      example: v0.3.0
      selector:
        text: {}
    target:
      name: Target
      description: Optional shortcut. Use latest_release to resolve the latest GitHub release tag.
      required: false
      example: latest_release
      selector:
        select:
          options:
            - latest_release
            - latest
    backup:
      name: Create full backup
      description: If true, attempt a full backup via Supervisor services (best-effort).
      required: false
      default: true
      selector:
        boolean: {}
    backup_name:
      name: Backup name
      description: Optional name for the created backup.
      required: false
      selector:
        text: {}

labs_export_setup:
  name: Bundle RoamCore setup as a local tar.gz
  description: >-
    Bundle the active RoamCore setup (dashboard YAML + selected packages
    + a manifest) into a local tar.gz. Privacy-by-default: no remote
    upload, no telemetry, no third-party HTTP. The owner chooses where
    to write the file and how to share it. See the Wave 2 #32 slice
    (docs/setup/labs.md) for the operator guide.
  fields:
    target_path:
      name: Target path
      description: >-
        Where to write the bundle. Directory or .tar.gz path. If a
        directory is given, the bundle is written into it with a
        UTC-timestamped filename. If omitted, the bundle is written
        under /config/.storage/roamcore_labs/exports/<UTC-timestamp>/roamcore_setup.tar.gz.
      required: false
      example: /config/.storage/roamcore_labs/exports/manual/roamcore_setup.tar.gz
      selector:
        text: {}
    dashboard_file:
      name: Dashboard file
      description: >-
        Path to the dashboard YAML to include in the bundle. Default:
        /config/lovelace/roamcore-dashboard.yaml.
      required: false
      selector:
        text: {}
    packages_dir:
      name: Packages dir
      description: >-
        Path to the packages directory to include in the bundle. Default:
        /config/packages.
      required: false
      selector:
        text: {}

labs_import_setup:
  name: Stage a RoamCore Labs bundle for apply-on-next-reload
  description: >-
    Stage a local RoamCore Labs bundle (tar.gz) so the operator can
    preview it on the Setup Wizard card. The bundle is unpacked into
    /config/.storage/roamcore_labs/imports/<stem>_<timestamp>/ and the
    path is written to input_text.rc_labs_pending_import so the
    dashboard can render the pending-import pill. The actual apply is
    gated on the operator's reload step (idempotent). dry_run default
    is true; the service refuses to write anything outside the staging
    root. Privacy-by-default: no remote upload, no telemetry, no
    third-party HTTP. See the Wave 2 #32 slice (docs/setup/labs.md)
    for the operator guide.
  fields:
    bundle_path:
      name: Bundle path
      description: Path to the bundle tar.gz to stage.
      required: true
      example: /config/.storage/roamcore_labs/exports/20260729T211214Z/roamcore_setup.tar.gz
      selector:
        text: {}
    apply:
      name: Apply on next reload
      description: >-
        If true, mark the staged bundle as 'apply on next reload'. The
        service will NOT auto-apply; the operator still has to flip
        the apply flag on the wizard card. Default: false (stage only).
      required: false
      default: false
      selector:
        boolean: {}
    dry_run:
      name: Dry run
      description: >-
        If true (default), inspect the bundle without extracting it.
        The service emits the manifest + the list of files it would
        extract to the logbook. Default: true.
      required: false
      default: true
      selector:
        boolean: {}

gamification_acknowledge_trophy:
  name: Acknowledge a RoamCore gamification trophy
  description: >-
    Flip the matching input_boolean.rc_gamification_trophy_seen_<id>
    ON so the dashboard can render the trophy as "seen" rather than
    "new". Idempotent (already-on stays on). Privacy-by-default: no
    remote upload, no telemetry, no third-party HTTP. The service is
    a pure HA service call — no Python processing. See the Wave 2 #33
    slice (docs/setup/gamification.md) for the operator guide.
  fields:
    trophy_id:
      name: Trophy ID
      description: >-
        Trophy identifier to acknowledge. Must be one of the 7 known
        trophies; an unknown value raises a ValueError surfaced as a
        persistent_notification.
      required: true
      example: first_trip_wrapped
      selector:
        select:
          options:
            - first_trip_wrapped
            - first_power_session
            - first_automation
            - first_share_exported
            - first_offline_driving_day
            - first_setup_complete
            - first_twilight_handling
