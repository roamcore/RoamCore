secrets_set:
  name: Set secret in /config/secrets.yaml
  description: Best-effort atomic update to set a key/value pair in secrets.yaml.
  fields:
    key:
      name: Key
      description: The secrets.yaml key to set.
      required: true
      example: roamcore_traccar_user_token
      selector:
        text: {}
    value:
      name: Value
      description: The value to store.
      required: true
      selector:
        text: {}

secrets_delete:
  name: Delete secret from /config/secrets.yaml
  description: Best-effort atomic update to remove a key from secrets.yaml.
  fields:
    key:
      name: Key
      description: The secrets.yaml key to delete.
      required: true
      selector:
        text: {}

provision_assets:
  name: Provision RoamCore assets into /config
  description: >-
    Downloads the RoamCore repo archive and installs homeassistant/* assets into
    your Home Assistant /config directory (packages, www, dashboards, tools).
  fields:
    repo:
      name: Repo URL
      description: GitHub repo to download.
      required: false
      example: https://github.com/roamcore/RoamCore
      selector:
        text: {}
    ref:
      name: Ref
      description: Git ref (branch/tag/commit) to provision.
      required: false
      example: main
      selector:
        text: {}

export_support_bundle:
  name: Export RoamCore support bundle
  description: >-
    Writes a diagnostic support bundle to /config/.roamcore/support/<timestamp>/
    and optionally creates a zip archive.
  fields:
    zip:
      name: Create zip
      description: If true, also create /config/.roamcore/support/<timestamp>.zip.
      required: false
      default: true
      selector:
        boolean: {}

backup_update:
  name: Backup + Update RoamCore assets
  description: >-
    Creates a full Home Assistant backup when Supervisor backup services are
    available (best-effort), then provisions RoamCore homeassistant/* assets
    into /config for the given git ref.

    Notes:
    - Home Assistant is NOT restarted automatically.
    - Provisioning creates per-file backups under /config/.roamcore/backups/.
  fields:
    repo:
      name: Repo URL
      description: GitHub repo to download.
      required: false
      example: https://github.com/roamcore/RoamCore
      selector:
        text: {}
    ref:
      name: Ref
      description: Git ref (tag/commit/branch) to provision. If omitted, uses the configured provision_ref option.
      required: false
      example: v0.3.0
      selector:
        text: {}
    target:
      name: Target
      description: Optional shortcut. Use latest_release to resolve the latest GitHub release tag.
      required: false
      example: latest_release
      selector:
        select:
          options:
            - latest_release
            - latest
    backup:
      name: Create full backup
      description: If true, attempt a full backup via Supervisor services (best-effort).
      required: false
      default: true
      selector:
        boolean: {}
    backup_name:
      name: Backup name
      description: Optional name for the created backup.
      required: false
      selector:
        text: {}

create_backup:
  name: Create Hub backup
  description: >-
    Create a nightly snapshot of your Hub that RoamCore can restore from.
    RoamCore runs this every night at 02:00, but you can trigger it
    anytime by tapping the "Back up now" button on the Hub Backup tile.
    The backup includes your full Hub state — automations, helpers,
    dashboards, and settings. Use retention_days to keep the backup
    for the chosen number of days; use destination_local to point at
    a USB drive or network share (defaults to the Hub's built-in
    backup folder).
  fields:
    retention_days:
      name: Keep this backup for (days)
      description: How many days to keep this backup before RoamCore deletes it. The default of 30 is fine for most people.
      required: false
      default: 30
      example: 30
      selector:
        number:
          min: 1
          max: 365
          step: 1
          unit_of_measurement: days
    destination_local:
      name: Where to save the backup
      description: Folder on your Hub where RoamCore saves the backup. Defaults to the Hub's built-in backup folder.
      required: false
      default: "/config/.roamcore/backups/"
      example: "/config/.roamcore/backups/"
      selector:
        text: {}
    destination_remote:
      name: Also copy to a second place (optional)
      description: Optional second location (e.g. a network share) where RoamCore also saves the backup. Leave blank to keep things simple.
      required: false
      selector:
        text: {}

list_backups:
  name: List Hub backups
  description: >-
    Show every Hub backup RoamCore has on file, with the date and size
    of each. Useful when you're picking which backup to restore from.
  fields: {}

delete_backup:
  name: Delete a Hub backup
  description: >-
    Remove a Hub backup so it doesn't count toward your retention
    limit. Useful when you're freeing up space on the backup drive.
    The backup_id is shown on the Hub Backup tile and in the
    "List Hub backups" service response.
  fields:
    backup_id:
      name: Backup ID
      description: The ID of the backup to delete. Tap "List Hub backups" first to find the ID.
      required: true
      example: "2026-08-06T02:00:00_backup"
      selector:
        text: {}

test_restore:
  name: Test that a Hub backup can be restored
  description: >-
    Confirm that a Hub backup actually works — not just that it was
    made. RoamCore runs this every night right after creating a
    backup, so you can usually trust the "checked out" status on the
    tile. Tap "Verify now" on the Hub Backup tile to re-run the
    check by hand. The result shows up on the tile as plain English.
  fields:
    backup_id:
      name: Backup ID
      description: The ID of the backup to test. The most recent backup is used if you leave this blank.
      required: false
      selector:
        text: {}

rotate_api_token:
  name: Rotate access code
  description: >-
    Rotate the access code that OpenClaw agents use to ask your Hub
    questions. RoamCore writes a backup before the new code is saved,
    so you can always undo the change from the audit log. The
    rotation runs automatically every 90 days; tap "Rotate access
    code" on the Security Review tile to do it on demand. The new
    code is shown on the tile as plain English.
  fields:
    reason:
      name: Why are you rotating?
      description: A short note that goes into the audit log (e.g. "manual", "scheduled_90_day", "lockout_recovery"). Most operators leave this blank.
      required: false
      default: "manual"
      example: "manual"
      selector:
        text: {}
    force:
      name: Force-rotate even if a recent rotation is in the backup file
      description: By default, RoamCore appends to the backup file. Turn this on to overwrite the backup file with the new state.
      required: false
      default: false
      selector:
        boolean: {}

audit_ssh:
  name: Audit SSH settings
  description: >-
    Check the SSH settings on the Hub and surface a plain-English
    warning for each risky setting (for example, "Your SSH allows
    password login — switch to keys" or "Your SSH allows root
    login"). Read-only — RoamCore does not change the SSH config
    itself. RoamCore runs this every night at 02:30; tap "Audit SSH
    now" on the Security Review tile to run it on demand.
  fields: {}

audit_firewall:
  name: Audit firewall rules
  description: >-
    Check the firewall rules on the Hub and surface a plain-English
    warning for each risky rule (for example, "Port 22 (SSH) is open
    to the whole internet — restrict to your IP range"). Read-only —
    RoamCore does not change the firewall itself. RoamCore runs
    this every night at 02:45; tap "Audit firewall now" on the
    Security Review tile to run it on demand.
  fields: {}
