name: Deploy RoamCore site (home + docs)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material

      - name: Build MkDocs (into public/docs)
        run: |
          mkdocs build --clean

      - name: Assemble site root (public/)
        run: |
          mkdir -p public
          # Keep the simple static homepage at /
          cp -a site-home/. public/
          # Docs already built into public/docs
          test -f public/docs/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
