name: Catalog

# Catalog robot. Runs on every push to main.
# Regenerates connections/registry.json + docs/connections/<id>.md from
# the connection.yml manifests, commits the result.
#
# This is the wizard-stays-honest guarantee. When a new connection merges,
# the wizard on every user's HA install picks up the new row on their next
# install.sh run.

on:
  push:
    branches: [main]
    paths:
      - 'connections/**/connection.yml'
      - 'connections/_schema/**'
      - 'scripts/audit_connections.py'
      - 'scripts/build_catalog.py'
      - '.github/workflows/catalog.yml'

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate catalog artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Run audit (writes registry + report)
        run: |
          python scripts/audit_connections.py

      - name: Build catalog pages (one per connection)
        run: |
          python scripts/build_catalog.py

      - name: Open auto-PR if anything changed
        run: |
          git config user.name "roamcore-bot"
          git config user.email "bot@roamcore.local"
          git add connections/registry.json docs/connections/ || true
          if git diff --cached --quiet; then
            echo "No catalog changes — nothing to do."
            exit 0
          fi
          git commit -m "chore(catalog): regenerate from connection manifests" \
            -m "Triggered by push to main." \
            -m "This commit is auto-generated by .github/workflows/catalog.yml. Do not edit by hand."
          git push
